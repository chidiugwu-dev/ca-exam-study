"answer":1,"area":"III.D","explanation":"Plan A is the basic plan.","id":"MB-43"},{"n":44,"stem":"The notice Original Medicare sends showing services billed, Medicare's payment, and what the beneficiary may owe is the:","choices":["Explanation of Coverage","Outline of Coverage","Annual Rate Guide","Medicare Summary Notice (MSN)"],"answer":3,"area":"III.D","explanation":"It is not a bill.","id":"MB-44"},{"n":45,"stem":"Compared with a 30-day elimination period, a 90-day elimination period on the same policy will:","choices":["Have a lower premium","Pay a larger monthly benefit","Have a higher premium","Pay benefits sooner"],"answer":0,"area":"IV","explanation":"A longer wait means less risk for the insurer.","id":"MB-45"},{"n":46,"stem":"A dentist wants coverage to pay office rent and staff salaries if she is disabled. She needs:","choices":["Hospital indemnity","A disability buy-out policy","Key person life insurance","Business overhead expense insurance"],"answer":3,"area":"IV","explanation":"BOE covers ongoing business expenses, not the owner's income.","id":"MB-46"},{"n":47,"stem":"An employee receives benefits from a group LTD plan fully paid by the employer, with premiums excluded from the employee's income. The benefits are:","choices":["Tax-free to the employee","Taxable to the employer","Taxable only above $50,000","Taxable to the employee"],"answer":3,"area":"IV","explanation":"Employer-paid, excluded premiums result in taxable benefits.","id":"MB-47"},{"n":48,"stem":"A California Partnership LTC policy provides:","choices":["Free Medicare Part B","Guaranteed lower premiums","Unlimited lifetime benefits","Dollar-for-dollar asset protection when applying for Medi-Cal"],"answer":3,"area":"V","explanation":"Agents need additional Partnership training.","id":"MB-48"},{"n":49,"stem":"An applicant receives an individual LTC policy on May 1 and returns it by first-class mail on May 25. The applicant:","choices":["Gets a 50% refund","Is entitled to a full premium refund under the 30-day free look","Must pay a cancellation fee","Gets no refund"],"answer":1,"area":"V","explanation":"CIC 10232.7: 30 days; the policy is void from the beginning.","id":"MB-49"},{"n":50,"stem":"Under tax-qualified LTC standards, a benefit trigger is the inability to perform:","choices":["Three IADLs","All six ADLs","At least two of six ADLs, expected to last at least 90 days","Any one ADL for a week"],"answer":2,"area":"V","explanation":"Severe cognitive impairment is an alternative trigger.","id":"MB-50"}],"minutes":60,"meta":"50 questions  |  Time limit: 60 minutes  |  Target: 80% or higher (40+ correct)","notes":["Outline mix: I.A = 4, I.B = 2, I.C = 6, II = 3, III.A = 9, III.B = 5, III.C = 5, III.D = 10, IV = 3, V = 3"],"tagged":true},{"code":"MK","title":"Full-Length Mock Exam (Day 6) - 75 questions matching the official outline","questions":[{"n":1,"stem":"Which element is required for a risk to be insurable?","choices":["The loss must be catastrophic to all insureds at once","The loss must be accidental from the insured's standpoint","The loss must be intentional","Only a few similar exposures may exist"],"answer":1,"area":"I.A","explanation":"Insurable losses are accidental, measurable, and spread among many exposures.","id":"MK-1"},{"n":2,"stem":"A policyholder who files an inflated claim to recover his deductible shows a:","choices":["Moral hazard","Physical hazard","Speculative risk","Morale hazard"],"answer":0,"area":"I.A","explanation":"Dishonesty = moral hazard.","id":"MK-2"},{"n":3,"stem":"Accidents, illnesses, and injuries are all examples of:","choices":["Exposure units","Hazards","Premiums","Perils"],"answer":3,"area":"I.A","explanation":"A peril is the cause of loss.","id":"MK-3"},{"n":4,"stem":"The insurer's ability to predict losses improves as:","choices":["The number of agents increases","The number of similar exposure units increases","Premiums increase","The deductible decreases"],"answer":1,"area":"I.A","explanation":"The law of large numbers.","id":"MK-4"},{"n":5,"stem":"Which insurance principle keeps an insured from profiting from a medical expense loss?","choices":["Utmost good faith","Aleatory","Adhesion","Indemnity"],"answer":3,"area":"I.A","explanation":"Indemnity restores; it does not enrich.","id":"MK-5"},{"n":6,"stem":"The first step of the underwriting process typically is:","choices":["Gathering information about the applicant, starting with the application and agent's report","Issuing the policy","Setting the agent's commission","Paying the first claim"],"answer":0,"area":"I.A","explanation":"Underwriting then evaluates, classifies, and decides.","id":"MK-6"},{"n":7,"stem":"Insurable events, under California law, are generally:","choices":["Only events caused intentionally","Only events that are certain to happen","Contingent or unknown events, past or future, that may damage a person having an insurable interest","Only events approved by the agent"],"answer":2,"area":"I.A","explanation":"CIC 250 (insurable events).","id":"MK-7"},{"n":8,"stem":"Which is NOT one of the four basic elements of a legal contract?","choices":["Notarization","Competent parties","Agreement (offer and acceptance)","Legal purpose"],"answer":0,"area":"I.B","explanation":"The fourth element is consideration.","id":"MK-8"},{"n":9,"stem":"A policy is a 'personal contract' because:","choices":["It is sold only in person","It can be freely assigned without notice","It insures a person, and the insurer may consider who the insured is","It covers only personal property"],"answer":2,"area":"I.B","explanation":"The insurer contracts based on the individual's characteristics.","id":"MK-9"},{"n":10,"stem":"Under California law, a representation is false when:","choices":["The insurer later changes its rates","The facts fail to correspond with its assertions or stipulations","A claim is filed","The agent forgets it"],"answer":1,"area":"I.B","explanation":"CIC 358 objective.","id":"MK-10"},{"n":11,"stem":"Under California law, a representation cannot qualify an express provision of the contract, but it may qualify:","choices":["The Commissioner's regulations","The premium","An implied warranty","The insurer's charter"],"answer":2,"area":"I.B","explanation":"CIC 354 objective.","id":"MK-11"},{"n":12,"stem":"An insurer formed under the laws of Japan and doing business in California is a(n):","choices":["Domestic insurer","Alien insurer","Foreign insurer","Fraternal insurer"],"answer":1,"area":"I.C","explanation":"Alien = formed outside the U.S.","id":"MK-12"},{"n":13,"stem":"Authority not written in the agency contract but reasonably necessary to carry out the agent's express duties is:","choices":["Apparent authority","Binding authority","Express authority","Implied authority"],"answer":3,"area":"I.C","explanation":"Implied authority flows from express authority.","id":"MK-13"},{"n":14,"stem":"Under the Insurance Information and Privacy Protection Act, insurers and agents must generally:","choices":["Avoid collecting any information","Publish applicants' medical records","Limit disclosure of personal information collected in insurance transactions and give required notices","Sell customer lists to anyone"],"answer":2,"area":"I.C","explanation":"CIC 791-791.29.","id":"MK-14"},{"n":15,"stem":"Which of the following is an unfair claims settlement practice under CIC 790.03(h)?","choices":["Directly advising a claimant not to obtain the services of an attorney","Acknowledging a claim within 15 days","Paying a claim promptly","Explaining a denial in writing"],"answer":0,"area":"I.C","explanation":"CIC 790.03(h)(14).","id":"MK-15"},{"n":16,"stem":"Under the Fair Claims regulations (for claims where the 40-day rule applies), after receiving proof of claim the insurer must accept or deny within:","choices":["40 calendar days","15 calendar days","21 calendar days","90 calendar days"],"answer":0,"area":"I.C","explanation":"10 CCR 2695.7(b); health and disability income claims follow separate Code timelines.","id":"MK-16"},{"n":17,"stem":"Commingling premiums with the agent's personal funds, beyond what the law allows, violates the agent's:","choices":["E&O coverage","Apparent authority","Express authority","Fiduciary duty"],"answer":3,"area":"I.C","explanation":"CIC 1733-1735.","id":"MK-17"},{"n":18,"stem":"Who may transact accident and health insurance in California?","choices":["Any licensed property agent","Any notary public","A person holding a valid license with that authority","Anyone employed by an insurer"],"answer":2,"area":"I.C","explanation":"CIC 1631 prohibits unlicensed transaction; CIC 1633 sets penalties.","id":"MK-18"},{"n":19,"stem":"A dread disease policy that covers only cancer is an example of a:","choices":["Long-term care policy","Limited benefit policy","Major medical policy","Group disability policy"],"answer":1,"area":"II","explanation":"Limited policies cover specified diseases or services.","id":"MK-19"},{"n":20,"stem":"A travel accident policy covers:","choices":["All illnesses abroad","Long-term care while traveling","Accidental injury or death while traveling, often on a common carrier","Lost luggage only"],"answer":2,"area":"II","explanation":"It is a limited policy.","id":"MK-20"},{"n":21,"stem":"Which renewability provision is LEAST favorable to the insured?","choices":["Conditionally renewable","Cancellable","Guaranteed renewable","Noncancelable"],"answer":1,"area":"II","explanation":"The insurer may end coverage at any time with notice.","id":"MK-21"},{"n":22,"stem":"Under 'accidental means,' coverage applies only if:","choices":["Only the result was unintended","The injury happened at work","Both the cause and the result of the injury were unintended","The injury was self-inflicted"],"answer":2,"area":"II","explanation":"This is narrower than accidental bodily injury.","id":"MK-22"},{"n":23,"stem":"Which plan type typically restricts coverage to network providers and requires a PCP gatekeeper?","choices":["Fee-for-service major medical","Indemnity","PPO","HMO"],"answer":3,"area":"III.A","explanation":"HMO = gatekeeper + network.","id":"MK-23"},{"n":24,"stem":"A plan member has a $1,500 deductible and 90/10 coinsurance. For a $7,500 allowed claim, the member pays:","choices":["$750","$1,500","$6,000","$2,100"],"answer":3,"area":"III.A","explanation":"$1,500 + 10% of $6,000 ($600) = $2,100.","id":"MK-24"},{"n":25,"stem":"Which consumer-driven arrangement must be paired with a qualified high-deductible health plan?","choices":["Flexible Spending Arrangement","Hospital indemnity","Health Reimbursement Arrangement","Health Savings Account"],"answer":3,"area":"III.A","explanation":"HSA eligibility requires HDHP coverage.","id":"MK-25"},{"n":26,"stem":"Coinsurance in a medical expense plan is:","choices":["The percentage of covered costs the insured shares after the deductible","The monthly premium","The amount paid before benefits begin","A flat fee per visit"],"answer":0,"area":"III.A","explanation":"For example, 80/20 coinsurance.","id":"MK-26"},{"n":27,"stem":"A PPO pays 80% in-network and 60% out-of-network. This structure is designed to:","choices":["Prohibit out-of-network care","Eliminate deductibles","Replace Medicare","Encourage members to use network providers"],"answer":3,"area":"III.A","explanation":"PPOs steer to network providers through cost sharing.","id":"MK-27"},{"n":28,"stem":"Which of these is typically a common exclusion in medical expense policies?","choices":["Emergency room services","Laboratory tests","Injuries resulting from war or an act of war","Childbirth"],"answer":2,"area":"III.A","explanation":"Common exclusions are a listed objective.","id":"MK-28"},{"n":29,"stem":"An HSA account holder changes employers. The HSA balance:","choices":["Stays with the account holder","Is paid to the insurer","Must be spent within 30 days","Is forfeited to the former employer"],"answer":0,"area":"III.A","explanation":"HSAs are portable.","id":"MK-29"},{"n":30,"stem":"An employer-funded arrangement that reimburses employees for medical expenses, with funds owned by the employer, is a(n):","choices":["IRA","HSA","HRA","MSA"],"answer":2,"area":"III.A","explanation":"HRAs are funded only by the employer.","id":"MK-30"},{"n":31,"stem":"Under the CDI objectives, which is a mandatory benefit in health plans?","choices":["Adult vision benefits","Limited pediatric vision benefits","LASIK surgery","Adult orthodontia"],"answer":1,"area":"III.A","explanation":"Adult dental and vision are optional.","id":"MK-31"},{"n":32,"stem":"A plan's 'maximum out-of-pocket' limit protects the insured by:","choices":["Fixing the premium for life","Capping the insurer's lifetime payments","Limiting the number of doctor visits","Capping their annual cost sharing for covered services"],"answer":3,"area":"III.A","explanation":"After the max, the plan pays 100%.","id":"MK-32"},{"n":33,"stem":"The right of a health insurer to recover costs from a responsible third party after paying a claim is:","choices":["Subrogation","Assignment","Coordination of benefits","Waiver"],"answer":0,"area":"III.A","explanation":"It prevents double recovery.","id":"MK-33"},{"n":34,"stem":"If an individual medical policy's premium is not paid by the due date, coverage continues during the:","choices":["Probationary period","Grace period","Free-look period","Elimination period"],"answer":1,"area":"III.A","explanation":"Grace periods are mandatory uniform provisions.","id":"MK-34"},{"n":35,"stem":"Which describes an EPO compared with an HMO?","choices":["EPOs are regulated only by Medicare","EPOs have no network","EPOs always require referrals","Both use exclusive networks, but EPOs usually do not require PCP referrals"],"answer":3,"area":"III.A","explanation":"EPO = exclusive network, PPO-style access.","id":"MK-35"},{"n":36,"stem":"A health FSA participant contributes $2,000 and spends $1,400 by the plan's deadline, with no carryover or grace period offered. The unspent $600 is generally:","choices":["Forfeited","Added to next year's paycheck","Moved to an HSA","Refunded as cash"],"answer":0,"area":"III.A","explanation":"Use-it-or-lose-it.","id":"MK-36"},{"n":37,"stem":"A key underwriting factor in large group health insurance is:","choices":["The group's prior claims experience","The employer's advertising budget","Each employee's medical exam","Each employee's credit history"],"answer":0,"area":"III.B","explanation":"Group size and occupations also matter.","id":"MK-37"},{"n":38,"stem":"An employer self-insures its health plan and buys coverage that pays claims above a set level. That coverage is:","choices":["Blanket insurance","Stop-loss insurance","Reinsurance of agents","Medicare supplement"],"answer":1,"area":"III.B","explanation":"Stop-loss protects self-funded plans.","id":"MK-38"},{"n":39,"stem":"Under California's guidance, self-insured 'association' health plans are:","choices":["Required for small groups","Regulated by Medicare","Prohibited by regulation","Encouraged for individuals"],"answer":2,"area":"III.B","explanation":"CDI objective.","id":"MK-39"},{"n":40,"stem":"Under federal COBRA, a qualifying event that gives a covered employee 18 months of continuation is:","choices":["The employee's death","A reduction in work hours that causes loss of coverage","The employee's Medicare entitlement","Divorce"],"answer":1,"area":"III.B","explanation":"Death, divorce, and Medicare entitlement give dependents 36 months.","id":"MK-40"},{"n":41,"stem":"Cal-COBRA allows qualified beneficiaries to continue coverage for up to:","choices":["18 months","12 months","36 months","24 months"],"answer":2,"area":"III.B","explanation":"It applies to employers with 2-19 employees and extends federal COBRA.","id":"MK-41"},{"n":42,"stem":"Group health plans subject to HIPAA may NOT:","choices":["Deny eligibility to an employee because of health status","Require a waiting period for new hires","Use provider networks","Charge different rates for family coverage"],"answer":0,"area":"III.B","explanation":"HIPAA nondiscrimination rules.","id":"MK-42"},{"n":43,"stem":"Under the ACA, 'affordability' of employer coverage matters because:","choices":["Employees must then enroll in Medicare","If employer coverage is unaffordable, a full-time employee may qualify for a premium tax credit, which can trigger an employer payment","Unaffordable plans are automatically canceled","Employers must pay double premiums"],"answer":1,"area":"III.B","explanation":"Employer shared responsibility.","id":"MK-43"},{"n":44,"stem":"A blanket health policy issued to a sports league covering all players is:","choices":["Blanket insurance","Franchise insurance","Credit insurance","Individual insurance"],"answer":0,"area":"III.B","explanation":"CIC 10270.2.","id":"MK-44"},{"n":45,"stem":"A Platinum plan has an actuarial value of about:","choices":["90%","60%","70%","80%"],"answer":0,"area":"III.C","explanation":"Platinum has the highest AV.","id":"MK-45"},{"n":46,"stem":"Which is required of a health plan under the ACA?","choices":["Coverage only until age 21 for dependents","A preexisting condition waiting period","Coverage of essential health benefits without annual or lifetime dollar limits","Medical underwriting"],"answer":2,"area":"III.C","explanation":"EHB protections.","id":"MK-46"},{"n":47,"stem":"A qualified health plan purchased through Covered California is required in order to receive:","choices":["Cal-COBRA","Premium tax credits","Medicare Part B","Medi-Cal share of cost"],"answer":1,"area":"III.C","explanation":"Off-exchange plans do not qualify.","id":"MK-47"},{"n":48,"stem":"A person who loses employer coverage mid-year may enroll in an individual plan during a(n):","choices":["General Enrollment Period","Medicare Initial Enrollment Period","Special Enrollment Period","Free-look period"],"answer":2,"area":"III.C","explanation":"Loss of coverage is a qualifying life event.","id":"MK-48"},{"n":49,"stem":"Per the CDI objectives, the medical loss ratio required for individual plans is:","choices":["75%","65%","90%","80%"],"answer":3,"area":"III.C","explanation":"Group: 85%.","id":"MK-49"},{"n":50,"stem":"A household at 200% FPL buying a Silver plan through Covered California may qualify for:","choices":["Cost sharing reductions and premium tax credits","No assistance","Medicare Part A","Cal-COBRA"],"answer":0,"area":"III.C","explanation":"CSRs: 138%-250% FPL; APTC up to 400% FPL per CDI objectives.","id":"MK-50"},{"n":51,"stem":"Under the ACA, insurers may not:","choices":["Rescind coverage or deny issue because of an applicant's health status","Offer different metal tiers","Use provider networks","Charge premiums"],"answer":0,"area":"III.C","explanation":"Guaranteed issue.","id":"MK-51"},{"n":52,"stem":"An applicable large employer under the ACA has at least:","choices":["200 full-time employees","50 full-time employees, including equivalents","25 full-time employees","10 full-time employees"],"answer":1,"area":"III.C","explanation":"ALEs are subject to employer shared responsibility.","id":"MK-52"},{"n":53,"stem":"Original Medicare consists of:","choices":["Part C and Part D","Medicare supplement and Part C","Part B and Part D","Part A and Part B"],"answer":3,"area":"III.D","explanation":"Medicare Advantage (Part C) is the private alternative.","id":"MK-53"},{"n":54,"stem":"A beneficiary with 35 Social Security credits will generally:","choices":["Receive Part A premium-free","Pay the full Part A premium","Pay a reduced monthly premium for Part A","Be ineligible for Part A"],"answer":2,"area":"III.D","explanation":"30-39 credits = reduced premium; 0-29 = full premium.","id":"MK-54"},{"n":55,"stem":"A beneficiary who uses all 60 lifetime reserve days and remains hospitalized:","choices":["Gets 60 more reserve days","Is moved to Part B coverage","Is covered in full by Medicare","Pays all further hospital costs, with no out-of-pocket maximum"],"answer":3,"area":"III.D","explanation":"CDI objective; Medigap Plan A adds 365 extra hospital days.","id":"MK-55"},{"n":56,"stem":"Which service is covered by Medicare Part B?","choices":["Physician services in and out of the hospital","Long-term custodial care","Routine dental care","Inpatient room and board"],"answer":0,"area":"III.D","explanation":"Part B covers outpatient and physician services.","id":"MK-56"},{"n":57,"stem":"Medicare Part B has:","choices":["No premium","A $2,000 annual out-of-pocket maximum","No annual out-of-pocket maximum","No deductible"],"answer":2,"area":"III.D","explanation":"That gap is one reason people buy Medigap.","id":"MK-57"},{"n":58,"stem":"A person who delays Part B because they are covered by an employer group plan through current employment:","choices":["Must buy Part D immediately","May enroll later without penalty","Loses Medicare eligibility","Always pays a 10% penalty"],"answer":1,"area":"III.D","explanation":"An 8-month SEP applies after the coverage or employment ends.","id":"MK-58"},{"n":59,"stem":"Medicare Advantage plans may:","choices":["Cover fewer benefits than Original Medicare","Be combined with a Medigap policy to pay claims","Be sold only by CMS","Offer extra benefits not covered by Original Medicare"],"answer":3,"area":"III.D","explanation":"They must cover all Original Medicare benefits.","id":"MK-59"},{"n":60,"stem":"Part D prescription drug coverage can be obtained:","choices":["As a stand-alone PDP or within a Medicare Advantage plan (MAPD)","Only through Medi-Cal","Only from Medigap Plan F","Only through employer plans"],"answer":0,"area":"III.D","explanation":"A beneficiary may enroll in a PDP if enrolled in Part A and/or Part B.","id":"MK-60"},{"n":61,"stem":"Medicare claims under Original Medicare are generally submitted by:","choices":["Health care providers and suppliers to CMS","HICAP","The beneficiary only","The Medigap insurer to CMS"],"answer":0,"area":"III.D","explanation":"CDI objective.","id":"MK-61"},{"n":62,"stem":"Under California law, a Medicare supplement applicant applying during the open enrollment period with at least six months of prior creditable coverage:","choices":["Must pay a higher premium for health status","Cannot have benefits excluded for preexisting conditions","Must wait 12 months for coverage","May be denied for health reasons"],"answer":1,"area":"III.D","explanation":"CIC 10192.11(b)(1).","id":"MK-62"},{"n":63,"stem":"A Medicare supplement policyholder turns 70 on June 10. Under California's birthday rule, she may switch to a plan with equal or lesser benefits without underwriting:","choices":["Only during the 30 days before June 10","Only once in a lifetime","Only in October","During the 60 days beginning June 10"],"answer":3,"area":"III.D","explanation":"CIC 10192.11(h).","id":"MK-63"},{"n":64,"stem":"Selling a Medicare supplement policy to someone who already has one, when it duplicates coverage, is:","choices":["Required by law","Allowed if commissions are disclosed","A form of coordination of benefits","Inappropriate sales and replacement, and prohibited"],"answer":3,"area":"III.D","explanation":"CIC 10192.20 and the duplicate-coverage application question.","id":"MK-64"},{"n":65,"stem":"Before setting a personal marketing appointment for Medicare Advantage or Part D, CMS rules require the agent to document a:","choices":["HIPAA waiver","Scope of Appointment","Certificate of authority","Medigap outline of coverage"],"answer":1,"area":"III.D","explanation":"CMS marketing compliance (SOA, call recording, TPMO disclaimer).","id":"MK-65"},{"n":66,"stem":"Medi-Cal is:","choices":["A private insurance company","A federal program for everyone over 65","A type of Medicare supplement","California's Medicaid program, a needs-based joint federal-state program"],"answer":3,"area":"III.D","explanation":"Dual eligibles may join a D-SNP.","id":"MK-66"},{"n":67,"stem":"Which statement about HICAP is correct?","choices":["It licenses insurance agents","It provides free counseling and some legal assistance on Medicare and Medi-Cal","It sets Medicare premiums","It sells Medicare supplement policies"],"answer":1,"area":"III.D","explanation":"HICAP is federally mandated and state and federally funded.","id":"MK-67"},{"n":68,"stem":"A surgeon who can no longer operate but can teach is still considered totally disabled under which definition?","choices":["Own occupation","Any occupation","Presumptive disability only","Social Security"],"answer":0,"area":"IV","explanation":"Own-occupation is the most favorable definition.","id":"MK-68"},{"n":69,"stem":"An individual disability income policy paid with personal after-tax funds produces benefits that are:","choices":["Taxable","Not taxable","Taxable above 60% of salary","Taxed only if over age 65"],"answer":1,"area":"IV","explanation":"Tax treatment follows who paid and how.","id":"MK-69"},{"n":70,"stem":"Premiums for a disability buy-out policy are:","choices":["Paid by Medicare","Not tax-deductible, and benefits are generally received tax-free","Deductible, with taxable benefits","Deductible, with tax-free benefits"],"answer":1,"area":"IV","explanation":"Contrast with BOE, which has deductible premiums and taxable benefits.","id":"MK-70"},{"n":71,"stem":"Disability income insurers set rates using morbidity, expenses, investment return, and:","choices":["The color of the insured's car","The applicant's political views","Benefit duration features such as elimination and benefit periods","The agent's age"],"answer":2,"area":"IV","explanation":"These are the listed rate-making components.","id":"MK-71"},{"n":72,"stem":"Which care setting provides housing, meals, and help with ADLs, but not full skilled nursing?","choices":["Intensive care unit","Acute care hospital","Assisted living facility","Surgical center"],"answer":2,"area":"V","explanation":"RCFEs are California's residential care facilities for the elderly.","id":"MK-72"},{"n":73,"stem":"Before soliciting LTC, an agent licensed in 2024 must complete:","choices":["A life agent exam","A Covered California certification","The initial 8 hours of LTC training","A Medicare certification"],"answer":2,"area":"V","explanation":"CIC 10234.93: 8 hours in each of the first four 12-month periods.","id":"MK-73"},{"n":74,"stem":"An LTC policy that is endorsed to a life insurance or annuity contract is:","choices":["A Partnership policy by definition","A Medicare supplement","Prohibited in California","One of the available forms of LTC coverage"],"answer":3,"area":"V","explanation":"CDI objective: endorsement/rider to life or annuity.","id":"MK-74"},{"n":75,"stem":"The suitability standards for LTC sales require that the agent and insurer:","choices":["Sell the most expensive policy","Skip disclosure for seniors over 80","Consider whether the coverage fits the applicant's needs and finances, using the Personal Worksheet","Ignore existing coverage"],"answer":2,"area":"V","explanation":"CIC 10234.95.","id":"MK-75"}],"minutes":90,"meta":"75 questions  |  Time limit: 90 minutes  |  Target: 80% or higher (60+ correct)","notes":["Outline mix: I.A = 7, I.B = 4, I.C = 7, II = 4, III.A = 14, III.B = 8, III.C = 8, III.D = 15, IV = 4, V = 4","Mock rules: one sitting, 90 minutes, no notes, no phone, scratch paper only. The CDI objectives state 90 minutes and the PSI bulletin states 105; training at 90 builds a time cushion."],"tagged":true}],"scoreLogIntro":"Official pass line: 60% (45 of 75 on the real exam). Plan targets: 80%+ on topic sets, 75%+ on Mixed A, 80%+ on Mixed B and the mock. Practice scores usually run higher than test-day scores, so aim well above 60%.","scoreLogPlan":[{"date":"Tue Oct 6","set":"Diagnostic","of":"/20"},{"date":"Wed Oct 7","set":"Set 1","of":"/25"},{"date":"Wed Oct 7","set":"Set 2","of":"/25"},{"date":"Thu Oct 8","set":"Set 3","of":"/25"},{"date":"Thu Oct 8","set":"Set 4","of":"/25"},{"date":"Fri Oct 9","set":"Set 5","of":"/25"},{"date":"Fri Oct 9","set":"Mixed Exam A","of":"/50"},{"date":"Sat Oct 10","set":"Set 6","of":"/25"},{"date":"Sun Oct 11","set":"Set 7","of":"/25"},{"date":"Sun Oct 11","set":"Set 8","of":"/25"},{"date":"Sun Oct 11","set":"Mixed Exam B","of":"/50"},{"date":"Mon Oct 12","set":"Full Mock","of":"/75"}],"areas":[{"code":"I.A","name":"Basic concepts & principles","mockItems":7},{"code":"I.B","name":"Contract law","mockItems":4},{"code":"I.C","name":"Insurance marketplace (CA law, ethics, claims)","mockItems":7},{"code":"II","name":"General concepts of medical & disability","mockItems":4},{"code":"III.A","name":"Individual medical expense","mockItems":14},{"code":"III.B","name":"Group medical expense","mockItems":8},{"code":"III.C","name":"PPACA","mockItems":8},{"code":"III.D","name":"Senior health products","mockItems":15},{"code":"IV","name":"Disability income","mockItems":4},{"code":"V","name":"Long-term care","mockItems":4}],"drillTitle":"6. Weak-Area Drill Protocol (any set under 80%)","drillSteps":["Diagnose (10 min). For every miss and every lucky guess, write the outline code and the cause: K = didn't know it, C = confused two similar rules, R = misread the question (missed NOT, EXCEPT, or a number).","Fix misreads first (5 min). For each R item, rewrite the stem and underline the key qualifier. Rule for the next set: read every stem twice before reading the options.","Re-learn (20-25 min). For K and C items, re-read that LEO section and your notes. For C items, make a side-by-side contrast table (for example, HMO vs. EPO, or guaranteed renewable vs. noncancelable).","Encode (10 min). Write 2-3 new Red flashcards for each missed concept, phrased as questions.","Blank-page recall (5 min). Close everything and write the concept from memory; check it and fix it.","Transfer (15 min). Answer every question on the same outline code from other sets you've already taken, without looking at the keys first.","Retest cold (next day). Re-answer the original misses at the start of the next day's spaced-review block. You pass at 80%+ on the retest.","Escalate. If the retest is still under 80%, schedule a second drill in the next day's Block 8 and add that area to the Day 6 afternoon repair drills.","Log it. Record the weak topics and the drill in Section 5."],"drillPriority":["Priority rule: when time is short, drill by exam weight first: Senior Health (15) > Individual Medical (14) > Group (8) = PPACA (8) > Marketplace (7) = Basic Concepts (7) > the 4-question areas."],"examDayNote":"Example below assumes a 9:00 AM PT appointment. For a different time, shift everything so you wake about 3 hours before the appointment.","examDay":[{"time":"6:00 AM","action":"Wake (after 8.5 hours of sleep). Water, daylight, 10-minute walk."},{"time":"6:15 AM","action":"Breakfast you've eaten before (protein + complex carbs). Normal amount of caffeine only."},{"time":"6:45-7:15 AM","action":"LIGHT review only: the one-page numbers sheet and the Red flashcard pile. No new material and no practice tests."},{"time":"7:15 AM","action":"Dress in layers without pockets or hoods (PSI rules). Pack your ID and appointment confirmation."},{"time":"7:45 AM","action":"Leave, allowing for traffic and parking (the Los Angeles CDI site lists nearby garages in the PSI bulletin)."},{"time":"By 8:30 AM","action":"ARRIVE at least 30 minutes early. PSI does not admit late arrivals, and you lose the exam fee."},{"time":"Check-in","action":"ID check, thumbprint, and photo. Put all personal items in a locker or your car: phone, watch, wallet, bag, notes, food, and drinks are not allowed. Use the restroom."},{"time":"Exam start","action":"The on-screen tutorial (up to 15 minutes) does not count against exam time; use it to settle your breathing."}],"bring":["ONE valid, unexpired, government-issued ID with a photo AND a signature. The name must exactly match your PSI registration.","Accepted at test centers: driver's license (any state), California ID card, passport or passport card, military ID, employment authorization card, permanent resident card, or Veteran Health Identification card with photo.","An expired California ID is accepted only together with its paper extension; names and numbers must match.","If you can't provide the required ID, PSI says to call (833) 518-7456 at least three weeks in advance. Arriving without valid ID counts as a missed exam.","Scratch paper and a pencil (or an LCD tablet) are provided at test centers. Do not bring your own.","Taking it remotely? You need a driver's license, California ID, passport or passport card, employment authorization card, or permanent resident card. Clear the room and desk, no scratch paper unless the proctor allows it, keep both hands visible, and no breaks, food, or drinks."],"tactics":["Pace: about 72 seconds per question. Checkpoints (on a 90-minute clock): question 25 by 30 minutes, question 50 by 60 minutes, and finished by 85 minutes. If PSI gives you 105 minutes, use the extra time for review.","Expect unscored items: 1-10 experimental questions may appear. You can't tell which they are, so treat every question as scored and don't let a strange one rattle you.","Read the stem twice. Circle qualifiers mentally: NOT, EXCEPT, MOST, FIRST, and California-specific wording.","Predict, then choose: Answer in your head before reading the options, then eliminate clearly wrong ones.","California beats generic: When an option reflects a California rule (Cal-COBRA, the 30-day Medigap and LTC free look, the birthday rule, CDI vs. DMHC), it's usually the one being tested.","Mark and move: If a question takes over 90 seconds, choose your best answer, flag it, and come back at the end.","Answer everything: Your result depends on the number answered correctly, so never leave a blank.","Change answers only for a reason, such as finding a misread or remembering a specific rule. Don't change them on a vague feeling.","Results: Pass or fail appears on screen when you finish, and PSI emails a score report (a fail report shows how many you answered correctly)."],"sources":[{"key":"S1","source":"CDI - Examinations: Time Limit and Number of Questions","url":"https://www.insurance.ca.gov/0200-industry/0010-producer-online-services/0200-exam-info/examtimesandquestion.cfm"},{"key":"S2","source":"PSI - California Department of Insurance Candidate Information Bulletin (rev. March 2026)","url":"https://test-takers.psiexams.com/api/content/bulletin/2530  (CDI-hosted copy: https://www.insurance.ca.gov/0200-industry/0020-apply-license/0100-indiv-resident/upload/CA-State-License-Board3.pdf)"},{"key":"S3","source":"CDI - 2025 Accident and Health or Sickness License Examination Objectives (topic weights, CIC references)","url":"https://www.insurance.ca.gov/0200-industry/0030-seek-pre-lic/upload/2025-Accident-and-Health-or-Sickness-License-Examination-Objectives.docx  (index: https://www.insurance.ca.gov/0200-industry/0030-seek-pre-lic/prelicensing-educational-objectives.cfm)"},{"key":"S4","source":"CDI - 12 Hours of Ethics and California Insurance Code FAQ","url":"https://www.insurance.ca.gov/0200-industry/0030-seek-pre-lic/0400-prelicensing-faq/0100-12-hours-of-ethics-california-insurance-code-frequent-questions/"},{"key":"S5","source":"CDI - Prelicensing Program Requirements (Dec 2025): A&H = 0 general hours + 12 ethics/CIC hours","url":"https://www.insurance.ca.gov/0200-industry/0040-seek-producer-forms/0200-education-providers/upload/446-8-Prelicensing-Program-Requirements-12-24-2025-Copy.pdf"},{"key":"S6","source":"California Insurance Code 1749 and Article 13.5 (prelicensing and CE)","url":"https://leginfo.legislature.ca.gov/faces/codes_displayText.xhtml?article=13.5.&chapter=5.&division=1.&lawCode=INS&part=2.&title="},{"key":"S7","source":"CIC 790.03 (unfair practices, unfair claims practices)","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=INS&sectionNum=790.03."},{"key":"S8","source":"CIC 781 (misrepresentation and twisting); CIC 777.1 (free insurance); CIC 1725.5 (license number); CIC 10382 (application alteration)","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=INS&sectionNum=781.  (same URL pattern with sectionNum=777.1. / 1725.5. / 10382.)"},{"key":"S9","source":"CIC 10350-10350.12 (mandatory uniform provisions)","url":"https://leginfo.legislature.ca.gov/faces/codes_displayText.xhtml?lawCode=INS&division=2.&title=&part=2.&chapter=4.&article=4."},{"key":"S10","source":"CIC 10192.11 (Medigap open enrollment, birthday rule, MA termination) and CIC 10192.17(e) (30-day free look)","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=INS&sectionNum=10192.11.  and ...sectionNum=10192.17."},{"key":"S11","source":"CIC 10232.7 (LTC 30-day free look) and CIC 10234.93 (LTC training, HICAP, prohibited practices)","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=INS&sectionNum=10234.93.  and ...sectionNum=10232.7."},{"key":"S12","source":"Cal-COBRA (CIC 10128.50 et seq.)","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=INS&sectionNum=10128.50."},{"key":"S13","source":"10 CCR 2695.5 and 2695.7 (Fair Claims Settlement Practices Regulations). Section numbers are cited in the CDI objectives [S3]; day counts were read from the regulation text on Cornell LII","url":"https://www.law.cornell.edu/regulations/california/10-CCR-2695.5  and  https://www.law.cornell.edu/regulations/california/10-CCR-2695.7"}],"verification":["Time limit conflict: CDI's exam page and the 2025 objectives say 90 minutes; PSI's bulletin table (revised March 2026) says 105 minutes. The extra time likely covers the unscored experimental items, but neither source says so. Check your PSI appointment confirmation.","Raw passing cutoff: Sources give 60% but no raw cutoff. 45 of 75 is our arithmetic.","Rebating: The CDI objectives do not list rebating, and no current Insurance Code section banning rebating of A&H premiums was found on leginfo. A secondary source says Proposition 103 (1988) repealed California's general anti-rebate law, with line-specific bans (for example, title insurance) still in place. This plan teaches the definition only and cites no section number. If an exam item asks, use the general definition.","Individual health free look: California free-look periods were confirmed for Medicare supplement (30 days) and individual LTC (30 days). A general free-look period for other individual disability/health policies was not confirmed, so the plan gives no number.","Health and DI claim timelines: The 40-day accept/deny and 30-day payment rules in 10 CCR 2695.7 expressly exclude disability (health) claims under CIC 10123.13 and disability income claims under CIC 10111.2. Those sections' deadlines were not verified and are not tested here.","Federal and program figures: COBRA, HIPAA, ACA metal tiers, Medicare structure (benefit periods, reserve days, penalties, enrollment windows), Part D, HSA penalty, and tax treatment are standard federal rules. They follow the CDI objectives where those give a figure and were not re-checked against federal sites for this plan. Yearly dollar amounts (deductibles, premiums, HSA limits) are left out on purpose.","Objectives vs. current law: Where the CDI objectives state a figure (e.g., group MLR 85%, APTC up to 400% FPL, CCSB, Medigap 'Plan A and C or F'), questions follow the objectives because the exam is built on them. The objectives still mention the Part D 'coverage gap,' which federal law restructured starting in 2025. If tested, answer using the objectives' terms.","Cal-COBRA details: The 2-19 employee threshold and 36-month maximum come from the Cal-COBRA statute and a CDI FAQ (search-result summary). The Cal-COBRA premium percentage was not verified and is not tested."]}</script>
<script>(function(){
'use strict';
var DATA = JSON.parse(document.getElementById('caah-data').textContent);
var NS = 'caah26:';
var EXAM_DATE = '2026-10-13';
var PASS = 60, TARGET = 80;

/* ---------- storage (namespaced, try/catch, in-memory fallback) ---------- */
var storageOK = true;
function lsGet(k){ try { return window.localStorage.getItem(NS + k); } catch(e){ storageOK = false; return null; } }
function lsSet(k, v){ try { window.localStorage.setItem(NS + k, v); return true; } catch(e){ storageOK = false; showBanner(); return false; } }
function lsDel(k){ try { window.localStorage.removeItem(NS + k); } catch(e){ storageOK = false; } }
(function probe(){ try { var t = NS + '__probe'; window.localStorage.setItem(t, '1'); window.localStorage.removeItem(t); } catch(e){ storageOK = false; } })();
var KEYS = ['attempts','qhist','sets','sched','recall','cards','notes','settings','sess'];
function DEFAULTS(){ return {attempts:[], qhist:{}, sets:{}, sched:{}, recall:{}, cards:{}, notes:'', settings:{theme:'auto', mockMinutes:90, shuffle:false}, sess:{}}; }
var S = DEFAULTS();
function loadAll(){
  var d = DEFAULTS();
  KEYS.forEach(function(k){
    var raw = lsGet(k);
    if (raw != null) { try { var v = JSON.parse(raw); if (v !== null && typeof v === typeof d[k] && Array.isArray(v) === Array.isArray(d[k])) d[k] = v; } catch(e){} }
  });
  if (d.settings.mockMinutes !== 105) d.settings.mockMinutes = 90;
  if (!d.settings.theme) d.settings.theme = 'auto';
  S = d;
  if (lsGet('v') == null) lsSet('v', '1');
}
function save(k){ lsSet(k, JSON.stringify(S[k])); }
function showBanner(){ var b = document.getElementById('banner'); if (b && !storageOK) b.hidden = false; }

/* ---------- data indexes ---------- */
var SETS = {}, Q = {}, SETORDER = [];
var AREA = {}; DATA.areas.forEach(function(a){ AREA[a.code] = a.name; });
var SHORT = {DX:'Diagnostic',S1:'Set 1',S2:'Set 2',S3:'Set 3',S4:'Set 4',S5:'Set 5',S6:'Set 6',S7:'Set 7',S8:'Set 8',MA:'Mixed Exam A',MB:'Mixed Exam B',MK:'Full Mock'};

/* ---------- helpers ---------- */
function $(s, r){ return (r || document).querySelector(s); }
function $all(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }

function pad(n){ return n < 10 ? '0' + n : '' + n; }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

function parseYmd(s){ var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }

function fmtTime(ts){ var d = new Date(ts); var h = d.getHours(), ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + pad(d.getMinutes()) + ' ' + ap; }
function fmtTs(ts){ var d = new Date(ts); return WD[d.getDay()] + ' ' + MON[d.getMonth()] + ' ' + d.getDate() + ', ' + fmtTime(ts); }
function pct(c, t){ return t ? Math.round(c * 1000 / t) / 10 : 0; }
function uid(){ return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function fmtClock(ms){ if (ms < 0) ms = 0; var s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? h + ':' + pad(m) : m) + ':' + pad(x); }
function colorFor(p){ return p >= TARGET ? 'var(--ok)' : p >= PASS ? 'var(--warn)' : 'var(--bad)'; }
function dayTag(date){ return DAYLABEL[date] ? fmtDay(date) + ' · ' + DAYLABEL[date] : fmtDay(date); }
function toast(msg){ var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 2600); }
function modal(opts){
  return new Promise(function(resolve){
    var w = document.createElement('div'); w.className = 'modal-wrap';
    var prev = document.activeElement;
    w.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mdl-t"><h2 id="mdl-t">' + esc(opts.title) + '</h2>' + (opts.html || ('<p>' + esc(opts.body || '') + '</p>')) +
      '<div class="row">' + (opts.cancel === false ? '' : '<button class="btn" data-r="0">' + esc(opts.cancel || 'Cancel') + '</button>') + '<button class="btn ' + (opts.danger ? 'danger' : 'primary') + '" data-r="1">' + esc(opts.ok || 'OK') + '</button></div></div>';
    var done = false;
    function close(v){ if (done) return; done = true; if (w.parentNode) w.parentNode.removeChild(w); document.removeEventListener('keydown', onKey); if (prev && prev.focus) try { prev.focus(); } catch(e){} resolve(v); }
    function onKey(e){ if (e.key === 'Escape') close(false); }
    w.addEventListener('click', function(e){ var b = e.target.closest('[data-r]'); if (b) close(b.getAttribute('data-r') === '1' ? (opts.collect ? (opts.collect(w) || true) : true) : false); else if (e.target === w) close(false); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(w);
    var f = w.querySelector('[data-r="1"]'); if (f) f.focus();
    if (opts.onOpen) opts.onOpen(w, close);
  });
}
function download(name, text, mime){
  try {
    var blob = new Blob([text], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  } catch(e) {}
}

/* ---------- recording progress (cumulative, never keyed by day) ---------- */
function recordAnswer(qid, chosen, ts, attemptId){
  var ok = !!(Q[qid] && chosen === Q[qid].q.answer);
  var h = S.qhist[qid] || {n:0, c:0, h:[]};
  h.n += 1; if (ok) h.c += 1;
  h.last = {a: chosen, ok: ok, ts: ts};
  h.h.push({a: chosen, ok: ok, ts: ts, att: attemptId || null, n: h.n});
  if (h.h.length > 40) h.h = h.h.slice(-40);
  S.qhist[qid] = h;
}
function finalizeSession(key, auto){
  var ss = S.sess[key]; if (!ss) return null;
  var now = Date.now(), id = uid();
  if (auto && ss.durMs) now = Math.min(now, ss.startTs + ss.durMs); // date an expired exam at its time limit
  var answers = [], correct = 0, topics = {}, answered = 0;
  ss.qids.forEach(function(qid){
    var ch = ss.ans.hasOwnProperty(qid) ? ss.ans[qid] : null;
    var ok = ch !== null && ch === Q[qid].q.answer;
    if (ch !== null) answered++;
    if (ok) correct++;
    var t = topicOf(qid); topics[t] = topics[t] || [0, 0]; topics[t][1]++; if (ok) topics[t][0]++;
    answers.push([qid, ch, ok ? 1 : 0]);
    if (ch !== null && !ss.recorded[qid]) recordAnswer(qid, ch, (ss.ansTs && ss.ansTs[qid]) || now, id);
    else if (ch !== null) { var hh = S.qhist[qid]; if (hh) for (var i = hh.h.length - 1; i >= 0; i--) if (hh.h[i].att === 'pending:' + ss.startTs) { hh.h[i].att = id; break; } }
  });
  var total = ss.qids.length, p = pct(correct, total);
  var weak = Object.keys(topics).filter(function(t){ return pct(topics[t][0], topics[t][1]) < TARGET; }).sort(function(a, b){ return pct(topics[a][0], topics[a][1]) - pct(topics[b][0], topics[b][1]); });
  var att = {id:id, ts:now, date:ymd(new Date(now)), start:ss.startTs, code:ss.code, kind:ss.kind, mode:ss.mode, title:ss.title, total:total, answered:answered, correct:correct, pct:p, topics:topics, weak:weak, answers:answers, flags:Object.keys(ss.flags || {}), minutes:ss.durMs ? Math.round(ss.durMs / 60000) : null, auto:!!auto, note:''};
  S.attempts.push(att);
  if (ss.kind === 'set' || ss.kind === 'mock') {
    var st = S.sets[ss.code] || {attempts:0, best:0, first:null, completed:false};
    st.attempts += 1; st.completed = true; st.best = Math.max(st.best || 0, p); st.last = p; st.lastTs = now; if (!st.first) st.first = now;
    S.sets[ss.code] = st;
  }
  delete S.sess[key];
  save('attempts'); save('qhist'); save('sets'); save('sess');
  return att;
}

  function mark(v){ var id = ids[FC.i]; var o = S.cards[id] || {n:0}; o.s = v; o.ts = Date.now(); o.n = (o.n || 0) + 1; S.cards[id] = o; save('cards'); if (FC.i < ids.length - 1) FC.i++; FC.flipped = false; render(); }

/* ---------- SCORES (cumulative across all days) ---------- */
var SC = {day:'all', set:'all'};
function overall(){
  var topics = {};
  S.attempts.forEach(function(a){ a.answers.forEach(function(r){ if (r[1] === null) return; var t = topicOf(r[0]); topics[t] = topics[t] || [0, 0]; topics[t][1]++; if (r[2]) topics[t][0]++; }); });
  var n = 0, c = 0, unique = 0;
  Object.keys(S.qhist).forEach(function(q){ if (!Q[q]) return; unique++; n += S.qhist[q].n; c += S.qhist[q].c; });
  return {topics:topics, answered:n, correct:c, unique:unique};
}
function shortName(a){ if (a.kind === 'missed') return 'Missed bank'; var b = SETS[a.code] ? SETS[a.code].short : a.code; if (a.kind === 'retry') b += ' (missed retry)'; return b; }
function abbr(a){ var m = {DX:'Dx', MA:'MxA', MB:'MxB', MK:'Mock'}; var b = a.kind === 'missed' ? 'Miss' : (m[a.code] || a.code); return a.kind === 'retry' ? b + 'r' : b; }
function chartSVG(list){
  var data = list.slice(-30); if (!data.length) return '<p class="muted small">No attempts yet. Submit any set to see your trend.</p>';
  var W = Math.max(320, data.length * 34 + 40), H = 180, top = 10, bot = 32, left = 32, bw = (W - left - 8) / data.length;
  function y(p){ return top + (H - top - bot) * (1 - p / 100); }
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Score trend bar chart of ' + data.length + ' attempts">';
  [0, 60, 80, 100].forEach(function(p){ s += '<line x1="' + left + '" x2="' + (W - 4) + '" y1="' + y(p) + '" y2="' + y(p) + '" stroke="' + (p === 60 ? 'var(--bad)' : p === 80 ? 'var(--ok)' : 'var(--border)') + '"' + (p === 60 || p === 80 ? ' stroke-dasharray="4 3"' : '') + '/><text x="2" y="' + (y(p) + 3) + '">' + p + '%</text>'; });
  data.forEach(function(a, i){ var x = left + i * bw + bw * 0.15, w = bw * 0.7, yy = y(a.pct); s += '<rect x="' + x.toFixed(1) + '" y="' + yy.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + Math.max(0.5, y(0) - yy).toFixed(1) + '" rx="3" fill="' + colorFor(a.pct) + '"><title>' + esc(fmtTs(a.ts) + ' · ' + shortName(a) + ': ' + a.pct + '%') + '</title></rect><text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 18) + '" text-anchor="middle">' + esc(abbr(a)) + '</text><text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle">' + esc(a.date.slice(5).replace('-', '/')) + '</text>'; });
  return '<div style="overflow-x:auto">' + s + '</svg></div><p class="small muted">Bars = submitted attempts in order (last 30), labeled by set and date. Red dashed line = 60% pass line; green dashed = 80% plan target.</p>';
}
function topicTable(topics, keys){ return '<table class="tbl"><thead><tr><th>Topic</th><th>Correct</th><th style="width:32%">%</th></tr></thead><tbody>' + keys.map(function(t){ var v = topics[t], p = pct(v[0], v[1]); return '<tr><td>' + esc(t) + '</td><td>' + v[0] + '/' + v[1] + '</td><td><div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><span style="width:' + p + '%;background:' + colorFor(p) + '"></span></div><span class="small">' + p + '%</span></div></td></tr>'; }).join('') + '</tbody></table>'; }
function viewScores(el){
  var o = overall();
  var setsDone = SETORDER.filter(function(c){ return S.sets[c] && S.sets[c].completed; }).length;
  var know = 0, again = 0; Object.keys(S.cards).forEach(function(k){ if (S.cards[k].s === 'know') know++; else if (S.cards[k].s === 'again') again++; });
  var blocksAll = 0; DAYS.forEach(function(d){ blocksAll += d.blocks.length; });
  var blocksDone = Object.keys(S.sched).length;
  var h = '<h1>Score log</h1><p class="small muted">' + esc(DATA.scoreLogIntro) + '</p><p class="small"><b>Cumulative:</b> everything here carries over from the Oct 6 kickoff through exam day on this device. Nothing resets day to day; only "Reset all progress" clears it.</p>';
  h += '<div class="stats" id="ovStats"><div class="stat"><b id="stAttempts">' + S.attempts.length + '</b><span>Attempts submitted</span></div><div class="stat"><b id="stAnswered">' + o.answered + '</b><span>Total questions answered</span></div><div class="stat"><b id="stPct">' + (o.answered ? pct(o.correct, o.answered) + '%' : '–') + '</b><span>Overall percent correct</span></div><div class="stat"><b>' + o.unique + '/' + Object.keys(Q).length + '</b><span>Unique questions seen</span></div><div class="stat"><b>' + setsDone + '/12</b><span>Sets completed</span></div><div class="stat"><b>' + missedBank().length + '</b><span>In missed bank</span></div><div class="stat"><b>' + know + ' / ' + again + '</b><span>Cards Know / Again</span></div><div class="stat"><b>' + blocksDone + '/' + blocksAll + '</b><span>Schedule blocks checked</span></div></div>';
  var tk = Object.keys(o.topics).filter(function(t){ return o.topics[t][1] >= 3; }).sort(function(a, b){ return pct(o.topics[a][0], o.topics[a][1]) - pct(o.topics[b][0], o.topics[b][1]); });
  h += '<div class="card" style="margin-top:12px"><h2>Weakest topics across all attempts</h2>' + (tk.length ? topicTable(o.topics, tk.slice(0, 6)) + '<p class="small muted">' + esc(DATA.drillPriority[0] || '') + '</p>' : '<p class="muted small">Submit a few sets to see weak topics (topics with 3+ answers).</p>') + '</div>';
  h += '<div class="card"><h2>Trend</h2>' + chartSVG(S.attempts) + '</div>';
  h += '<div class="card"><h2>Planned sets</h2><table class="tbl small" id="planTbl"><thead><tr><th>Set</th><th>Status</th><th>Tries</th></tr></thead><tbody>' + DATA.scoreLogPlan.map(function(r){
    var c = null; for (var k in SHORT) if (SHORT[k] === r.set) c = k; var st = c && S.sets[c];
    return '<tr><td><b>' + esc(r.set) + '</b> <span class="muted">' + esc(r.of) + '</span><div class="muted">' + esc(r.date) + '</div></td><td>' + (c ? setStatusBadge(c) : '') + '</td><td>' + (st ? st.attempts : 0) + '</td></tr>';
  }).join('') + '</tbody></table></div>';
  var dates = []; S.attempts.forEach(function(a){ if (dates.indexOf(a.date) < 0) dates.push(a.date); }); dates.sort();
  var codes = []; S.attempts.forEach(function(a){ var k = a.kind === 'missed' ? 'MISSED' : a.code; if (codes.indexOf(k) < 0) codes.push(k); });
  if (SC.day !== 'all' && dates.indexOf(SC.day) < 0) SC.day = 'all';
  if (SC.set !== 'all' && codes.indexOf(SC.set) < 0) SC.set = 'all';
  h += '<div class="card" id="attemptsCard"><h2>All attempts by day</h2><div class="row"><div style="flex:1;min-width:140px"><label class="field" for="fDay">Day</label><select id="fDay"><option value="all">All days</option>' + dates.map(function(d){ return '<option value="' + d + '"' + (SC.day === d ? ' selected' : '') + '>' + esc(dayTag(d)) + '</option>'; }).join('') + '</select></div><div style="flex:1;min-width:140px"><label class="field" for="fSet">Set</label><select id="fSet"><option value="all">All sets</option>' + codes.map(function(c){ return '<option value="' + c + '"' + (SC.set === c ? ' selected' : '') + '>' + esc(SETS[c] ? SETS[c].short : 'Missed bank') + '</option>'; }).join('') + '</select></div></div>';
  var list = S.attempts.filter(function(a){ return (SC.day === 'all' || a.date === SC.day) && (SC.set === 'all' || a.code === SC.set || (SC.set === 'MISSED' && a.kind === 'missed')); });
  if (!list.length) h += '<p class="muted">No attempts' + (S.attempts.length ? ' match the filter.' : ' yet.') + '</p>';
  dates.slice().reverse().forEach(function(d){
    var items = list.filter(function(a){ return a.date === d; }); if (!items.length) return;
    var c = 0, t = 0; items.forEach(function(a){ c += a.correct; t += a.total; });
    h += '<h3 style="margin-top:14px" class="dayGroup" data-date="' + d + '">' + esc(dayTag(d)) + ' <span class="small muted">· ' + items.length + ' attempt(s) · ' + c + '/' + t + ' (' + pct(c, t) + '%)</span></h3><table class="tbl resp"><thead><tr><th>Time</th><th>Set</th><th>Score</th><th>%</th><th>Weak topics</th><th>Note</th><th><span class="sr">Review</span></th></tr></thead><tbody>' +
      items.slice().reverse().map(function(a){ return '<tr class="attRow"><td data-l="Time">' + esc(fmtTime(a.ts)) + '</td><td data-l="Set">' + esc(shortName(a)) + ' <span class="small muted">' + (a.mode === 'exam' ? 'exam' : 'practice') + '</span></td><td data-l="Score">' + a.correct + '/' + a.total + '</td><td data-l="%"><b style="color:' + colorFor(a.pct) + '">' + a.pct + '%</b></td><td data-l="Weak" class="small">' + esc(a.weak.join('; ') || '–') + '</td><td data-l="Note"><input type="text" aria-label="Note for ' + esc(shortName(a)) + ' at ' + esc(fmtTs(a.ts)) + '" data-note="' + a.id + '" value="' + esc(a.note || '') + '" placeholder="Drill assigned / done"></td><td data-l=""><button class="btn sm" data-res="' + a.id + '">Review</button></td></tr>'; }).join('') + '</tbody></table>';
  });
  h += '</div>';
  h += '<div class="card"><label class="field" for="notes">My notes</label><textarea id="notes" placeholder="Weak areas, drills assigned/done, reminders...">' + esc(S.notes) + '</textarea><p class="small muted">Saved automatically.</p></div>';
  h += '<div class="card"><h2>Backup &amp; reset</h2><p class="small"><b>Keep using the same copy of this file in the same browser</b>: saved progress belongs to that browser and file location. If you move, re-download, or switch browsers or phones, Export here first and Import there.</p><p class="small muted">Export includes every attempt, per-question answer history (question, chosen answer, correct or not, time, attempt count), set status, schedule and recall check-offs for every day, flashcard Know/Again status, notes, settings, and any in-progress session.</p><div class="row"><button class="btn" id="expJson">Export JSON</button><button class="btn" id="expCsv">Export CSV</button><button class="btn" id="impBtn">Import JSON</button></div><input type="file" id="impFile" accept=".json,application/json,text/plain" class="sr" tabindex="-1" aria-hidden="true"><div class="row" style="margin-top:10px"><button class="btn danger" id="resetBtn">Reset all progress</button></div></div>';
  el.innerHTML = h;
  $('#fDay').onchange = function(e){ SC.day = e.target.value; render(); };
  $('#fSet').onchange = function(e){ SC.set = e.target.value; render(); };
  var nt; $('#notes').oninput = function(e){ S.notes = e.target.value; clearTimeout(nt); nt = setTimeout(function(){ save('notes'); }, 300); };
  $('#notes').onblur = function(){ save('notes'); };
  el.addEventListener('change', function(e){ var i = e.target.closest('[data-note]'); if (i) { var a = findAttempt(i.getAttribute('data-note')); if (a) { a.note = i.value; save('attempts'); toast('Note saved'); } } });
  el.addEventListener('click', function(e){ var b = e.target.closest('[data-res]'); if (b) go('#result/' + b.getAttribute('data-res')); });
  $('#expJson').onclick = function(){ var txt = JSON.stringify(exportObj()); download('caah26-progress-' + todayStr() + '.json', txt, 'application/json'); copyFallback('Export JSON', txt); };
  $('#expCsv').onclick = function(){ var txt = toCSV(); download('caah26-score-log-' + todayStr() + '.csv', txt, 'text/csv'); copyFallback('Export CSV', txt); };
  $('#impBtn').onclick = importFlow;
  $('#impFile').onchange = function(e){ var f = e.target.files && e.target.files[0]; if (!f) return; var rd = new FileReader(); rd.onload = function(){ doImport(String(rd.result)); }; rd.readAsText(f); e.target.value = ''; };
  $('#resetBtn').onclick = function(){
    modal({title:'Reset ALL progress?', html:'<p>This permanently deletes every attempt, answer history, set status, schedule and recall check-off, flashcard mark, note, and in-progress session on this device. Export first if you want a backup.</p><label class="field" for="rsTxt">Type RESET to confirm</label><input type="text" id="rsTxt" autocomplete="off" autocapitalize="characters">', ok:'Reset everything', danger:true, collect:function(w){ return w.querySelector('#rsTxt').value.trim().toUpperCase() === 'RESET' ? 'yes' : 'no'; }}).then(function(v){
      if (v === 'yes') { var th = S.settings.theme; KEYS.forEach(function(k){ lsDel(k); }); S = DEFAULTS(); S.settings.theme = th; KEYS.forEach(save); FC.order = null; toast('All progress reset'); render(); }
      else if (v === 'no') toast('Not reset: type RESET to confirm');
    });
  };
}
function copyFallback(title, txt){
  modal({title:title, html:'<p class="small">The file download has started. If nothing downloaded (some in-app browsers block downloads), copy this text and save it in a note or file.</p><textarea id="cpTxt" readonly style="min-height:150px;font-size:12px">' + esc(txt) + '</textarea>', ok:'Copy text', cancel:'Close', collect:function(w){ var t = w.querySelector('#cpTxt'); try { t.select(); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).catch(function(){ document.execCommand('copy'); }); else document.execCommand('copy'); toast('Copied'); } catch(e){ toast('Select the text and copy it manually'); } return true; }});
}
function exportObj(){ var d = {}; KEYS.forEach(function(k){ d[k] = S[k]; }); return {app:'caah26', version:1, exportedAt:new Date().toISOString(), data:d}; }
function csvCell(v){ v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function toCSV(){
  var rows = [['date', 'time', 'plan_day', 'set', 'mode', 'correct', 'total', 'percent', 'weak_topics', 'note']];
  S.attempts.forEach(function(a){ var d = new Date(a.ts); rows.push([a.date, pad(d.getHours()) + ':' + pad(d.getMinutes()), DAYLABEL[a.date] || '', shortName(a), a.mode, a.correct, a.total, a.pct, a.weak.join('; '), a.note || '']); });
  return rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
}
function importFlow(){
  modal({title:'Import progress (JSON)', html:'<p class="small">Choose a file exported from this app, or paste its JSON below. Importing <b>replaces</b> the progress currently on this device.</p><button class="btn" id="pickFile" type="button">Choose file…</button><label class="field" for="impTxt">…or paste JSON</label><textarea id="impTxt"></textarea>', ok:'Import pasted JSON', collect:function(w){ return w.querySelector('#impTxt').value || ' '; }, onOpen:function(w, close){ w.querySelector('#pickFile').onclick = function(){ close(false); $('#impFile').click(); }; }}).then(function(v){ if (typeof v === 'string' && v.trim()) doImport(v); });
}
function doImport(txt){
  var obj; try { obj = JSON.parse(txt); } catch(e){ modal({title:'Import failed', body:'That is not valid JSON.', cancel:false}); return; }
  if (!obj || obj.app !== 'caah26' || !obj.data) { modal({title:'Import failed', body:'This file was not exported from this study app.', cancel:false}); return; }
  var n = (obj.data.attempts || []).length;
  modal({title:'Replace current progress?', body:'The file has ' + n + ' attempt(s), exported ' + (obj.exportedAt || 'at an unknown time') + '. Current progress on this device will be replaced.', ok:'Import', danger:true}).then(function(y){
    if (!y) return; var d = DEFAULTS();
    KEYS.forEach(function(k){ var v = obj.data[k]; if (v !== undefined && v !== null && typeof v === typeof d[k] && Array.isArray(v) === Array.isArray(d[k])) d[k] = v; });
    if (d.settings.mockMinutes !== 105) d.settings.mockMinutes = 90;
    S = d; KEYS.forEach(save); FC.order = null; toast('Imported ' + n + ' attempt(s)'); render();
  });
}

/* ---------- REFERENCE ---------- */

  h += '<div class="card" id="sec-examday"><h2>Exam-day routine: Tuesday, October 13, 2026</h2><p class="small muted">' + esc(DATA.examDayNote) + '</p><table class="tbl resp"><tbody>' + DATA.examDay.map(function(r){ return '<tr><th scope="row">' + esc(r.time) + '</th><td>' + esc(r.action) + '</td></tr>'; }).join('') + '</tbody></table><h3 style="margin-top:12px">What to bring (PSI ID rules)</h3><ul>' + DATA.bring.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul><h3>Test-taking tactics</h3><ul>' + DATA.tactics.map(function(x){ return '<li>' + boldLead(x) + '</li>'; }).join('') + '</ul></div>';

  h += '<div class="card" id="sec-recall"><h2>Daily recall checklists</h2><p class="small muted">' + esc(DATA.recallIntro) + ' (Tick them on the Today tab.)</p>' + DATA.recall.map(function(r){ return '<h3>' + esc(r.day) + '</h3><ul>' + r.items.map(function(i){ return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>'; }).join('') + '</div>';

/* ---------- boot ---------- */

  applyTheme();
  var nav = $('nav.tabs');
  nav.innerHTML = '<div class="navtitle">CA A&amp;H Exam<small>Study app · exam Tue Oct 13, 2026</small></div>' + TABS.map(function(t){ return '<button type="button" data-tab="' + t.id + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + t.icon + '</svg><span>' + t.label + '</span></button>'; }).join('');

boot();
})();
