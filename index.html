ANNUAL premium is:","choices":["31 days","10 days","60 days","7 days"],"answer":0,"area":null,"explanation":"CIC 10350.3: 31 days for policies other than weekly or monthly premium.","id":"S3-3"},{"n":4,"stem":"If an insurer requires a reinstatement application and issues a conditional receipt, the policy is reinstated upon approval or, absent written disapproval, on the:","choices":["45th day after the conditional receipt","31st day after the conditional receipt","10th day after the conditional receipt","90th day after the conditional receipt"],"answer":0,"area":null,"explanation":"CIC 10350.4.","id":"S3-4"},{"n":5,"stem":"After reinstatement, sickness is covered only if it begins:","choices":["Immediately","More than 10 days after the reinstatement date","More than 90 days after reinstatement","More than 30 days after reinstatement"],"answer":1,"area":null,"explanation":"CIC 10350.4; accidents are covered immediately after reinstatement.","id":"S3-5"},{"n":6,"stem":"If the insurer does not furnish claim forms within 15 days after notice of claim, the claimant may:","choices":["Cancel the policy for a full refund","Sue immediately","Collect double benefits","Submit written proof of loss in any form describing the occurrence, character, and extent of the loss"],"answer":3,"area":null,"explanation":"CIC 10350.6.","id":"S3-6"},{"n":7,"stem":"Proof of loss generally must be furnished within 90 days, and, absent legal incapacity, no later than:","choices":["Three years after the loss","Two years after the loss","One year from the time proof is otherwise required","Six months after the loss"],"answer":2,"area":null,"explanation":"CIC 10350.7.","id":"S3-7"},{"n":8,"stem":"Under the Legal Actions provision, the insured may not sue the insurer until 60 days after proof of loss and not later than:","choices":["Three years after proof of loss is required","Five years after the loss","One year after the loss","Two years after policy issue"],"answer":0,"area":null,"explanation":"CIC 10350.11.","id":"S3-8"},{"n":9,"stem":"The Physical Examinations and Autopsy provision lets the insurer examine the insured during a claim:","choices":["At the insured's expense","Only once per policy year","At the insurer's own expense","Only with a court order"],"answer":2,"area":null,"explanation":"CIC 10350.10; autopsy only where not forbidden by law.","id":"S3-9"},{"n":10,"stem":"Unless the beneficiary designation is irrevocable, the insured may change the beneficiary:","choices":["Only with the Commissioner's approval","Without the beneficiary's consent","Only once per year","Only with the beneficiary's written consent"],"answer":1,"area":null,"explanation":"CIC 10350.12.","id":"S3-10"},{"n":11,"stem":"If an insured's age was misstated on the application, the insurer typically will:","choices":["Refund all premiums and cancel","Void the policy","Adjust benefits to what the premium paid would have purchased at the correct age","Pay full benefits with no adjustment"],"answer":2,"area":null,"explanation":"Misstatement of Age is an optional provision that adjusts benefits.","id":"S3-11"},{"n":12,"stem":"A policy the insurer can never cancel and whose premium cannot be increased, up to a stated age, is:","choices":["Optionally renewable","Noncancelable","Guaranteed renewable","Conditionally renewable"],"answer":1,"area":null,"explanation":"Noncancelable guarantees both renewal and premium.","id":"S3-12"},{"n":13,"stem":"A guaranteed renewable policy must be renewed by the insurer to a stated age, but the insurer may:","choices":["Reduce benefits at renewal","Cancel for poor health","Raise one insured's premium after a claim","Raise premiums for an entire class of insureds"],"answer":3,"area":null,"explanation":"Rate increases must apply on a class basis.","id":"S3-13"},{"n":14,"stem":"A policy the insurer may decline to renew only for reasons stated in the policy (such as retirement) is:","choices":["Optionally renewable","Cancellable","Noncancelable","Conditionally renewable"],"answer":3,"area":null,"explanation":"Nonrenewal cannot be based on the insured's health.","id":"S3-14"},{"n":15,"stem":"A policy the insurer may refuse to renew on any premium due date or anniversary is:","choices":["Guaranteed renewable","Optionally renewable","Noncancelable","Conditionally renewable"],"answer":1,"area":null,"explanation":"The renewal option belongs to the insurer.","id":"S3-15"},{"n":16,"stem":"Which definition of accident is broader and more favorable to the insured?","choices":["Accidental bodily injury (results)","Accidental means (cause)","Intentional injury","Self-inflicted injury"],"answer":0,"area":null,"explanation":"Accidental means requires both cause and result to be unintended.","id":"S3-16"},{"n":17,"stem":"A policy that covers only a named disease, such as cancer, is a:","choices":["Blanket policy","Hospital indemnity policy","Specified (dread) disease policy","Major medical policy"],"answer":2,"area":null,"explanation":"Limited benefit policies cover specified conditions or services.","id":"S3-17"},{"n":18,"stem":"A hospital indemnity policy pays:","choices":["Actual hospital charges after a deductible","A fixed amount per day of hospital confinement, regardless of actual expenses","Only lost wages","Only outpatient surgery"],"answer":1,"area":null,"explanation":"Indemnity plans pay a set daily amount.","id":"S3-18"},{"n":19,"stem":"Credit disability insurance pays:","choices":["Lump sum on death","Medical bills only","The insured's loan payments during disability","The lender's operating expenses"],"answer":2,"area":null,"explanation":"It protects the debt balance during the insured's disability.","id":"S3-19"},{"n":20,"stem":"Under California law, an applicant's written disability application may be altered by someone other than the applicant:","choices":["By any insurer employee","Only after the policy is issued","Freely by the agent","Only with the applicant's written consent, except administrative insertions by the insurer"],"answer":3,"area":null,"explanation":"CIC 10382; other unauthorized alterations are a misdemeanor.","id":"S3-20"},{"n":21,"stem":"The agent's role in screening applicants and accurately completing applications is called:","choices":["Field underwriting","Actuarial rating","Reinsurance","Claims adjusting"],"answer":0,"area":null,"explanation":"The agent is the insurer's first underwriter.","id":"S3-21"},{"n":22,"stem":"MIB Inc. (formerly the Medical Information Bureau) provides member insurers with:","choices":["Credit scores","Agent licensing histories","Driving records","Coded medical information reported by other insurers on prior applications"],"answer":3,"area":null,"explanation":"MIB helps detect omissions or misrepresentations.","id":"S3-22"},{"n":23,"stem":"An underwriter may respond to a substandard risk by:","choices":["Issuing the policy with an exclusion rider or a higher premium","Issuing a standard policy at a lower premium","Referring the applicant to Medicare","Waiving the elimination period"],"answer":0,"area":null,"explanation":"Substandard responses include ratings, exclusion riders, or reduced benefits.","id":"S3-23"},{"n":24,"stem":"When an applicant pays the first premium with the application and receives a conditional receipt, coverage typically begins:","choices":["Only when the policy is delivered","On the next policy anniversary","Immediately, regardless of insurability","On the application or exam date, if the applicant is found insurable as applied for"],"answer":3,"area":null,"explanation":"Conditional receipts make coverage conditional on insurability.","id":"S3-24"},{"n":25,"stem":"If no premium was collected with the application, at policy delivery the agent should typically:","choices":["Backdate the policy","Collect the premium and obtain a statement of continued good health","Leave the policy without comment","Change the application answers"],"answer":1,"area":null,"explanation":"Delivery is also the time to explain the policy and any riders.","id":"S3-25"}],"minutes":30,"meta":"25 questions  |  Time limit: 30 minutes  |  Target: 80% or higher (20+ correct)","notes":[],"tagged":false},{"code":"S4","title":"Practice Set 4: Individual & Group Medical Expense; HIPAA, COBRA, Cal-COBRA, ERISA (III.A-III.B)","questions":[{"n":1,"stem":"A policy with a $1,000 deductible and 80/20 coinsurance covers a $6,000 allowed bill. The insured pays:","choices":["$4,000","$2,000","$1,200","$1,000"],"answer":1,"area":null,"explanation":"$1,000 deductible + 20% of the remaining $5,000 ($1,000) = $2,000.","id":"S4-1"},{"n":2,"stem":"A fixed dollar amount the insured pays for a specific service, such as $25 per office visit, is a:","choices":["Coinsurance","Deductible","Premium","Copayment"],"answer":3,"area":null,"explanation":"Coinsurance is a percentage; copay is a flat amount.","id":"S4-2"},{"n":3,"stem":"Once the insured reaches the plan's maximum out-of-pocket limit for the year, the plan:","choices":["Pays 100% of covered services for the rest of the year","Cancels the policy","Stops paying benefits","Pays 50% of covered services"],"answer":0,"area":null,"explanation":"The OOP maximum caps the insured's cost sharing.","id":"S4-3"},{"n":4,"stem":"In an HMO, services from out-of-network providers are generally covered only:","choices":["After a deductible","If the member pays 40% coinsurance","Whenever the member chooses","In emergencies"],"answer":3,"area":null,"explanation":"HMOs restrict coverage to the network except emergencies.","id":"S4-4"},{"n":5,"stem":"Which plan lets members see out-of-network providers at higher cost without a referral?","choices":["PPO","Indemnity-only dental","HMO","EPO"],"answer":0,"area":null,"explanation":"PPOs pay more in-network and less out-of-network.","id":"S4-5"},{"n":6,"stem":"An Exclusive Provider Organization (EPO) generally:","choices":["Covers only in-network care (except emergencies) and usually does not require PCP referrals","Covers any provider equally","Requires PCP referrals for all care","Is regulated only by Medicare"],"answer":0,"area":null,"explanation":"EPOs combine an exclusive network with PPO-style access.","id":"S4-6"},{"n":7,"stem":"A Point-of-Service (POS) plan:","choices":["Is available only to Medicare enrollees","Has no provider network","Covers only hospital services","Combines HMO features with an option to go out-of-network at higher cost"],"answer":3,"area":null,"explanation":"POS members choose at the point of service.","id":"S4-7"},{"n":8,"stem":"To contribute to a Health Savings Account, an individual must be covered by a:","choices":["Medicare Advantage plan","Qualified high-deductible health plan","Medi-Cal plan","Low-deductible PPO"],"answer":1,"area":null,"explanation":"HSAs pair with HDHPs; funds belong to the individual and roll over.","id":"S4-8"},{"n":9,"stem":"A Health Reimbursement Arrangement (HRA) is funded by:","choices":["Employee and employer equally","The federal government","The employer only","The employee only"],"answer":2,"area":null,"explanation":"HRA funds are employer-owned.","id":"S4-9"},{"n":10,"stem":"A key feature of a health Flexible Spending Arrangement (FSA) is that:","choices":["Unused funds are generally forfeited at year end, subject to limited exceptions","Funds always roll over indefinitely","Only employers may contribute","It requires a high-deductible plan"],"answer":0,"area":null,"explanation":"The 'use-it-or-lose-it' rule, with limited carryover or grace-period options.","id":"S4-10"},{"n":11,"stem":"Under the CDI objectives, which benefits are mandatory in health plans?","choices":["Adult vision benefits","Cosmetic surgery benefits","Limited pediatric dental and vision benefits","Adult dental benefits"],"answer":2,"area":null,"explanation":"Adult dental and vision are optional coverages.","id":"S4-11"},{"n":12,"stem":"The purpose of a coordination of benefits provision is to:","choices":["Prevent over-insurance by designating which plan pays first","Let the insured collect from both plans in full","Increase benefits when two plans exist","Eliminate deductibles"],"answer":0,"area":null,"explanation":"The primary plan pays first; the secondary pays remaining eligible amounts.","id":"S4-12"},{"n":13,"stem":"The Mental Health Parity laws require that group plans offering mental health benefits:","choices":["Charge higher copays for therapy","Cover only inpatient care","Not impose financial requirements or limits more restrictive than for medical/surgical benefits","Exclude substance-use treatment"],"answer":2,"area":null,"explanation":"Parity is a listed objective.","id":"S4-13"},{"n":14,"stem":"In a noncontributory group plan:","choices":["Premiums are paid by the state","Employees and the union split the premium","Employees pay the entire premium","The employer pays the entire premium"],"answer":3,"area":null,"explanation":"Contributory plans require employee contributions.","id":"S4-14"},{"n":15,"stem":"A self-funded (self-insured) employer health plan:","choices":["Must be purchased through Covered California","Pays claims from employer funds, often using a TPA and stop-loss coverage","Is regulated as an HMO","Has no claims risk for the employer"],"answer":1,"area":null,"explanation":"Self-funded plans are generally governed by ERISA.","id":"S4-15"},{"n":16,"stem":"Under federal COBRA, an employee who is terminated (not for gross misconduct) may continue group coverage for up to:","choices":["12 months","36 months","18 months","29 months"],"answer":2,"area":null,"explanation":"29 months with disability extension; 36 for certain dependent events.","id":"S4-16"},{"n":17,"stem":"Under COBRA, a dependent child who 'ages out' of the group plan may continue coverage for up to:","choices":["24 months","36 months","18 months","29 months"],"answer":1,"area":null,"explanation":"CDI objectives: 36 months for a child who ages out.","id":"S4-17"},{"n":18,"stem":"Under federal COBRA, the maximum premium generally charged is:","choices":["102% of the group rate","100% of the group rate","200% of the group rate","110% of the group rate"],"answer":0,"area":null,"explanation":"The extra 2% covers administration (150% during a disability extension).","id":"S4-18"},{"n":19,"stem":"Cal-COBRA applies to employers with:","choices":["1 employee only","2 to 19 employees","100 or more employees","20 to 99 employees"],"answer":1,"area":null,"explanation":"Cal-COBRA fills the gap below the federal 20-employee threshold.","id":"S4-19"},{"n":20,"stem":"A person who exhausts 18 months of federal COBRA may be able to extend coverage under Cal-COBRA to a total of up to:","choices":["36 months","29 months","24 months","48 months"],"answer":0,"area":null,"explanation":"Cal-COBRA can extend federal COBRA to 36 months total.","id":"S4-20"},{"n":21,"stem":"HIPAA's Privacy Rule protects:","choices":["Only employer payroll records","Only Social Security numbers","Only credit card data","Individually identifiable protected health information (PHI)"],"answer":3,"area":null,"explanation":"HIPAA also includes portability and nondiscrimination rules.","id":"S4-21"},{"n":22,"stem":"HIPAA's group-plan nondiscrimination rules prohibit:","choices":["Requiring a waiting period for new hires","Charging similarly situated individuals more based on health status","Using provider networks","Charging different premiums for family coverage"],"answer":1,"area":null,"explanation":"Health status cannot be used to discriminate among similarly situated members.","id":"S4-22"},{"n":23,"stem":"ERISA primarily regulates:","choices":["Individual auto insurance","State Medi-Cal eligibility","Employer-sponsored employee benefit plans","Insurance agent licensing"],"answer":2,"area":null,"explanation":"ERISA sets fiduciary, reporting, and disclosure standards.","id":"S4-23"},{"n":24,"stem":"Under California law, group health coverage offered for spouses must also be available to:","choices":["Adult siblings","Roommates","Registered domestic partners on the same terms","Former spouses only"],"answer":2,"area":null,"explanation":"CIC 10121.7 is cited in the CDI objectives for registered domestic partners.","id":"S4-24"},{"n":25,"stem":"Insurance covering a class of persons not individually identified, such as a school's students or sports team members, is:","choices":["Key person insurance","Credit insurance","Franchise insurance","Blanket insurance"],"answer":3,"area":null,"explanation":"CIC 10270.2 describes blanket disability insurance.","id":"S4-25"}],"minutes":30,"meta":"25 questions  |  Time limit: 30 minutes  |  Target: 80% or higher (20+ correct)","notes":[],"tagged":false},{"code":"S5","title":"Practice Set 5: PPACA & Covered California (III.C)","questions":[{"n":1,"stem":"A central purpose of the Patient Protection and Affordable Care Act (PPACA) is to:","choices":["Expand access to affordable health coverage and add consumer protections","Replace Medicare with private plans","Eliminate employer-sponsored coverage","Regulate auto insurance rates"],"answer":0,"area":null,"explanation":"The objectives ask you to identify the Act's purpose.","id":"S5-1"},{"n":2,"stem":"Under the ACA, new individual and group health policies are:","choices":["Available only to those under 50","Issued only through agents","Guaranteed issue","Issued only after medical underwriting"],"answer":2,"area":null,"explanation":"Insurers cannot deny coverage based on health status.","id":"S5-2"},{"n":3,"stem":"The ACA Open Enrollment Period is:","choices":["A period after a qualifying life event","The annual window when anyone may enroll in or change individual coverage","A Medicare-only enrollment window","The free-look period"],"answer":1,"area":null,"explanation":"Outside OEP, enrollment requires a Special Enrollment Period.","id":"S5-3"},{"n":4,"stem":"A Special Enrollment Period is triggered by:","choices":["A premium increase notice alone","Reaching age 30","A qualifying life event, such as losing other coverage, marriage, birth, or moving","Simply wanting a cheaper plan mid-year"],"answer":2,"area":null,"explanation":"SEP requirements are a listed objective.","id":"S5-4"},{"n":5,"stem":"A Gold-tier plan has an actuarial value of about:","choices":["60%","70%","90%","80%"],"answer":3,"area":null,"explanation":"The plan pays about 80% of average covered costs.","id":"S5-5"},{"n":6,"stem":"Which metal tier typically has the highest premium and lowest out-of-pocket costs?","choices":["Platinum","Gold","Silver","Bronze"],"answer":0,"area":null,"explanation":"Platinum = ~90% actuarial value.","id":"S5-6"},{"n":7,"stem":"Under the ACA, health plans may NOT impose:","choices":["Annual or lifetime dollar limits on essential health benefits","Provider networks","Deductibles","Copayments"],"answer":0,"area":null,"explanation":"CDI objectives: no dollar limits on EHB.","id":"S5-7"},{"n":8,"stem":"Under the CDI objectives, benefits that are NOT essential health benefits:","choices":["Must be free of cost sharing","Must be unlimited","Are prohibited","May include dollar limits"],"answer":3,"area":null,"explanation":"Only EHB are protected from dollar limits.","id":"S5-8"},{"n":9,"stem":"The ACA medical loss ratio for individual plans is:","choices":["85%","80%","90%","70%"],"answer":1,"area":null,"explanation":"At least 80% of premium must go to care and quality improvement.","id":"S5-9"},{"n":10,"stem":"The ACA medical loss ratio for large group plans is:","choices":["75%","85%","80%","95%"],"answer":1,"area":null,"explanation":"The CDI objectives list 85% for group plans; 80% for individual.","id":"S5-10"},{"n":11,"stem":"An insurer that fails the MLR test in a market segment for a calendar year must:","choices":["Pay a fine to Medicare only","Cancel all its policies","Refund excess premiums to enrollees in that market segment","Raise its rates"],"answer":2,"area":null,"explanation":"Rebates go to consumers in the failing segment.","id":"S5-11"},{"n":12,"stem":"Under MAGI rules, adults age 19-64 qualify for Medi-Cal with household income up to:","choices":["250% FPL","138% of the Federal Poverty Level","400% FPL","100% FPL"],"answer":1,"area":null,"explanation":"CDI objective figure.","id":"S5-12"},{"n":13,"stem":"Under MAGI rules cited by the CDI, children under 19 qualify for Medi-Cal with household income up to:","choices":["200% FPL","400% FPL","138% FPL","266% FPL"],"answer":3,"area":null,"explanation":"CDI objective figure.","id":"S5-13"},{"n":14,"stem":"Per the CDI objectives, Cost Sharing Reductions are available to consumers with income between:","choices":["250% and 400% FPL","400% and 600% FPL","138% and 250% FPL","0% and 100% FPL"],"answer":2,"area":null,"explanation":"CSRs reduce deductibles and copays (on Silver plans).","id":"S5-14"},{"n":15,"stem":"To receive Advance Premium Tax Credits, a consumer must:","choices":["Have employer coverage","Buy any plan directly from an insurer","Buy a Qualified Health Plan through Covered California","Be enrolled in Medicare"],"answer":2,"area":null,"explanation":"Per the CDI objectives, APTCs may be available up to 400% FPL.","id":"S5-15"},{"n":16,"stem":"Advance Premium Tax Credits work by:","choices":["Eliminating the deductible","Reducing the insurer's taxes only","Being mailed as cash to the agent","Being paid to the insurer on the consumer's behalf to lower the monthly premium"],"answer":3,"area":null,"explanation":"They are 'advance' because they reduce premiums during the year.","id":"S5-16"},{"n":17,"stem":"Small businesses may be eligible for federal small business health care tax credits if they have 25 or fewer employees and:","choices":["Buy coverage from a non-admitted insurer","Purchase coverage through Covered California for Small Business","Offer only HRAs","Self-insure"],"answer":1,"area":null,"explanation":"CDI objective: purchase through CCSB.","id":"S5-17"},{"n":18,"stem":"Before writing QHP applications through Covered California, an agent must:","choices":["Complete Covered California's agent agreements and certification","Pass a separate PSI exam","Register with DMHC","Obtain a life and disability analyst license"],"answer":0,"area":null,"explanation":"CDI objective requirement.","id":"S5-18"},{"n":19,"stem":"Holding yourself out as representing Covered California without a valid agreement with the Exchange is:","choices":["An unfair practice under the Insurance Code","Only a federal concern","Permitted for licensed agents","Permitted during open enrollment"],"answer":0,"area":null,"explanation":"CIC 790.03(j).","id":"S5-19"},{"n":20,"stem":"Under the ACA, coverage for an adult child on a parent's plan generally ends:","choices":["At marriage","When the child stops being a student","At age 26, unless the child qualifies as a disabled dependent","When the child moves out"],"answer":2,"area":null,"explanation":"Marital, student, and residency status do not matter.","id":"S5-20"},{"n":21,"stem":"A Qualified Health Plan (QHP) is a plan that:","choices":["Is certified by the Exchange and meets ACA standards, offered in a metal tier","Is sold only to Medicare beneficiaries","Is exempt from essential health benefits","Covers only catastrophic losses"],"answer":0,"area":null,"explanation":"Only QHPs bought through Covered California qualify for premium tax credits.","id":"S5-21"},{"n":22,"stem":"Which is an example of an ACA essential health benefit category?","choices":["Cosmetic surgery","Adult LASIK","Long-term custodial care","Maternity and newborn care"],"answer":3,"area":null,"explanation":"There are ten EHB categories, including maternity, mental health, and pediatric services.","id":"S5-22"},{"n":23,"stem":"Under the ACA, preexisting condition exclusions in health plans are:","choices":["Allowed for 6 months","Prohibited","Allowed only in group plans","Allowed for 12 months"],"answer":1,"area":null,"explanation":"Guaranteed issue and no preexisting condition exclusions.","id":"S5-23"},{"n":24,"stem":"Under the ACA employer shared responsibility rules, an 'applicable large employer' has at least:","choices":["20 employees","25 employees","100 employees","50 full-time employees, including full-time equivalents"],"answer":3,"area":null,"explanation":"ALEs may owe a payment if a full-time employee receives a premium tax credit.","id":"S5-24"},{"n":25,"stem":"Which of the following is minimum essential coverage under the ACA?","choices":["Employer-sponsored group health coverage","A hospital indemnity policy","A specified disease policy","An accident-only policy"],"answer":0,"area":null,"explanation":"Limited/excepted benefit policies are not MEC.","id":"S5-25"}],"minutes":30,"meta":"25 questions  |  Time limit: 30 minutes  |  Target: 80% or higher (20+ correct)","notes":[],"tagged":false},{"code":"S6","title":"Practice Set 6: Senior Health Products - Medicare, Medicare Supplement, Medi-Cal, HICAP (III.D)","questions":[{"n":1,"stem":"Which person is eligible for Medicare?","choices":["A 60-year-old retiree with no disability","A 50-year-old with a temporary injury","Any person with a private disability policy","A person who has received Social Security disability benefits for 24 months"],"answer":3,"area":null,"explanation":"Eligibility: 65+, SSDI after two years, ESRD, or ALS.","id":"S6-1"},{"n":2,"stem":"A doctor who 'accepts assignment' agrees to:","choices":["Accept the Medicare-approved amount as full payment","Treat only Medicare Advantage members","Bill the patient any amount","Waive the Part B premium"],"answer":0,"area":null,"explanation":"Non-assigned providers may charge excess charges, within limits.","id":"S6-2"},{"n":3,"stem":"Premium-free Medicare Part A generally requires:","choices":["No work history","10 work credits","40 Social Security work credits","20 work credits"],"answer":2,"area":null,"explanation":"Those with 30-39 credits pay a reduced Part A premium; under 30 pay the full premium.","id":"S6-3"},{"n":4,"stem":"Medicare Part A covers inpatient hospital care but does NOT cover:","choices":["General nursing","Semi-private room","Hospital meals","Physician and surgeon charges"],"answer":3,"area":null,"explanation":"Physician services fall under Part B.","id":"S6-4"},{"n":5,"stem":"A Medicare Part A benefit period ends when the beneficiary has been out of the hospital or skilled facility for:","choices":["30 consecutive days","90 consecutive days","60 consecutive days","One calendar year"],"answer":2,"area":null,"explanation":"A new benefit period means a new Part A deductible.","id":"S6-5"},{"n":6,"stem":"How many lifetime reserve days does Medicare Part A provide?","choices":["60","30","90","150"],"answer":0,"area":null,"explanation":"Used after day 90 of a hospital stay; once used, they do not renew.","id":"S6-6"},{"n":7,"stem":"Under Part A, a daily coinsurance applies to hospital days:","choices":["1 through 60","61 through 90","21 through 100","91 through 150 only"],"answer":1,"area":null,"explanation":"Days 1-60 after the deductible have no coinsurance.","id":"S6-7"},{"n":8,"stem":"After the annual deductible, Medicare Part B generally pays:","choices":["80% of approved amounts","70% of approved amounts","50% of approved amounts","100% of approved amounts"],"answer":0,"area":null,"explanation":"The beneficiary generally pays 20% coinsurance.","id":"S6-8"},{"n":9,"stem":"The Part B late enrollment penalty is:","choices":["A one-time $100 fee","10% of the premium for each full 12-month period not enrolled, generally for life","1% per month for 12 months","10% for one year only"],"answer":1,"area":null,"explanation":"CDI objectives; delay without penalty is allowed while covered by an employer plan.","id":"S6-9"},{"n":10,"stem":"The Medicare Initial Enrollment Period is a window of:","choices":["Three months","Seven months around the 65th birthday month","Six months","Twelve months"],"answer":1,"area":null,"explanation":"Three months before, the birth month, and three months after.","id":"S6-10"},{"n":11,"stem":"The Medicare Part B General Enrollment Period runs:","choices":["January 1 to March 31","July 1 to September 30","October 15 to December 7","November 1 to January 31"],"answer":0,"area":null,"explanation":"CDI objectives.","id":"S6-11"},{"n":12,"stem":"After employer coverage based on current employment ends, a person may enroll in Part B without penalty during a Special Enrollment Period of:","choices":["Twelve months","Eight months","Six months","Two months"],"answer":1,"area":null,"explanation":"CDI objectives.","id":"S6-12"},{"n":13,"stem":"A Medicare Advantage (Part C) plan:","choices":["Must cover all Original Medicare benefits and may add extra benefits","Is run directly by CMS","Is a type of Medicare supplement","Covers only drugs"],"answer":0,"area":null,"explanation":"MA plans are offered by private organizations (HMO, PPO, PFFS, SNP).","id":"S6-13"},{"n":14,"stem":"Which statement about Medicare Advantage and Medicare supplement is correct?","choices":["Medicare supplement is a type of Part C plan","They pay together on every claim","Medicare Advantage is not a Medicare supplement and does not coordinate with one","Anyone with MA must also buy a supplement"],"answer":2,"area":null,"explanation":"CDI objectives.","id":"S6-14"},{"n":15,"stem":"If a Medicare Advantage member enrolls in a stand-alone Prescription Drug Plan, the member's MA enrollment:","choices":["Continues unchanged","Is suspended for one year","Converts to Medigap","Is automatically terminated"],"answer":3,"area":null,"explanation":"CDI objectives.","id":"S6-15"},{"n":16,"stem":"Failing to maintain creditable prescription drug coverage after first becoming eligible for Part D can result in a lifetime penalty of:","choices":["10% per year without coverage","1% of the base premium per month without coverage","Double the premium for 12 months","A flat $50 per year"],"answer":1,"area":null,"explanation":"CDI objectives.","id":"S6-16"},{"n":17,"stem":"A Part D formulary must include at least:","choices":["Only generic drugs","Two drugs in each treatment category","One drug per category","Every FDA-approved drug"],"answer":1,"area":null,"explanation":"Formularies use tiers but need not include all drugs.","id":"S6-17"},{"n":18,"stem":"Which statement about Medicare supplement Plan A is correct?","choices":["It is no longer sold in California","It covers the Part B deductible","It covers foreign travel emergencies","Its basic (core) benefits are included in all standardized plans"],"answer":3,"area":null,"explanation":"Insurers offering Medigap must offer Plan A.","id":"S6-18"},{"n":19,"stem":"For people newly eligible for Medicare on or after January 1, 2020, which Medicare supplement plans are NOT available?","choices":["Plans C and F","Plans K and L","Plans A and B","Plans G and N"],"answer":0,"area":null,"explanation":"These plans cover the Part B deductible; newly eligible people may consider Plan G or D.","id":"S6-19"},{"n":20,"stem":"California's Medicare supplement open enrollment period lasts:","choices":["Seven months","Twelve months","Three months","Six months"],"answer":3,"area":null,"explanation":"CIC 10192.11(a): six months from the first month 65+ and in Part B.","id":"S6-20"},{"n":21,"stem":"Under California's 'birthday rule,' a Medicare supplement policyholder has an annual open enrollment period lasting at least:","choices":["30 days before their birthday, for any plan","90 days, for any Medicare Advantage plan","7 days around their birthday","60 days beginning on their birthday, for a plan with equal or lesser benefits"],"answer":3,"area":null,"explanation":"CIC 10192.11(h).","id":"S6-21"},{"n":22,"stem":"A person whose Medicare Advantage coverage was terminated by the plan receives an additional California Medicare supplement open enrollment of:","choices":["1 year","30 days","60 days, added after any federal guaranteed-issue period","6 months"],"answer":2,"area":null,"explanation":"CIC 10192.11(g).","id":"S6-22"},{"n":23,"stem":"In California, a Medicare supplement policy may be returned for a full refund within:","choices":["20 days of delivery","10 days of delivery","30 days of receipt","60 days of receipt"],"answer":2,"area":null,"explanation":"CIC 10192.17(e).","id":"S6-23"},{"n":24,"stem":"HICAP in California is administered by the:","choices":["Centers for Medicare & Medicaid Services directly","Department of Insurance claims bureau","California Department of Aging and operated locally by Area Agencies on Aging","Covered California"],"answer":2,"area":null,"explanation":"HICAP provides free counseling; some HICAPs offer legal help.","id":"S6-24"},{"n":25,"stem":"A Dual Special Needs Plan (D-SNP) is designed for people who are:","choices":["Eligible for both Medicare and Medi-Cal","Under 65 with employer coverage","Veterans only","Eligible only for Covered California"],"answer":0,"area":null,"explanation":"D-SNPs coordinate Medicare and Medi-Cal benefits.","id":"S6-25"}],"minutes":30,"meta":"25 questions  |  Time limit: 30 minutes  |  Target: 80% or higher (20+ correct)","notes":[],"tagged":false},{"code":"S7","title":"Practice Set 7: Disability Income & Tax Treatment (IV)","questions":[{"n":1,"stem":"The primary purpose of disability income insurance is to:","choices":["Pay funeral expenses","Pay hospital bills","Provide retirement savings","Replace a portion of earned income lost due to sickness or injury"],"answer":3,"area":null,"explanation":"It protects the insured's ability to earn income.","id":"S7-1"},{"n":2,"stem":"An 'own occupation' definition of total disability means the insured is disabled if unable to perform:","choices":["Household chores","The material duties of their own occupation","Any job at all","Any job for which they are reasonably suited by education"],"answer":1,"area":null,"explanation":"'Any occupation' is stricter and less favorable to the insured.","id":"S7-2"},{"n":3,"stem":"Choosing a longer elimination period on a disability income policy generally:","choices":["Lowers the premium","Extends the benefit period","Raises the premium","Has no effect on premium"],"answer":0,"area":null,"explanation":"It works like a larger deductible.","id":"S7-3"},{"n":4,"stem":"A probationary period in a disability policy:","choices":["Delays benefits after each disability","Limits how long benefits are paid","Excludes sickness that begins shortly after the policy is issued","Applies only to accidents"],"answer":2,"area":null,"explanation":"It reduces adverse selection by people who are already ill.","id":"S7-4"},{"n":5,"stem":"The benefit period in a disability income policy is:","choices":["The maximum length of time benefits will be paid for a disability","The waiting time before benefits begin","The time to file proof of loss","The grace period for premiums"],"answer":0,"area":null,"explanation":"Benefit periods range from months to age 65 or longer.","id":"S7-5"},{"n":6,"stem":"A residual disability benefit pays:","choices":["Only medical bills","The full benefit forever","A benefit proportional to the income lost when the insured returns to work at reduced earnings","A lump sum for loss of a limb"],"answer":2,"area":null,"explanation":"It is based on income loss rather than inability to work.","id":"S7-6"},{"n":7,"stem":"Partial disability benefits are typically:","choices":["Paid only for accidents at work","A percentage (often 50%) of the total disability benefit for a limited time","Equal to 200% of total disability benefits","Paid for life"],"answer":1,"area":null,"explanation":"Partial disability = unable to perform some duties.","id":"S7-7"},{"n":8,"stem":"Under a recurrent disability provision, a recurrence of the same disability within a specified period is treated as:","choices":["A continuation of the prior disability, with no new elimination period","An excluded condition","A reason to cancel the policy","A new disability with a new elimination period"],"answer":0,"area":null,"explanation":"This protects insureds who try returning to work.","id":"S7-8"},{"n":9,"stem":"The Social Security definition of disability generally requires an inability to engage in any substantial gainful activity because of an impairment expected to:","choices":["Last at least 90 days","Last at least 12 months or result in death","Last at least 30 days","Prevent work in one's own occupation only"],"answer":1,"area":null,"explanation":"It is one of the strictest definitions.","id":"S7-9"},{"n":10,"stem":"A social insurance substitute (supplement) rider pays:","choices":["Benefits when Social Security or other social insurance disability benefits are denied or reduced","Funeral expenses","Retirement income at 65","Medicare premiums"],"answer":0,"area":null,"explanation":"It fills gaps if social insurance does not pay.","id":"S7-10"},{"n":11,"stem":"A cost-of-living adjustment (COLA) rider:","choices":["Shortens the elimination period","Increases benefits during a claim to help keep pace with inflation","Adds life insurance","Reduces premiums each year"],"answer":1,"area":null,"explanation":"It protects long-term claim payments from inflation.","id":"S7-11"},{"n":12,"stem":"A future increase (guaranteed insurability) option allows the insured to:","choices":["Convert to life insurance","Lower the premium at any time","Collect benefits without being disabled","Buy more disability coverage later without proving insurability, subject to income"],"answer":3,"area":null,"explanation":"Increases still must be justified by income.","id":"S7-12"},{"n":13,"stem":"A waiver of premium provision in a disability policy:","choices":["Waives premiums while the insured is totally disabled, usually after a waiting period","Waives the elimination period","Refunds all past premiums","Waives the deductible"],"answer":0,"area":null,"explanation":"Premiums are excused during a qualifying disability.","id":"S7-13"},{"n":14,"stem":"Insurers limit disability benefits to a percentage of earnings mainly to:","choices":["Comply with Medicare rules","Preserve the insured's incentive to return to work and avoid overinsurance","Reduce agent commissions","Increase premium income"],"answer":1,"area":null,"explanation":"Overinsurance encourages malingering.","id":"S7-14"},{"n":15,"stem":"Business overhead expense insurance covers:","choices":["The purchase of a disabled partner's interest","The business's liability claims","Ongoing business expenses such as rent, utilities, and employee salaries, not the owner's salary","The owner's personal income"],"answer":2,"area":null,"explanation":"Premiums are generally deductible; benefits are taxable.","id":"S7-15"},{"n":16,"stem":"A disability buy-out policy is used to:","choices":["Fund the purchase of a disabled owner's business interest under a buy-sell agreement","Replace office rent","Train a replacement employee","Pay the owner's medical bills"],"answer":0,"area":null,"explanation":"Premiums are not deductible; benefits are generally received tax-free.","id":"S7-16"},{"n":17,"stem":"In key employee disability income insurance, the beneficiary is usually:","choices":["The employee's estate","The key employee's spouse","The state","The business"],"answer":3,"area":null,"explanation":"It protects the business from losing a key person's contributions.","id":"S7-17"},{"n":18,"stem":"Benefits from an employer-paid group disability plan, where premiums were not included in the employee's income, are:","choices":["Taxed only after age 65","Taxable to the employer","Taxable income to the employee","Tax-free to the employee"],"answer":2,"area":null,"explanation":"Who pays the premium (and how) determines taxation.","id":"S7-18"},{"n":19,"stem":"Group disability income premiums paid by an employer are generally:","choices":["Deductible only by the employee","Never deductible","Deductible to the employer as a business expense","Taxed at double the rate"],"answer":2,"area":null,"explanation":"The tradeoff is that benefits are taxable to employees.","id":"S7-19"},{"n":20,"stem":"A nonoccupational disability policy covers:","choices":["Only hospital costs","Only disabilities over age 65","Only work-related injuries","Disabilities that do not arise from employment"],"answer":3,"area":null,"explanation":"Work-related injuries are typically covered by workers' compensation.","id":"S7-20"},{"n":21,"stem":"California State Disability Insurance (SDI) is funded mainly by:","choices":["Employer contributions only","Insurer premiums","Federal income tax","Employee payroll deductions"],"answer":3,"area":null,"explanation":"SDI is a government-mandated short-term disability program.","id":"S7-21"},{"n":22,"stem":"When rating a disability income applicant, a more hazardous job classification generally results in:","choices":["Automatic decline","A lower premium","No change in rating","A higher premium or restricted coverage"],"answer":3,"area":null,"explanation":"Occupation, age, health, and avocations affect rating.","id":"S7-22"},{"n":23,"stem":"California law requires that insurers NOT make unfair distinctions in underwriting for the risk of:","choices":["HIV/AIDS","Hazardous avocations","Occupation","Prior disability claims"],"answer":0,"area":null,"explanation":"CIC 799 objective.","id":"S7-23"},{"n":24,"stem":"Under California law, 'genetic characteristics' refers to any identifiable gene or chromosome known to cause a disease that:","choices":["Has been treated in the past year","Is not presently associated with any symptoms","Has already caused disability","Is contagious"],"answer":1,"area":null,"explanation":"CIC 10147(b); insurers may not unfairly discriminate based on genetic tests (CIC 10146).","id":"S7-24"},{"n":25,"stem":"A rehabilitation benefit in a disability policy:","choices":["Covers cosmetic surgery","Pays a lump sum at retirement","Helps pay for vocational training or therapy to help the insured return to work","Pays the insured's mortgage"],"answer":2,"area":null,"explanation":"It benefits both the insured and the insurer.","id":"S7-25"}],"minutes":30,"meta":"25 questions  |  Time limit: 30 minutes  |  Target: 80% or higher (20+ correct)","notes":[],"tagged":false},{"code":"S8","title":"Practice Set 8: Long-Term Care (V)","questions":[{"n":1,"stem":"Long-term care insurance is often needed because Medicare:","choices":["Covers only limited, short-term skilled nursing care and not ongoing custodial care","Covers custodial care at home indefinitely","Pays all assisted living costs","Covers unlimited nursing home stays"],"answer":0,"area":null,"explanation":"Medi-Cal covers LTC only after meeting financial eligibility rules.","id":"S8-1"},{"n":2,"stem":"Help with bathing, dressing, and eating provided by non-licensed caregivers is:","choices":["Acute hospital care","Skilled nursing care","Custodial care","Intermediate care"],"answer":2,"area":null,"explanation":"Custodial care is the most common LTC need.","id":"S8-2"},{"n":3,"stem":"Daily nursing care ordered by a physician and given by licensed medical professionals is:","choices":["Adult day care","Custodial care","Respite care","Skilled nursing care"],"answer":3,"area":null,"explanation":"Skilled care is the highest level of care.","id":"S8-3"},{"n":4,"stem":"Occasional (intermittent) skilled nursing or rehabilitative care is:","choices":["Intermediate care","Respite care","Hospice care","Custodial care"],"answer":0,"area":null,"explanation":"It is less than daily skilled care.","id":"S8-4"},{"n":5,"stem":"Care that gives a family caregiver temporary relief is:","choices":["Acute care","Respite care","Hospice care","Skilled care"],"answer":1,"area":null,"explanation":"It may be provided at home or in a facility.","id":"S8-5"},{"n":6,"stem":"Under federal tax-qualified LTC standards, benefits are triggered when the insured cannot perform at least:","choices":["One of six ADLs for 30 days","Two of six ADLs for an expected 90 days, or has severe cognitive impairment","Any ADL for one day","Three of six ADLs for one year"],"answer":1,"area":null,"explanation":"Cognitive impairment is an independent trigger.","id":"S8-6"},{"n":7,"stem":"Which is NOT an activity of daily living (ADL)?","choices":["Transferring","Continence","Managing finances","Bathing"],"answer":2,"area":null,"explanation":"Managing money is an instrumental activity (IADL).","id":"S8-7"},{"n":8,"stem":"Benefits from a tax-qualified long-term care policy are generally:","choices":["Taxed as capital gains","Received income-tax free, within federal limits","Fully taxable","Taxable only to the insurer"],"answer":1,"area":null,"explanation":"TQ premiums may count as medical expenses, subject to age-based limits.","id":"S8-8"},{"n":9,"stem":"A California Partnership for Long-Term Care policy helps the insured by:","choices":["Protecting assets dollar-for-dollar for benefits paid when applying for Medi-Cal","Paying a death benefit","Eliminating all premiums after age 65","Guaranteeing Medicare will pay all LTC costs"],"answer":0,"area":null,"explanation":"Agents need additional Partnership training (CCR Title 22, section 58056).","id":"S8-9"},{"n":10,"stem":"In California, an individual long-term care policy may be returned for a full refund within:","choices":["15 days of delivery","30 days of delivery","60 days of delivery","10 days of delivery"],"answer":1,"area":null,"explanation":"CIC 10232.7: void from the beginning, refund within 30 days of return.","id":"S8-10"},{"n":11,"stem":"Under CIC 10234.93, an agent licensed after January 1, 1992 who solicits LTC must complete:","choices":["4 hours once in a career","No training if they hold CE credit","20 hours before each renewal","8 hours of LTC training in each of the first four 12-month periods, then 8 hours before each renewal"],"answer":3,"area":null,"explanation":"This training counts toward CE requirements.","id":"S8-11"},{"n":12,"stem":"An agent may solicit individual consumers for LTC insurance:","choices":["Only with a life license","Only after 2 years of experience","Only after completing the initial LTC training requirement","Immediately upon licensing"],"answer":2,"area":null,"explanation":"CIC 10234.93.","id":"S8-12"},{"n":13,"stem":"At the time of LTC solicitation, the agent must provide information about:","choices":["Covered California premium subsidies","The agent's commission rate","Medicare Part D formularies","HICAP, including the local office and the statewide number 1-800-434-0222"],"answer":3,"area":null,"explanation":"CIC 10234.93(a)(8).","id":"S8-13"},{"n":14,"stem":"Before presenting an LTC application, the insurer must provide the prospective applicant with:","choices":["The LTC shopper's guide developed by the California Department of Aging","A Covered California brochure","The insurer's annual report","A Medicare & You handbook"],"answer":0,"area":null,"explanation":"CIC 10234.93(a)(9).","id":"S8-14"},{"n":15,"stem":"Marketing that fails to disclose conspicuously that its purpose is to solicit insurance and that an agent will make contact is:","choices":["Rebating","Twisting","Cold lead advertising","Sliding"],"answer":2,"area":null,"explanation":"Prohibited by CIC 10234.93(b)(3).","id":"S8-15"},{"n":16,"stem":"Inducing an LTC purchase through force, fright, or threats is:","choices":["High-pressure tactics","Cold lead advertising","Suitability","Field underwriting"],"answer":0,"area":null,"explanation":"Prohibited by CIC 10234.93(b)(2).","id":"S8-16"},{"n":17,"stem":"Making a misleading or incomplete comparison of LTC policies to induce someone to drop a policy is:","choices":["Cold lead advertising","Rebating","Twisting","Coinsurance"],"answer":2,"area":null,"explanation":"CIC 10234.93(b)(1).","id":"S8-17"},{"n":18,"stem":"The LTC Personal Worksheet is used to:","choices":["Evaluate whether the coverage is suitable for the applicant's needs and finances","Calculate the agent's commission","Apply for Medi-Cal","Report claims to HICAP"],"answer":0,"area":null,"explanation":"Suitability standards are in CIC 10234.95.","id":"S8-18"},{"n":19,"stem":"When requested, an LTC insurer must provide a specimen policy or certificate form within:","choices":["60 calendar days","30 calendar days","5 calendar days","15 calendar days"],"answer":3,"area":null,"explanation":"CIC 10234.93(a)(10).","id":"S8-19"},{"n":20,"stem":"Page one of an LTC policy and the outline of coverage must include a notice that the policy:","choices":["Is not renewable","May not cover all of the costs associated with long-term care","Is a Partnership policy","Is a Medicare supplement"],"answer":1,"area":null,"explanation":"CIC 10234.93(a)(5).","id":"S8-20"},{"n":21,"stem":"Premiums on a guaranteed renewable LTC policy may be increased:","choices":["Only by the agent","Never under any circumstances","Whenever the insured files a claim","Only on a class basis, not because of one insured's health or claims"],"answer":3,"area":null,"explanation":"Guaranteed renewability and rates are listed objectives.","id":"S8-21"},{"n":22,"stem":"In an LTC policy, the elimination period is:","choices":["The maximum benefit period","The time after qualifying for care before the policy begins paying","The free-look period","The time to pay premiums"],"answer":1,"area":null,"explanation":"The CDI consumer guide notes common choices of 0, 30, 90, or 100 days.","id":"S8-22"},{"n":23,"stem":"Inflation protection in an LTC policy is important because:","choices":["It replaces the elimination period","It lowers premiums","It is required by Medicare","Inflation erodes the value of fixed daily benefits over time"],"answer":3,"area":null,"explanation":"Training must cover inflation's effect on benefits.","id":"S8-23"},{"n":24,"stem":"Before selling LTC, insurers must make every reasonable effort to determine whether the applicant:","choices":["Already has accident and sickness or LTC insurance and its type and amount","Owns a home","Has filed taxes","Has life insurance beneficiaries"],"answer":0,"area":null,"explanation":"CIC 10234.93(a)(6).","id":"S8-24"},{"n":25,"stem":"Replacing an existing LTC policy unnecessarily is:","choices":["Encouraged every three years","Required at age 70","Prohibited, and producer compensation on replacements is limited","Permitted whenever the agent earns more"],"answer":2,"area":null,"explanation":"CIC 10234.85 (unnecessary replacement) and 10234.97 (replacement and compensation).","id":"S8-25"}],"minutes":30,"meta":"25 questions  |  Time limit: 30 minutes  |  Target: 80% or higher (20+ correct)","notes":[],"tagged":false},{"code":"MA","title":"Mixed Exam A (Day 3) - 50 questions weighted to Days 1-3 content","questions":[{"n":1,"stem":"Which of the following is a pure risk?","choices":["The possibility of becoming disabled","Opening a new restaurant","Investing in real estate","Betting on a horse race"],"answer":0,"area":"I.A","explanation":"Pure risk: loss or no loss, never a gain.","id":"MA-1"},{"n":2,"stem":"Installing grab bars in a senior's bathroom to lower the chance of falls is which risk technique?","choices":["Retention","Reduction","Transfer","Avoidance"],"answer":1,"area":"I.A","explanation":"Reduction lowers frequency or severity of losses.","id":"MA-2"},{"n":3,"stem":"Choosing a high deductible to handle small losses yourself is an example of:","choices":["Reduction","Transfer","Avoidance","Retention"],"answer":3,"area":"I.A","explanation":"Retaining part of the risk lowers premium.","id":"MA-3"},{"n":4,"stem":"A business buying disability coverage on its top salesperson must have a(n):","choices":["Certificate of authority","Insurable interest in that employee","Surplus line license","Fiduciary bond"],"answer":1,"area":"I.A","explanation":"Insurable interest exists when a loss would cause financial harm.","id":"MA-4"},{"n":5,"stem":"'Loss exposure' best describes:","choices":["Any situation or circumstance that presents the possibility of a loss","The amount the insurer has paid in claims","The insurer's profit margin","A loss that has already occurred"],"answer":0,"area":"I.A","explanation":"Loss exposures are identified in risk management.","id":"MA-5"},{"n":6,"stem":"Which party generally lacks legal competence to enter into a contract?","choices":["A 40-year-old employee","A retired teacher","A licensed insurer","A person who is legally insane"],"answer":3,"area":"I.B","explanation":"Competent parties is one of the four elements of a contract.","id":"MA-6"},{"n":7,"stem":"In most health insurance transactions, the 'offer' is made when:","choices":["The agent mails a brochure","The policy is renewed","The applicant submits a completed application with the initial premium","The insurer advertises on TV"],"answer":2,"area":"I.B","explanation":"If no premium is submitted, the insurer's issued policy is the offer.","id":"MA-7"},{"n":8,"stem":"A statement made by an applicant that is true to the best of their knowledge is a:","choices":["Concealment","Condition precedent","Representation","Warranty"],"answer":2,"area":"I.B","explanation":"Warranties are statements guaranteed to be true.","id":"MA-8"},{"n":9,"stem":"A written instrument in which a contract of insurance is set forth is, under the Insurance Code, the:","choices":["Application","Policy","Binder","Outline of coverage"],"answer":1,"area":"I.B","explanation":"CIC 380 defines 'policy.'","id":"MA-9"},{"n":10,"stem":"A distribution system that sells insurance through mail, TV, or the internet without agents is:","choices":["Independent agency","Direct response","Career agency","Managing general agency"],"answer":1,"area":"I.C","explanation":"Agency and direct response are the systems named in the objectives.","id":"MA-10"},{"n":11,"stem":"An agent's errors and omissions insurance generally covers:","choices":["The insurer's insolvency","The agent's intentional fraud","The agent's auto accidents","Claims arising from the agent's negligent professional mistakes"],"answer":3,"area":"I.C","explanation":"E&O does not cover intentional or criminal acts.","id":"MA-11"},{"n":12,"stem":"Unless licensed as a surplus line broker, an agent may NOT:","choices":["Collect initial premiums","Solicit insurance on behalf of a non-admitted insurer","Deliver policies","Sell admitted insurers' products"],"answer":1,"area":"I.C","explanation":"CIC 703.","id":"MA-12"},{"n":13,"stem":"A store giving 'free' health insurance, at no separate charge, to anyone who buys a refrigerator:","choices":["Generally violates California's free insurance prohibition","Is required by Prop 103","Is legal if the insurance is under $1,000","Is a permitted rebate"],"answer":0,"area":"I.C","explanation":"CIC 777.1 prohibits free insurance as an inducement, with narrow exceptions.","id":"MA-13"},{"n":14,"stem":"Under CIC 1725.5, a licensee must show their license number on:","choices":["Nothing; it is optional","Only on their home mailbox","Business cards, written price quotations, and print ads","Only on claim forms"],"answer":2,"area":"I.C","explanation":"Emails involving licensed activity must also include it.","id":"MA-14"},{"n":15,"stem":"A stock insurer is owned by its:","choices":["Agents","Members of a fraternal lodge","Shareholders","Policyholders"],"answer":2,"area":"I.C","explanation":"Mutuals are policyholder-owned.","id":"MA-15"},{"n":16,"stem":"Which renewability type guarantees renewal AND a level premium to a stated age?","choices":["Conditionally renewable","Noncancelable","Optionally renewable","Guaranteed renewable"],"answer":1,"area":"II","explanation":"GR guarantees renewal only; premiums can rise by class.","id":"MA-16"},{"n":17,"stem":"A cancellable policy allows the insurer to:","choices":["Never terminate the policy","Terminate the policy at any time with proper notice","Only nonrenew at age 65","Raise premiums only once"],"answer":1,"area":"II","explanation":"It is the least favorable renewability form.","id":"MA-17"},{"n":18,"stem":"An accident-only policy:","choices":["Does not cover sickness","Covers only sickness","Covers sickness and accidents","Covers only long-term care"],"answer":0,"area":"II","explanation":"It is a limited benefit policy.","id":"MA-18"},{"n":19,"stem":"A policy paying a fixed $200 per day while hospitalized, regardless of charges, is a(n):","choices":["Hospital confinement indemnity policy","Medicare supplement","Major medical policy","Disability buy-out policy"],"answer":0,"area":"II","explanation":"Indemnity policies pay fixed amounts.","id":"MA-19"},{"n":20,"stem":"A critical illness policy typically pays:","choices":["Only hospital room charges","Long-term custodial care costs","Monthly disability income","A lump sum upon diagnosis of a covered condition such as heart attack or stroke"],"answer":3,"area":"II","explanation":"It is a specified disease/critical illness limited policy.","id":"MA-20"},{"n":21,"stem":"A plan with a $500 deductible and 70/30 coinsurance covers a $3,500 allowed claim. The plan pays:","choices":["$2,450","$1,050","$3,000","$2,100"],"answer":3,"area":"III.A","explanation":"($3,500 - $500) x 70% = $2,100; the insured pays $1,400.","id":"MA-21"},{"n":22,"stem":"HMOs often pay providers a fixed amount per member per month regardless of services used. This is:","choices":["Coinsurance","Indemnity","Capitation","Fee-for-service"],"answer":2,"area":"III.A","explanation":"Capitation is a prepaid managed-care payment method.","id":"MA-22"},{"n":23,"stem":"Which is commonly excluded from medical expense policies?","choices":["Hospitalization","Prescription drugs","Emergency room care","Cosmetic surgery that is not reconstructive"],"answer":3,"area":"III.A","explanation":"Other common exclusions: war, experimental treatment, and services not medically necessary.","id":"MA-23"},{"n":24,"stem":"Who owns the money in a Health Savings Account?","choices":["The employer","The individual account holder","The HDHP's network","The insurer"],"answer":1,"area":"III.A","explanation":"HSAs are portable and roll over year to year.","id":"MA-24"},{"n":25,"stem":"Distributions from an HSA used for qualified medical expenses are:","choices":["Tax-free","Taxed as capital gains","Taxed as ordinary income","Subject to a 20% penalty"],"answer":0,"area":"III.A","explanation":"HSAs: deductible contributions, tax-free growth, tax-free qualified withdrawals.","id":"MA-25"},{"n":26,"stem":"Medical Savings Accounts (Archer MSAs) were designed mainly for:","choices":["Large unions only","Self-employed people and small employers with high-deductible plans","Medicare Part D enrollees","Medi-Cal recipients"],"answer":1,"area":"III.A","explanation":"They are a precursor to HSAs.","id":"MA-26"},{"n":27,"stem":"A health FSA is generally funded by:","choices":["After-tax premiums only","Medicare","Employee pre-tax salary reductions (with optional employer contributions)","Only the insurer"],"answer":2,"area":"III.A","explanation":"FSAs are consumer-driven arrangements.","id":"MA-27"},{"n":28,"stem":"Under the CDI objectives, adult dental coverage is:","choices":["Mandatory in every plan","Prohibited in PPOs","An optional coverage","Covered only by Medicare Part B"],"answer":2,"area":"III.A","explanation":"Pediatric dental and vision are mandatory.","id":"MA-28"},{"n":29,"stem":"Under the common 'birthday rule' for coordinating a dependent child's benefits, the primary plan is the plan of the parent:","choices":["Whose birthday falls earlier in the calendar year","Who enrolled the child first","Who is older","Who earns more"],"answer":0,"area":"III.A","explanation":"The month and day matter, not the year of birth.","id":"MA-29"},{"n":30,"stem":"After the deductible and coinsurance reach the maximum out-of-pocket amount, the insured's cost for covered services is:","choices":["20% of each bill","$0 for the rest of the plan year","Half of each bill","The deductible again"],"answer":1,"area":"III.A","explanation":"The plan pays 100% after the OOP maximum.","id":"MA-30"},{"n":31,"stem":"Which provider-network plan typically requires referrals from a primary care physician?","choices":["HMO","Indemnity plan","PPO","EPO"],"answer":0,"area":"III.A","explanation":"The gatekeeper model is an HMO feature.","id":"MA-31"},{"n":32,"stem":"In a medical expense policy, the deductible is:","choices":["The monthly premium","The amount the insured pays before the plan begins paying","The insurer's share of each claim","A flat fee per prescription"],"answer":1,"area":"III.A","explanation":"Deductibles may apply per person or per family.","id":"MA-32"},{"n":33,"stem":"In group health insurance, the contract is issued to the employer as a master policy, and covered employees receive:","choices":["Certificates of insurance","Riders only","Binders","Individual policies"],"answer":0,"area":"III.B","explanation":"The employer is the master policyholder.","id":"MA-33"},{"n":34,"stem":"Large group underwriting focuses on:","choices":["Only the employer's net worth","Each employee's credit score","The group as a whole, including occupations and prior claims experience","Each employee's medical exam"],"answer":2,"area":"III.B","explanation":"Individual evidence of insurability is generally not required.","id":"MA-34"},{"n":35,"stem":"Small group health insurance in California is:","choices":["Sold only by HMOs","Available only to sole proprietors","Fully medically underwritten","Guaranteed issue"],"answer":3,"area":"III.B","explanation":"CDI objective.","id":"MA-35"},{"n":36,"stem":"A Qualified Small Employer HRA (QSEHRA) may be offered by employers that:","choices":["Are not applicable large employers and do not offer a group health plan","Are government agencies only","Have more than 500 employees","Offer a group health plan to all employees"],"answer":0,"area":"III.B","explanation":"ICHRAs can be offered by employers of any size.","id":"MA-36"},{"n":37,"stem":"The Family and Medical Leave Act (FMLA) generally provides eligible employees up to:","choices":["26 weeks of paid leave","12 weeks of unpaid, job-protected leave with group health coverage maintained","6 weeks of paid leave","1 year of unpaid leave"],"answer":1,"area":"III.B","explanation":"It applies to employers with 50 or more employees.","id":"MA-37"},{"n":38,"stem":"The Americans with Disabilities Act (ADA) prohibits:","choices":["Employment discrimination against qualified individuals with disabilities","Group disability insurance","All employer health plans","Pre-employment interviews"],"answer":0,"area":"III.B","explanation":"It is a listed federal law affecting group health.","id":"MA-38"},{"n":39,"stem":"The Pregnancy Discrimination Act requires covered employers to:","choices":["Charge pregnant employees more","Cover only pregnancy","Treat pregnancy the same as other medical conditions in their benefit plans","Exclude maternity benefits"],"answer":2,"area":"III.B","explanation":"A listed federal law.","id":"MA-39"},{"n":40,"stem":"When one group policy replaces another, California's discontinuance and replacement rules are designed to ensure that:","choices":["The old insurer keeps paying forever","The new insurer can exclude all prior claims","Employees must re-qualify medically","People covered under the old plan are not left without coverage because of the change"],"answer":3,"area":"III.B","explanation":"CIC 10128.1-10128.4 govern group discontinuance and replacement.","id":"MA-40"},{"n":41,"stem":"Which is one of the ACA's ten essential health benefit categories?","choices":["Travel accident coverage","Cosmetic dental veneers","Long-term custodial care","Mental health and substance use disorder services"],"answer":3,"area":"III.C","explanation":"Others include hospitalization, maternity, prescription drugs, and pediatric services.","id":"MA-41"},{"n":42,"stem":"Under the ACA, in-network recommended preventive services must generally be covered:","choices":["At 50% coinsurance","Only for children","Without cost sharing","Only after the deductible"],"answer":2,"area":"III.C","explanation":"No copay, coinsurance, or deductible for covered preventive care.","id":"MA-42"},{"n":43,"stem":"Which of the following is NOT a qualifying life event for a Special Enrollment Period?","choices":["Loss of employer coverage","Birth of a child","Marriage","Deciding mid-year that you want a richer plan"],"answer":3,"area":"III.C","explanation":"Plan preference alone does not trigger an SEP.","id":"MA-43"},{"n":44,"stem":"A Silver-tier plan has an actuarial value of about:","choices":["60%","90%","80%","70%"],"answer":3,"area":"III.C","explanation":"CSRs are available only through Silver plans.","id":"MA-44"},{"n":45,"stem":"Under the ACA, an individual's premium may NOT be based on:","choices":["Health status","Geographic rating area","Family size","Age"],"answer":0,"area":"III.C","explanation":"Guaranteed issue and community rating rules prohibit health-status rating.","id":"MA-45"},{"n":46,"stem":"An insurer's individual-market MLR falls below 80% for a calendar year. The insurer must:","choices":["Raise next year's rates","Close all policies","Pay a fine to the agent","Pay rebates to enrollees in that market segment"],"answer":3,"area":"III.C","explanation":"MLR rebates go to consumers.","id":"MA-46"},{"n":47,"stem":"A 23-year-old married graduate student wants to stay on her parent's employer plan. Under the ACA she:","choices":["Must leave because she is married","Must leave because she is a student","May stay on the plan until age 26","May stay only if she lives with her parents"],"answer":2,"area":"III.C","explanation":"Marriage, student status, and residency do not matter.","id":"MA-47"},{"n":48,"stem":"Covered California is:","choices":["A private HMO","California's health benefit exchange (marketplace)","The state's Medicare agency","The CDI's licensing division"],"answer":1,"area":"III.C","explanation":"It also runs Covered California for Small Business.","id":"MA-48"},{"n":49,"stem":"Advance Premium Tax Credits, per the CDI objectives, may be available to certain households with income not more than:","choices":["400% FPL","138% FPL","600% FPL","250% FPL"],"answer":0,"area":"III.C","explanation":"Purchase must be a QHP through Covered California.","id":"MA-49"},{"n":50,"stem":"Which coverage counts as minimum essential coverage?","choices":["A dental-only policy","An accident-only policy","Medi-Cal","A cancer-only policy"],"answer":2,"area":"III.C","explanation":"Excepted benefits such as limited policies are not MEC.","id":"MA-50"}],"minutes":60,"meta":"50 questions  |  Time limit: 60 minutes  |  Target: 80% or higher (40+ correct)","notes":["Outline mix: I.A = 5, I.B = 4, I.C = 6, II = 5, III.A = 12, III.B = 8, III.C = 10"],"tagged":true},{"code":"MB","title":"Mixed Exam B (Day 5) - 50 questions weighted to the full official outline","questions":[{"n":1,"stem":"In a reinsurance transaction, the insurer that transfers part of its risk to another insurer is the:","choices":["Reinsurer","Fronting agent","Surplus line broker","Ceding (primary) company"],"answer":3,"area":"I.A","explanation":"CDI objective: the primary insurer cedes loss exposure.","id":"MB-1"},{"n":2,"stem":"Which insurer division calculates premium rates and reserves?","choices":["Underwriting","Actuarial","Marketing","Claims"],"answer":1,"area":"I.A","explanation":"Underwriting selects and classifies risks; claims settles losses.","id":"MB-2"},{"n":3,"stem":"The underwriting division's main function is to:","choices":["Select and classify risks","Pay claims","Recruit agents","Invest reserves"],"answer":0,"area":"I.A","explanation":"This prevents adverse selection.","id":"MB-3"},{"n":4,"stem":"Spreading risk across many policyholders with different, independent exposures supports:","choices":["A profitable distribution of exposures","Adverse selection","Moral hazard","Concealment"],"answer":0,"area":"I.A","explanation":"Insurers need a balanced, predictable mix of risks.","id":"MB-4"},{"n":5,"stem":"In an insurance contract, the insurer's consideration is:","choices":["Its promise to pay covered losses","The premium","The agent's commission","The application"],"answer":0,"area":"I.B","explanation":"The applicant's consideration is premium plus statements.","id":"MB-5"},{"n":6,"stem":"The intentional or unintentional failure to disclose a fact the other party is entitled to know is:","choices":["Waiver","Warranty","Concealment","Estoppel"],"answer":2,"area":"I.B","explanation":"CIC 331 makes concealment grounds for rescission.","id":"MB-6"},{"n":7,"stem":"A California producer license is generally issued for a term of:","choices":["Five years","Three years","Two years","One year"],"answer":2,"area":"I.C","explanation":"CE is completed within each two-year term.","id":"MB-7"},{"n":8,"stem":"Advertising that a named insurer is a member of the California Insurance Guarantee Association is:","choices":["Required on applications only","An unfair practice","Required in all ads","Permitted if true"],"answer":1,"area":"I.C","explanation":"CIC 790.03(g).","id":"MB-8"},{"n":9,"stem":"Under California law, refusing to deliver an insurer's books or assets to the Commissioner after a seizure order in an insolvency proceeding is:","choices":["A civil matter only","Allowed if the insurer appeals","A misdemeanor","Permitted for 30 days"],"answer":2,"area":"I.C","explanation":"CIC 1013 objective.","id":"MB-9"},{"n":10,"stem":"When dealing with senior citizens, an ethical agent should:","choices":["Use urgency to close sales quickly","Take extra care that the client understands the product and that it is suitable","Recommend the highest-commission product","Avoid involving family members at all costs"],"answer":1,"area":"I.C","explanation":"Senior ethics is a listed objective.","id":"MB-10"},{"n":11,"stem":"Under CIC section 16, the word 'shall' is:","choices":["Used only in regulations","Permissive, and 'may' is mandatory","Mandatory, and 'may' is permissive","Optional for agents"],"answer":2,"area":"I.C","explanation":"CIC 16 objective.","id":"MB-11"},{"n":12,"stem":"The Insurance Code and Code of Regulations identify many unethical practices, but they are:","choices":["NOT a complete guide to ethical behavior","Optional for licensees","A complete list of every ethical rule","Enforced only by insurers"],"answer":0,"area":"I.C","explanation":"CDI objective.","id":"MB-12"},{"n":13,"stem":"A policy the insurer cannot cancel during its term but whose premiums may increase by class is:","choices":["Cancellable","Optionally renewable","Noncancelable","Guaranteed renewable"],"answer":3,"area":"II","explanation":"Noncancelable locks the premium too.","id":"MB-13"},{"n":14,"stem":"A hospital indemnity policy pays its benefit:","choices":["Only if the insured has no other coverage","Only for outpatient care","Only after Medicare pays","Regardless of other insurance the insured has"],"answer":3,"area":"II","explanation":"It pays a fixed amount directly to the insured.","id":"MB-14"},{"n":15,"stem":"Which statement about 'accidental bodily injury' coverage is correct?","choices":["It excludes all accidents","It requires both cause and result to be accidental","It covers only sickness","It covers unintended injuries even if the cause was intentional"],"answer":3,"area":"II","explanation":"That is why it is broader than 'accidental means.'","id":"MB-15"},{"n":16,"stem":"Which is commonly excluded under medical expense insurance?","choices":["Emergency services","Physician office visits","Inpatient surgery","Experimental or investigational treatment"],"answer":3,"area":"III.A","explanation":"Common exclusions are a listed objective.","id":"MB-16"},{"n":17,"stem":"A $20 charge each time a member fills a prescription is a:","choices":["Coinsurance","Premium","Copayment","Deductible"],"answer":2,"area":"III.A","explanation":"Copays are flat-dollar amounts.","id":"MB-17"},{"n":18,"stem":"An EPO member who sees an out-of-network specialist for a non-emergency will generally:","choices":["Be covered at 60%","Have no coverage for that visit","Be covered in full","Be covered at 80%"],"answer":1,"area":"III.A","explanation":"EPOs cover in-network only, except emergencies.","id":"MB-18"},{"n":19,"stem":"An HSA withdrawal for non-medical expenses by a 50-year-old is:","choices":["Taxable income plus a 20% penalty","Penalty-free but taxable","Not allowed under any circumstances","Tax-free"],"answer":0,"area":"III.A","explanation":"After 65, non-medical withdrawals are taxable but penalty-free.","id":"MB-19"},{"n":20,"stem":"Unused funds in an employer's HRA:","choices":["Always belong to the employee","May roll over at the employer's discretion","Go to the federal government","Must be paid out as wages"],"answer":1,"area":"III.A","explanation":"The employer owns the HRA.","id":"MB-20"},{"n":21,"stem":"A plan with a $2,000 deductible and 80/20 coinsurance covers a $12,000 allowed claim with a $6,000 out-of-pocket maximum. The insured pays:","choices":["$2,400","$2,000","$4,000","$6,000"],"answer":2,"area":"III.A","explanation":"$2,000 + 20% of $10,000 ($2,000) = $4,000, below the $6,000 OOP max.","id":"MB-21"},{"n":22,"stem":"The maximum out-of-pocket amount includes:","choices":["Monthly premiums","Deductibles, coinsurance, and copays for covered services","Out-of-network balance bills only","Non-covered cosmetic services"],"answer":1,"area":"III.A","explanation":"Premiums do not count toward the OOP max.","id":"MB-22"},{"n":23,"stem":"A POS plan member who self-refers to an out-of-network provider generally:","choices":["Has no coverage at all","Pays nothing","Loses the HMO coverage permanently","Is covered at a higher cost-sharing level"],"answer":3,"area":"III.A","explanation":"That flexibility is the POS feature.","id":"MB-23"},{"n":24,"stem":"Coordination of benefits provisions allow total payment from all plans to equal up to:","choices":["100% of allowable expenses","150% of allowable expenses","200% of allowable expenses","50% of allowable expenses"],"answer":0,"area":"III.A","explanation":"COB prevents profiting from duplicate coverage.","id":"MB-24"},{"n":25,"stem":"Under COBRA, a spouse who loses group coverage because of divorce may continue coverage for up to:","choices":["24 months","18 months","29 months","36 months"],"answer":3,"area":"III.B","explanation":"Divorce is a 36-month qualifying event.","id":"MB-25"},{"n":26,"stem":"A COBRA beneficiary determined disabled by Social Security may extend coverage to a total of:","choices":["24 months","29 months","18 months","48 months"],"answer":1,"area":"III.B","explanation":"The premium may rise to 150% during the extension.","id":"MB-26"},{"n":27,"stem":"A California employer with 12 employees offers group health coverage. Continuation coverage for a departing employee is governed by:","choices":["Medicare","ERISA conversion only","Cal-COBRA","Federal COBRA"],"answer":2,"area":"III.B","explanation":"Cal-COBRA covers employers with 2-19 employees.","id":"MB-27"},{"n":28,"stem":"A plan sends a member's diagnosis to the member's employer without authorization. This most likely violates:","choices":["HIPAA's Privacy Rule","The ADA's hiring rules","COBRA","FMLA"],"answer":0,"area":"III.B","explanation":"PHI is protected under HIPAA.","id":"MB-28"},{"n":29,"stem":"ERISA establishes standards for employer benefit plans, including:","choices":["Medicare premiums","Fiduciary responsibility, reporting, and disclosure","Agent licensing exams","Auto insurance rates"],"answer":1,"area":"III.B","explanation":"ERISA governs most private employer plans.","id":"MB-29"},{"n":30,"stem":"Under the ACA, which is true about lifetime dollar limits on essential health benefits?","choices":["They are allowed above $1 million","They are required in Bronze plans","They are allowed only in group plans","They are prohibited"],"answer":3,"area":"III.C","explanation":"Annual limits on EHB are also prohibited.","id":"MB-30"},{"n":31,"stem":"A Bronze plan has an actuarial value of about:","choices":["60%","80%","90%","70%"],"answer":0,"area":"III.C","explanation":"Lowest premiums, highest cost sharing.","id":"MB-31"},{"n":32,"stem":"To get Advance Premium Tax Credits in California, a consumer must buy:","choices":["A QHP through Covered California","Any short-term plan","A hospital indemnity plan","A Medicare supplement"],"answer":0,"area":"III.C","explanation":"Off-exchange plans do not qualify.","id":"MB-32"},{"n":33,"stem":"Under MAGI, adults 19-64 with income up to 138% FPL are generally eligible for:","choices":["Cal-COBRA","Medi-Cal","Only Bronze plans","Medicare"],"answer":1,"area":"III.C","explanation":"CDI objective figure.","id":"MB-33"},{"n":34,"stem":"Which statement about guaranteed issue under the ACA is correct?","choices":["Insurers may decline applicants with cancer","Insurers must accept applicants regardless of health status, subject to enrollment periods","It applies only to group plans","It applies only to Medicare"],"answer":1,"area":"III.C","explanation":"Enrollment must occur during OEP or an SEP.","id":"MB-34"},{"n":35,"stem":"To have Medicare Part A cover skilled nursing facility care, the beneficiary generally must first have:","choices":["A qualifying inpatient hospital stay of at least 3 days","A Medicare supplement","A Medicare Advantage plan","A 30-day hospital stay"],"answer":0,"area":"III.D","explanation":"Part A covers up to 100 SNF days per benefit period.","id":"MB-35"},{"n":36,"stem":"Medicare Part A limits inpatient care in a psychiatric hospital to:","choices":["190 days in a lifetime","Unlimited days","100 days per benefit period","60 days per year"],"answer":0,"area":"III.D","explanation":"The objectives list mental health inpatient lifetime limits.","id":"MB-36"},{"n":37,"stem":"Which statement about the Medicare Part B premium is correct?","choices":["It is paid only by those under 65","It is paid only once at enrollment","All beneficiaries pay a monthly premium, and higher-income beneficiaries pay more","It is free for everyone"],"answer":2,"area":"III.D","explanation":"The higher-income surcharge is called IRMAA.","id":"MB-37"},{"n":38,"stem":"A Medicare Advantage plan that does not use a network and pays providers on a fee-for-service basis is a:","choices":["Stand-alone PDP","Private Fee-for-Service (PFFS) plan","Medicare supplement Plan F","Special Needs Plan"],"answer":1,"area":"III.D","explanation":"MA models include HMO, PPO, PFFS, and SNPs.","id":"MB-38"},{"n":39,"stem":"The Medicare Annual Enrollment Period for Medicare Advantage and Part D runs:","choices":["January 1 through March 31","July 1 through August 31","October 15 through December 7","November 1 through January 31"],"answer":2,"area":"III.D","explanation":"Changes take effect January 1.","id":"MB-39"},{"n":40,"stem":"Medicare supplement Plan G differs from Plan F mainly because Plan G does NOT cover:","choices":["Part B excess charges","The Part A deductible","The Part B deductible","Part A hospital coinsurance"],"answer":2,"area":"III.D","explanation":"Plan G is popular with people newly eligible after 2020.","id":"MB-40"},{"n":41,"stem":"Medicare supplement Plan N requires the insured to pay:","choices":["Copays of up to $20 for some office visits and up to $50 for some ER visits","A 50% coinsurance on all services","100% of hospital costs","The full Part A deductible"],"answer":0,"area":"III.D","explanation":"Plan N trades lower premiums for some copays.","id":"MB-41"},{"n":42,"stem":"A Medicare supplement application must include a question designed to:","choices":["Choose a Part D formulary","Determine the applicant's net worth","Identify whether the applicant already has a Medicare supplement policy","Record the agent's commission"],"answer":2,"area":"III.D","explanation":"No one may receive benefits from more than one Medigap plan.","id":"MB-42"},{"n":43,"stem":"Under the CDI objectives, an insurer that sells Medicare supplement policies in California must offer:","choices":["Every plan A through N","Plan A (and either Plan C or F)","Only Plan N","Only high-deductible plans"],
