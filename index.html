<style>:root{--bg:#f4f6f9;--card:#ffffff;--text:#141922;--muted:#545d6b;--border:#d5dae1;--accent:#1d4e89;--accent-ink:#ffffff;--accent-soft:#e3ecf7;--ok:#17703a;--ok-soft:#e2f3e7;--bad:#b42318;--bad-soft:#fbe7e5;--warn:#8a5a00;--warn-soft:#fff3d6;--break:#eceff3;--focus:#0b63ce;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1217;--card:#171d25;--text:#e7ebf0;--muted:#a3adba;--border:#2c3541;--accent:#8db8ff;--accent-ink:#0a1830;--accent-soft:#1c2a3e;--ok:#5cd17e;--ok-soft:#14301e;--bad:#ff8a80;--bad-soft:#3a1715;--warn:#f0c060;--warn-soft:#352a10;--break:#131920;--focus:#9cc3ff;--shadow:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1217;--card:#171d25;--text:#e7ebf0;--muted:#a3adba;--border:#2c3541;--accent:#8db8ff;--accent-ink:#0a1830;--accent-soft:#1c2a3e;--ok:#5cd17e;--ok-soft:#14301e;--bad:#ff8a80;--bad-soft:#3a1715;--warn:#f0c060;--warn-soft:#352a10;--break:#131920;--focus:#9cc3ff;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3{line-height:1.25;margin:0 0 .5rem}
h1{font-size:1.35rem}h2{font-size:1.15rem}h3{font-size:1rem}
p{margin:.4rem 0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{min-height:100vh}
main{max-width:860px;margin:0 auto;padding:12px 14px calc(88px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;max-width:860px;margin:0 auto}
.brand{font-weight:700;font-size:1rem}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;min-width:0;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);cursor:pointer;min-height:58px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--accent);font-weight:700}
nav.tabs .navtitle{display:none}
@media (min-width:900px){
 nav.tabs{top:0;bottom:0;right:auto;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--border);padding:14px 10px;gap:4px}
 nav.tabs .navtitle{display:block;font-weight:700;padding:6px 10px 14px;font-size:1rem}
 nav.tabs .navtitle small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
 nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:.95rem;padding:10px 12px;border-radius:10px;min-height:46px}
 nav.tabs button[aria-current=page]{background:var(--accent-soft)}
 #shell{margin-left:220px}
 main{padding-bottom:40px}
 .topbar .brand{visibility:hidden}
}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:600;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{min-width:46px;min-height:46px;border-radius:12px;border:1px solid var(--border);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer;font-size:.9rem;text-align:center;line-height:1.15}
.chip small{display:block;font-size:.72rem;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[aria-pressed=true] small{color:inherit}
.chip.today{box-shadow:inset 0 0 0 2px var(--ok)}
.banner{background:var(--warn-soft);color:var(--text);border:1px solid var(--warn);border-radius:10px;padding:8px 12px;margin:8px 14px 0;font-size:.88rem}
.badge{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--text);font-weight:600;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.progress{height:10px;background:var(--break);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.progress>span{display:block;height:100%;background:var(--accent)}
/* schedule */
.blocks{list-style:none;margin:0;padding:0}
.block{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--border)}
.block:last-child{border-bottom:0}
.block.brk{background:var(--break);border-radius:8px;padding-left:8px;padding-right:8px}
.block input[type=checkbox]{width:26px;height:26px;margin:2px 0 0;flex:none;accent-color:var(--accent);cursor:pointer}
.block label{flex:1;cursor:pointer;min-width:0}
.block .time{font-weight:700;font-size:.85rem;color:var(--muted);display:block}
.block .topic{display:block}
.block .meta{display:block;font-size:.83rem;color:var(--muted)}
.block.done .topic{text-decoration:line-through;text-decoration-color:var(--muted)}
.block .acts{display:flex;flex-direction:column;gap:6px}
/* quiz */
.qhead{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;align-items:center;gap:8px;justify-content:space-between}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:6px 10px;border-radius:10px;background:var(--accent-soft)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.stem{font-size:1.07rem;font-weight:600;margin:4px 0 12px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:54px;padding:12px;border-radius:12px;border:2px solid var(--border);background:var(--card);cursor:pointer;font-size:1rem;line-height:1.35}
.choice .let{flex:none;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--break);font-weight:700;border:1px solid var(--border)}
.choice[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.choice[aria-pressed=true] .let{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.choice.correct{border-color:var(--ok);background:var(--ok-soft)}
.choice.correct .let{background:var(--ok);color:var(--card);border-color:var(--ok)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .let{background:var(--bad);color:var(--card);border-color:var(--bad)}
.choice[disabled]{cursor:default;opacity:1}
.feedback{margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--border)}
.feedback.ok{background:var(--ok-soft);border-color:var(--ok)}
.feedback.bad{background:var(--bad-soft);border-color:var(--bad)}
.qnav{display:flex;gap:8px;margin-top:14px}
.qnav .btn{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:10px}
.grid button{min-height:44px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:600;position:relative;font-size:.9rem}
.grid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.grid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid button.cur{outline:3px solid var(--text);outline-offset:1px}
.grid button.flag::after{content:"";position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:6px}
.flagbtn[aria-pressed=true]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
/* results */
.big{font-size:2.2rem;font-weight:800;line-height:1.1}
.passbar{position:relative;height:16px;border-radius:999px;background:var(--break);border:1px solid var(--border);margin:22px 0 8px}
.passbar>span{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.passbar .mark{position:absolute;top:-20px;bottom:-4px;border-left:2px dashed var(--text);font-size:.7rem;padding-left:3px;color:var(--muted);white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{border-bottom:1px solid var(--border);padding:8px 6px;text-align:left;vertical-align:top}
.tbl th{font-size:.8rem;color:var(--muted);font-weight:700}
.bar{height:8px;background:var(--break);border-radius:999px;overflow:hidden;min-width:60px}
.bar>span{display:block;height:100%}
.rev{border-left:4px solid var(--border);padding:8px 10px;margin:10px 0;background:var(--card);border-radius:0 10px 10px 0}
.rev.ok{border-left-color:var(--ok)}.rev.no{border-left-color:var(--bad)}
.rev ol{margin:6px 0;padding-left:0;list-style:none}
.rev li{padding:3px 6px;border-radius:6px;margin:2px 0}
.rev li.c{background:var(--ok-soft);font-weight:600}
.rev li.y{background:var(--bad-soft)}
@media (max-width:640px){
 .tbl.resp thead{display:none}
 .tbl.resp tr{display:block;border:1px solid var(--border);border-radius:10px;margin:8px 0;padding:6px 8px}
 .tbl.resp td{display:flex;gap:10px;border:0;padding:4px 2px}
 .tbl.resp td::before{content:attr(data-l);flex:0 0 84px;color:var(--muted);font-size:.78rem;font-weight:700}
}
/* flashcards */
.flash{width:100%;min-height:230px;border-radius:18px;border:2px solid var(--border);background:var(--card);cursor:pointer;padding:22px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;box-shadow:var(--shadow)}
.flash .face{font-size:1.25rem;font-weight:700}
.flash.back{background:var(--accent-soft);border-color:var(--accent)}
.flash.back .face{font-size:1.08rem;font-weight:500}
.flash .hint{font-size:.8rem;color:var(--muted)}
.kabtns{display:flex;gap:10px;margin-top:12px}
.kabtns .btn{flex:1;min-height:54px}
.btn.know{border-color:var(--ok);color:var(--ok)}
.btn.again{border-color:var(--bad);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px}
.stat b{display:block;font-size:1.35rem}
.stat span{font-size:.8rem;color:var(--muted)}
label.field{display:block;font-weight:600;font-size:.9rem;margin:8px 0 4px}
select,textarea,input[type=text]{width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--card)}
textarea{min-height:90px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.note{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:.9rem}
.ref h2{margin-top:6px}
.ref ul,.ref ol{padding-left:1.2rem;margin:.3rem 0}
.ref li{margin:.25rem 0}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.url{word-break:break-all;font-size:.82rem}
.setlist{display:flex;flex-direction:column;gap:10px}
.setitem{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.setitem .info{flex:1 1 240px;min-width:0}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media (min-width:640px){.modal-wrap{align-items:center}}
.modal{background:var(--card);color:var(--text);border-radius:16px;max-width:520px;width:100%;padding:18px;max-height:90vh;overflow:auto;border:1px solid var(--border)}
.modal .row{justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:.9rem;max-width:90vw}
@media (min-width:900px){.toast{bottom:24px}}
svg.chart text{fill:var(--muted);font-size:10px}
</style>
</head>

<script type="application/json" id="caah-data">{"title":"California Accident & Health (A&H) Agent Exam","subtitle":"6-Day Maximum-Intensity Study Plan  |  Exam: Tuesday, October 13, 2026  |  All times Pacific (PT)","overviewIntro":"Built for peak score, not maximum hours. Memory is consolidated during sleep: the brain replays and stabilizes what you studied during deep (slow-wave) and REM sleep, and short sleep impairs attention and recall the next day. This plan therefore protects 7.5-8+ hours of sleep every night, uses 50-90-minute focused blocks with short breaks, and schedules a daily walk. About 10-11 focused hours per day on Days 1-5; Day 6 is a mock exam plus a deliberately light evening.","examFacts":[{"item":"Questions","fact":"75 scored multiple-choice questions [S1, S2, S3]. PSI may add 1-10 unscored experimental items that count against your time [S2]."},{"item":"Time limit","fact":"CDI states 90 minutes (1.5 hours) [S1, S3]; the PSI bulletin (rev. March 2026) lists 105 minutes [S2]. Sources differ; this plan trains at 90 minutes. Confirm on your PSI confirmation."},{"item":"Passing score","fact":"60% [S1, S2]. With 75 scored items that works out to 45 correct (our calculation; PSI does not publish a raw cutoff)."},{"item":"Topic weights","fact":"I General Insurance 18 (25%) | II General Concepts of Medical & Disability 4 (5%) | III Medical Expense 45 (60%): Individual 14, Group 8, PPACA 8, Senior Health 15 | IV Disability Income 4 (5%) | V Long-Term Care 4 (5%) [S3]"},{"item":"Education","fact":"12 hours of study on ethics and the California Insurance Code (incl. 1 hour on insurance fraud), required before the license is issued but NOT to sit the exam. The 20-hour A&H prelicensing course was repealed effective Jan 1, 2026 (AB 943) [S4, S5, S6]. Renewal CE: 24 hours per 2-year term, incl. 3 ethics hours (1 on fraud) [S6]."},{"item":"Test day","fact":"Arrive 30 minutes early; late arrivals are not admitted. One valid, unexpired government photo ID with signature that matches your registration [S2]."}],"weekAtGlance":[{"date":"Tue Oct 6 (tonight)","focus":"Kickoff: setup + 20-question diagnostic","sets":"Diagnostic (20)","study":"~1.3 h"},{"date":"Wed Oct 7 - Day 1","focus":"General Insurance: concepts, contract law, CA regulation, unfair practices, ethics, fair claims","sets":"Sets 1, 2","study":"10.9 h"},{"date":"Thu Oct 8 - Day 2","focus":"Policy provisions and underwriting; individual and group medical; HIPAA/COBRA/Cal-COBRA/ERISA","sets":"Sets 3, 4","study":"10.9 h"},{"date":"Fri Oct 9 - Day 3","focus":"PPACA and Covered California; first mixed exam","sets":"Set 5 + Mixed A (50)","study":"10.9 h"},{"date":"Sat Oct 10 - Day 4","focus":"Senior health: Medicare, Medigap, Medi-Cal, HICAP (largest subsection)","sets":"Set 6","study":"10.9 h"},{"date":"Sun Oct 11 - Day 5","focus":"Disability income, tax treatment, long-term care; second mixed exam","sets":"Sets 7, 8 + Mixed B (50)","study":"10.9 h"},{"date":"Mon Oct 12 - Day 6","focus":"FULL MOCK (75 Q / 90 min), repair drills, light evening, bed 9:30 PM","sets":"Mock (75)","study":"7.3 h"},{"date":"Tue Oct 13","focus":"EXAM DAY routine (Section 7)","sets":"-","study":"-"}],"howToUse":["Follow the clock, not your mood. Start each block on time; when a block ends, stop.","Retrieval over re-reading. Each read block ends with closed-book recall. Flashcards go into Green (know), Yellow (shaky), and Red (missed) piles; review Red daily.","Timed sets at exam pace. Use about 72 seconds per question. Grade with the answer keys (Section 4.4), log scores (Section 5), and follow the drill protocol (Section 6) for any set under 80%.","Primary text. Use the CDI 2025 Accident and Health or Sickness License Examination Objectives [S3] as your checklist. Every question here is original and written to those objectives."],"scheduleNote":"Grey rows are breaks, meals, exercise, and sleep. White rows are focused study blocks. Methods: Read = active reading with notes; Flashcards = retrieval practice; Drill = targeted repair; Timed quiz/exam = exam conditions.","days":[{"date":"2026-10-06","title":"Tonight - Tuesday, Oct 6 (Kickoff, ~80 minutes)","focus":"Focus: setup and baseline diagnostic.  Focused study time: 1 h 20 min.","blocks":[{"id":"2026-10-06-0","time":"8:00 PM-8:15 PM","topic":"Setup: print plan, gather the CDI A&H License Examination Objectives (LEO), index cards, timer","method":"Setup","goal":"Workspace ready; phone in another room","kind":"study"},{"id":"2026-10-06-1","time":"8:15 PM-8:40 PM","topic":"Diagnostic quiz (20 questions)","method":"Timed quiz (24 min)","goal":"Baseline score; do not look anything up","kind":"study"},{"id":"2026-10-06-2","time":"8:40 PM-9:05 PM","topic":"Score diagnostic; log it; skim LEO table of contents and weights","method":"Review","goal":"Know which outline areas are weakest","kind":"study"},{"id":"2026-10-06-3","time":"9:05 PM-9:20 PM","topic":"Set up flashcard system (Green/Yellow/Red piles or an SRS app)","method":"Setup","goal":"Ready for Day 1 decks","kind":"study"},{"id":"2026-10-06-4","time":"9:20 PM-10:30 PM","topic":"Wind-down","method":"-","goal":"No studying after 9:30 PM","kind":"break"},{"id":"2026-10-06-5","time":"10:30 PM-6:30 AM","topic":"SLEEP","method":"-","goal":"8 hours","kind":"break"}],"notes":[]},{"date":"2026-10-07","title":"Day 1 - Wednesday, Oct 7","focus":"Focus: General Insurance (25% of exam): concepts, contract law, California marketplace and regulation.  Focused study time: 10 h 55 min.","blocks":[{"id":"2026-10-07-0","time":"6:30 AM-7:00 AM","topic":"Wake, water, breakfast","method":"-","goal":"No phone scrolling; daylight if possible","kind":"break"},{"id":"2026-10-07-1","time":"7:00 AM-7:20 AM","topic":"Diagnostic misses review","method":"Flashcards","goal":"Warm up memory before new material","kind":"study"},{"id":"2026-10-07-2","time":"7:20 AM-8:50 AM","topic":"I.A Basic insurance concepts & principles (risk, peril, hazard, law of large numbers, risk management, insu "},{"id":"2026-10-12-3","time":"8:00 AM-9:30 AM","topic":"FULL MOCK EXAM (75 questions, 90 minutes)","method":"Timed exam, no notes","goal":"Score 80%+ (official pass line is 60%)","kind":"study"},{"id":"2026-10-12-4","time":"9:30 AM-9:45 AM","topic":"Break","method":"-","goal":"Walk","kind":"break"},{"id":"2026-10-12-5","time":"9:45 AM-11:00 AM","topic":"Score mock by outline area; review every miss and guess","method":"Review","goal":"Identify the top 2 weak areas","kind":"study"},{"id":"2026-10-12-6","time":"11:00 AM-11:15 AM","topic":"Break","method":"-","goal":"","kind":"break"},{"id":"2026-10-12-7","time":"11:15 AM-12:30 PM","topic":"Weak-area drill #1","method":"Drill (protocol)","goal":"Fix weakest area","kind":"study"},{"id":"2026-10-12-8","time":"12:30 PM-1:15 PM","topic":"Lunch","method":"-","goal":"","kind":"break"},{"id":"2026-10-12-9","time":"1:15 PM-1:45 PM","topic":"Walk or light exercise","method":"-","goal":"","kind":"break"},{"id":"2026-10-12-10","time":"1:45 PM-3:00 PM","topic":"Weak-area drill #2 + re-answer missed mock questions cold","method":"Drill + retest","goal":"Misses now answered correctly","kind":"study"},{"id":"2026-10-12-11","time":"3:00 PM-3:15 PM","topic":"Break","method":"-","goal":"","kind":"break"},{"id":"2026-10-12-12","time":"3:15 PM-4:30 PM","topic":"Final high-yield pass: uniform provisions, unfair practices, COBRA/Cal-COBRA, ACA numbers, Medicare/Medigap, LTC rules","method":"Recall sheet","goal":"One clean pass","kind":"study"},{"id":"2026-10-12-13","time":"4:30 PM-5:00 PM","topic":"Red-pile flashcards, then STOP studying for the day","method":"Flashcards","goal":"Done by 5:00 PM","kind":"study"},{"id":"2026-10-12-14","time":"5:00 PM-6:00 PM","topic":"Pack exam kit (ID, confirmation); confirm PSI time and route; dinner","method":"-","goal":"Nothing left for the morning","kind":"break"},{"id":"2026-10-12-15","time":"6:00 PM-8:30 PM","topic":"LIGHT EVENING: relax, easy walk, no new material","method":"-","goal":"Optional 10-minute skim of numbers sheet before 7:30 PM","kind":"break"},{"id":"2026-10-12-16","time":"8:30 PM-9:30 PM","topic":"Wind-down; screens off","method":"-","goal":"","kind":"break"},{"id":"2026-10-12-17","time":"9:30 PM-6:00 AM","topic":"SLEEP (8.5 hours)","method":"-","goal":"Earlier bedtime for exam morning","kind":"break"}],"notes":["Day 6 is intentionally shorter (about 7.3 focused hours) and ends by 5:00 PM: going into the exam rested matters more than a few extra hours of review."]}],"recallIntro":"At the end of each day, close your notes and say or write each item from memory. Tick it only if you get it fully right; anything missed becomes a Red flashcard.","recall":[{"day":"Tonight (Oct 6)","items":["Diagnostic scored and logged","Weakest outline areas circled","Flashcard system ready"]},{"day":"Day 1","items":["Define pure vs. speculative risk, peril, hazard (3 types)","State the four contract elements and five contract characteristics","Explain concealment, warranty, representation, materiality, rescission","Name the six CIC 381 policy requirements (and what is NOT required)","Agent vs. broker vs. A&H agent; no A&H solicitor license","Express, implied, apparent authority","Unfair practices: misrepresentation, false advertising, defamation, boycott, twisting, rebating, free insurance","CE: 24 hours / 3 ethics / 1 fraud; 12-hour ethics course before license","Fair claims: 15 / 21 / 40 / 30 days","Privacy (GLBA, CIC 791) and CLHIGA purpose"]},{"day":"Day 2","items":["All 12 mandatory uniform provisions with their time limits","Five renewability types, most to least favorable","Accidental means vs. accidental bodily injury","Each limited policy type in one sentence","Field underwriting, MIB, APS, conditional receipt, delivery steps","HMO vs. PPO vs. EPO vs. POS","HSA vs. HRA vs. FSA vs. MSA","Cost-sharing math (deductible + coinsurance + OOP max)","COBRA 18/29/36 months, 102%, 20+ employees; Cal-COBRA 2-19, 36 months","HIPAA, ERISA, FMLA, ADA, PDA, Mental Health Parity"]},{"day":"Day 3","items":["Metal tiers 60/70/80/90","EHB: no annual/lifetime dollar limits; non-EHB may be limited","MLR 80% individual / 85% group; rebates","FPL: 138% (Medi-Cal adults), 266% (children), 138-250% (CSR), up to 400% (APTC)","OEP vs. SEP and qualifying events","QHP vs. MEC vs. EHB","Covered California agent rules; CIC 790.03(j)","Applicable large employer = 50+ FTE","Mixed Exam A score logged"]},{"day":"Day 4","items":["Medicare eligibility (65, SSDI 24 months, ESRD, ALS)","Part A credits 40 / 30-39 / 0-29","Benefit period (60 days), reserve days (60), coinsurance days 61-90, SNF 3-day stay / 100 days, 190-day psych limit","Part B 80/20, IEP 7 months, GEP Jan 1-Mar 31, SEP 8 months, 10% penalty","Part C vs. Medigap; PDP enrollment ends MA","Part D 1% penalty, 2 drugs per category, AEP Oct 15-Dec 7","Medigap Plan A core; C/F not for newly eligible after 1/1/2020; G and N","CA Medigap: 6-month OE, 60-day birthday rule, 60-day MA add-on, 30-day free look","HICAP and CMS marketing rules (SOA etc.)"]},{"day":"Day 5","items":["Own vs. any occupation; SS definition","Elimination, probationary, and benefit periods","Partial, residual, recurrent; riders (COLA, FIO, SIS, waiver)","BOE vs. buy-out vs. key employee","Tax table: individual DI, group DI, group medical, HSA, TQ LTC","LTC levels of care and settings; 6 ADLs; TQ trigger","CA LTC: 30-day free look, 8-hour training rule, HICAP, shopper's guide, cold lead, twisting, high pressure, worksheet, 15-day specimen","Partnership asset protection","Mixed Exam B score logged"]},{"day":"Day 6","items":["Mock score logged by outline area","Both weak-area drills completed","Exam kit packed: valid ID, confirmation","Bedtime 9:30 PM"]}],"flashIntro":"Copy each card onto an index card or into a spaced-repetition app (term on the front, definition on the back). CIC = California Insurance Code; CCR = California Code of Regulations. Section numbers appear only where checked against leginfo.legislature.ca.gov or the CDI objectives.","decks":[{"name":"Day 1 - General Insurance Concepts & Contract Law","declared":28,"cards":[{"id":"c1","n":1,"front":"Insurance (CIC 22)","back":"Contract to indemnify another against loss, damage, or liability from a contingent or unknown event."},{"id":"c2","n":2,"front":"Risk","back":"Uncertainty about loss."},{"id":"c3","n":3,"front":"Pure risk","back":"Only loss or no loss; insurable."},{"id":"c4","n":4,"front":"Speculative risk","back":"Chance of gain or loss (gambling, investing); not insurable."},{"id":"c5","n":5,"front":"Peril","back":"The cause of loss (sickness, accident)."},{"id":"c6","n":6,"front":"Hazard","back":"A condition that increases the chance or severity of loss."},{"id":"c7","n":7,"front":"Moral hazard","back":"Dishonesty or character flaw (e.g., inflated claims)."},{"id":"c8","n":8,"front":"Morale hazard","back":"Indifference or carelessness because insured."},{"id":"c9","n":9,"front":"Physical hazard","back":"Physical condition increasing loss (e.g., high blood pressure)."},{"id":"c10","n":10,"front":"Law of large numbers","back":"More similar exposure units = more predictable losses."},{"id":"c11","n":11,"front":"Risk transfer","back":"Shifting financial risk to another party; buying insurance."},{"id":"c12","n":12,"front":"Avoidance / Reduction / Retention","back":"Eliminate exposure / lower frequency or severity / keep the risk yourself (deductibles, self-insurance)."},{"id":"c13","n":13,"front":"Adverse selection","back":"Higher-risk people seek insurance more; underwriting counters it."},{"id":"c14","n":14,"front":"Indemnity","back":"Restore to pre-loss position, no profit."},{"id":"c15","n":15,"front":"Insurable interest","back":"A financial stake in the insured person's health or life."},{"id":"c16","n":16,"front":"Utmost good faith","back":"Both parties must disclose honestly."},{"id":"c17","n":17,"front":"Four contract elements","back":"Agreement (offer and acceptance), competent parties, legal purpose, consideration."},{"id":"c18","n":18,"front":"Consideration","back":"Applicant: premium + application statements. Insurer: promise to pay."},{"id":"c19","n":19,"front":"Adhesion","back":"Insurer drafts; ambiguities go to the insured."},{"id":"c20","n":20,"front":"Aleatory","back":"Unequal exchange that depends on an uncertain event."},{"id":"c21","n":21,"front":"Unilateral","back":"Only the insurer makes an enforceable promise."},{"id":"c22","n":22,"front":"Conditional","back":"Insured must meet conditions (e.g., proof of loss) to collect."},{"id":"c23","n":23,"front":"Concealment (CIC 331)","back":"Failing to disclose; intentional OR unintentional concealment allows rescission."},{"id":"c24","n":24,"front":"Representation","back":"Statement believed true; can be altered or withdrawn before insurance is effected (CIC 355)."},{"id":"c25","n":25,"front":"Warranty","back":"Statement guaranteed true; breach of material warranty allows rescission."},{"id":"c26","n":26,"front":"Materiality (CIC 334)","back":"Judged by probable and reasonable influence on the party receiving the information."},{"id":"c27","n":27,"front":"CIC 381 required policy items","back":"Parties, life/property insured, interest, risks, period, premium (financial rating NOT required)."},{"id":"c28","n":28,"front":"Earned vs. unearned premium","back":"Earned = coverage already provided; unearned = for future coverage."}]},{"name":"Day 1 - California Regulation, Licensing, Ethics & Claims","declared":33,"cards":[{"id":"c29","n":29,"front":"Insurance Commissioner","back":"Elected statewide for the same term as the Governor (CIC 12900)."},{"id":"c30","n":30,"front":"CDI vs. DMHC","back":"CDI: disability insurers (most PPO/EPO). DMHC: HMOs, POS, some PPO/EPO."},{"id":"c31","n":31,"front":"Admitted insurer","back":"Holds a California certificate of authority."},{"id":"c32","n":32,"front":"Domestic / Foreign / Alien","back":"Formed in CA / in another U.S. state / in another country."},{"id":"c33","n":33,"front":"Mutual / Stock / Fraternal","back":"Owned by policyholders / by shareholders / by members of a fraternal society."},{"id":"c34","n":34,"front":"Express / Implied / Apparent authority","back":"Written in contract / needed to do the express duties / what the public reasonably believes."},{"id":"c35","n":35,"front":"Fiduciary (CIC 1733-1735)","back":"A person in a position of trust; premiums are held in trust, not commingled."},{"id":"c36","n":36,"front":"Transact (CIC 35)","back":"Solicit, negotiate, effect, or transact insurance; doing so requires a license."},{"id":"c37","n":37,"front":"A&H agent (CIC 1626(a)(2))","back":"Transacts sickness, bodily injury, accidental death and DI coverage; no life/annuity/P&C."},{"id":"c38","n":38,"front":"Notice of appointment (CIC 1704)","back":"Insurer files it to authorize the agent to act for it."},{"id":"c39","n":39,"front":"A&H solicitor","back":"No such license in California (CIC 1704(d))."},{"id":"c40","n":40,"front":"18 U.S.C. 1033","back":"Felony involving dishonesty/breach of trust bars insurance work without written regulator consent."},{"id":"c41","n":41,"front":"Misrepresentation (CIC 790.03(a))","back":"Misstating policy terms, benefits, dividends, or insurer finances."},{"id":"c42","n":42,"front":"False advertising (CIC 790.03(b))","back":"Untrue, deceptive, or misleading public statements about insurance or a person in insurance (covers defamation)."},{"id":"c43","n":43,"front":"Boycott/coercion/intimidation (790.03(c))","back":"Concerted action that unreasonably restrains insurance business."},{"id":"c44","n":44,"front":"Twisting (CIC 781)","back":"Misrepresentation or misleading comparison to induce lapse, surrender, or replacement."},{"id":"c45","n":45,"front":"Rebating","back":"Inducement not stated in the policy (e.g., sharing commission). California rule varies by line; see plan note."},{"id":"c46","n":46,"front":"Defamation","back":"False statements injuring an insurer's or agent's reputation."},{"id":"c47","n":47,"front":"Unfair Practices enforcement","back":"Only the Commissioner enforces CIC 790-790.15."},{"id":"c48","n":48,"front":"Free insurance (CIC 777.1)","back":"Can't give 'free' insurance as an inducement to buy goods or services (narrow exceptions)."},{"id":"c49","n":49,"front":"License number (CIC 1725.5)","back":"Must appear on business cards, quotes, print ads, and licensed-activity emails."},{"id":"c50","n":50,"front":"CE for A&H agents","back":"24 hours per 2-year term, incl. 3 ethics hours (1 on insurance fraud)."},{"id":"c51","n":51,"front":"12-hour Ethics & CIC course","back":"Required before license issuance (includes 1 hour fraud); not required to sit the exam."},{"id":"c52","n":52,"front":"20-hour prelicensing course","back":"Repealed for A&H applicants effective Jan 1, 2026 (AB 943)."},{"id":"c53","n":53,"front":"GLBA / CA Financial Information Privacy Act","back":"Privacy notices; limits sharing of nonpublic personal info."},{"id":"c54","n":54,"front":"CIC 791 privacy act","back":"Insurance Information and Privacy Protection Act: practices, prohibitions, penalties."},{"id":"c55","n":55,"front":"CLHIGA","back":"California Life & Health Insurance Guarantee Association; protects policyholders of insolvent member insurers."},{"id":"c56","n":56,"front":"Claim acknowledgment (10 CCR 2695.5(e))","back":"Within 15 calendar days: acknowledge, send forms, begin investigation."},{"id":"c57","n":57,"front":"CDI inquiry response (2695.5(a))","back":"Within 21 calendar days."},{"id":"c58","n":58,"front":"Accept/deny (2695.7(b))","back":"Within 40 calendar days of proof of claim; health and DI claims follow separate Code timelines."},{"id":"c59","n":59,"front":"Payment after acceptance (2695.7(h))","back":"Within 30 calendar days (same health/DI carve-out)."},{"id":"c60","n":60,"front":"Unfair claims practices (790.03(h))","back":"E.g., misrepresenting facts, failing to act promptly, advising against an attorney, lowball offers."},{"id":"c61","n":61,"front":"Ethics standards","back":"Customer first, competence, needs-based advice, plain language, confidentiality, periodic reviews."}]},{"name":"Day 2 - Policy Provisions, Renewability, Limited Policies & Underwriting","declared":29,"cards":[{"id":"c62","n":62,"front":"Entire contract (10350.1)","back":"Policy + endorsements + attachments; only an executive officer can change it."},{"id":"c63","n":63,"front":"Time limit on certain defenses (10350.2)","back":"After 2 years only fraudulent misstatements can void or deny."},{"id":"c64","n":64,"front":"Grace period (10350.3)","back":"At least 7 days weekly, 10 monthly, 31 for others."},{"id":"c65","n":65,"front":"Reinstatement (10350.4)","back":"Conditional receipt: reinstated on 45th day unless disapproved; sickness covered after 10 days."},{"id":"c66","n":66,"front":"Notice of claim (10350.5)","back":"Within 20 days, or as soon as reasonably possible."},{"id":"c67","n":67,"front":"Claim forms (10350.6)","back":"Insurer furnishes within 15 days, or the claimant may send their own proof."},{"id":"c68","n":68,"front":"Proof of loss (10350.7)","back":"Within 90 days; no later than 1 year unless legally incapacitated."},{"id":"c69","n":69,"front":"Time of payment (10350.8)","back":"Immediately on proof; periodic benefits at least monthly."},{"id":"c70","n":70,"front":"Legal actions (10350.11)","back":"Not before 60 days after proof of loss; not after 3 years."},{"id":"c71","n":71,"front":"Physical exam & autopsy (10350.10)","back":"At the insurer's expense; autopsy where law allows."},{"id":"c72","n":72,"front":"Change of beneficiary (10350.12)","back":"Insured may change unless designation is irrevocable."},{"id":"c73","n":73,"front":"Misstatement of age (optional)","back":"Benefits adjusted to what the premium would buy."},{"id":"c74","n":74,"front":"Noncancelable","back":"Guaranteed renewal + guaranteed premium to stated age."},{"id":"c75","n":75,"front":"Guaranteed renewable","back":"Must renew; premiums may rise by class."},{"id":"c76","n":76,"front":"Conditionally renewable","back":"Nonrenew only for reasons stated (not health)."},{"id":"c77","n":77,"front":"Optionally renewable","back":"Insurer may nonrenew on anniversary/premium date."},{"id":"c78","n":78,"front":"Cancellable","back":"Insurer may cancel anytime with notice."},{"id":"c79","n":79,"front":"Accidental means vs. bodily injury","back":"Means: cause AND result unintended (narrow). Bodily injury: result unintended (broad)."},{"id":"c80","n":80,"front":"Specified/dread disease","back":"Covers only named diseases (e.g., cancer)."},{"id":"c81","n":81,"front":"Critical illness","back":"Lump sum on diagnosis of covered condition."},{"id":"c82","n":82,"front":"Hospital indemnity","back":"Fixed amount per day hospitalized, regardless of charges."},{"id":"c83","n":83,"front":"Accident only / Travel accident","back":"Accidents only, no sickness / accidents while traveling."},{"id":"c84","n":84,"front":"Credit disability","back":"Pays loan payments during disability."},{"id":"c85","n":85,"front":"Application alteration (CIC 10382)","back":"Only with applicant's written consent; insurer may insert admin notes; otherwise a misdemeanor."},{"id":"c86","n":86,"front":"Field underwriting","back":"Agent screens risks, completes the application accurately, and writes the agent's report."},{"id":"c87","n":87,"front":"MIB / APS","back":"Shared coded medical data / Attending Physician's Statement."},{"id":"c88","n":88,"front":"Preferred / standard / substandard","back":"Risk classes; substandard gets a rating, exclusion rider, or decline."},{"id":"c89","n":89,"front":"Conditional receipt","back":"Coverage from application/exam date if insurable as applied for."},{"id":"c90","n":90,"front":"Delivery","back":"Explain policy; collect premium + statement of good health if not paid earlier."}]},{"name":"Day 2 - Medical Expense, CDHPs & Group Laws","declared":28,"cards":[{"id":"c91","n":91,"front":"Deductible","back":"Amount insured pays before plan pays."},{"id":"c92","n":92,"front":"Coinsurance","back":"Percentage split after the deductible (e.g., 80/20)."},{"id":"c93","n":93,"front":"Copayment","back":"Flat dollar per service."},{"id":"c94","n":94,"front":"Maximum out-of-pocket","back":"Annual cap on cost sharing; plan then pays 100% (premiums don't count)."},{"id":"c95","n":95,"front":"HMO","back":"Network + PCP gatekeeper + referrals; out-of-network only for emergencies; capitation."},{"id":"c96","n":96,"front":"PPO","back":"Network discounts; out-of-network allowed at higher cost."},{"id":"c97","n":97,"front":"EPO","back":"Exclusive network, usually no referrals."},{"id":"c98","n":98,"front":"POS","back":"HMO with option to go out-of-network at higher cost."},{"id":"c99","n":99,"front":"HDHP + HSA","back":"HSA requires HDHP; owner-held, portable; triple tax advantage; 20% penalty for nonmedical use before 65."},{"id":"c100","n":100,"front":"HRA","back":"Employer-funded and employer-owned."},{"id":"c101","n":101,"front":"FSA","back":"Employee pre-tax salary reduction; use it or lose it (limited exceptions)."},{"id":"c102","n":102,"front":"MSA (Archer)","back":"Precursor to HSA for self-employed and small employers."},{"id":"c103","n":103,"front":"Pediatric dental & vision","back":"Mandatory; adult dental and vision optional."},{"id":"c104","n":104,"front":"Coordination of benefits","back":"Primary pays first; total capped at 100% of allowable; dependent child 'birthday rule'."},{"id":"c105","n":105,"front":"Subrogation","back":"Insurer recovers from a responsible third party after paying."},{"id":"c106","n":106,"front":"Master policy / certificate","back":"Issued to employer / evidence of coverage for employee."},{"id":"c107","n":107,"front":"Contributory vs. noncontributory","back":"Employees share cost vs. employer pays all."},{"id":"c108","n":108,"front":"Self-funded plan","back":"Employer pays claims; TPA + stop-loss; mainly ERISA-governed."},{"id":"c109","n":109,"front":"Small group (CA)","back":"Guaranteed issue; small business tax credit if 25 or fewer employees via CCSB."},{"id":"c110","n":110,"front":"QSEHRA / ICHRA","back":"Small non-ALE employer reimbursement arrangement / individual-coverage HRA for any size."},{"id":"c111","n":111,"front":"Blanket insurance (10270.2)","back":"Covers a class not individually named (students, teams, passengers)."},{"id":"c112","n":112,"front":"Registered domestic partners (10121.7)","back":"Must get coverage on the same terms as spouses."},{"id":"c113","n":113,"front":"COBRA","back":"20+ employees; 18 mo (termination/hours), 29 (disability), 36 (death, divorce, Medicare, child ages out); up to 102%."},{"id":"c114","n":114,"front":"Cal-COBRA","back":"Employers with 2-19 employees; up to 36 months; can extend federal COBRA to 36 months."},{"id":"c115","n":115,"front":"HIPAA","back":"Portability, health-status nondiscrimination in groups, Privacy Rule for PHI."},{"id":"c116","n":116,"front":"ERISA","back":"Federal standards for employer plans: fiduciary duty, reporting, disclosure."},{"id":"c117","n":117,"front":"FMLA / ADA / PDA","back":"12 weeks job-protected leave / no disability discrimination / pregnancy treated like other conditions."},{"id":"c118","n":118,"front":"Mental Health Parity","back":"MH/SUD limits no stricter than medical/surgical."}]},{"name":"Day 3 - PPACA & Covered California","declared":15,"cards":[{"id":"c119","n":119,"front":"Guaranteed issue","back":"All new individual and group policies; no health-status denial."},{"id":"c120","n":120,"front":"OEP / SEP","back":"Annual open window / special window after qualifying life event."},{"id":"c121","n":121,"front":"Metal tiers (AV)","back":"Bronze 60, Silver 70, Gold 80, Platinum 90."},{"id":"c122","n":122,"front":"Essential health benefits","back":"Ten categories; no annual or lifetime dollar limits."},{"id":"c123","n":123,"front":"Non-EHB","back":"May include dollar limits."},{"id":"c124","n":124,"front":"Preventive care","back":"Covered in-network without cost sharing."},{"id":"c125","n":125,"front":"QHP","back":"Exchange-certified plan meeting ACA standards in a metal tier."},{"id":"c126","n":126,"front":"Minimum essential coverage","back":"Qualifying coverage (employer, Medi-Cal, Medicare, QHPs); limited policies are not MEC."},{"id":"c127","n":127,"front":"MLR","back":"Individual 80%, group 85% (CDI objectives); fail = rebates to that segment."},{"id":"c128","n":128,"front":"Medi-Cal MAGI","back":"Adults 19-64 up to 138% FPL; children under 19 up to 266% FPL."},{"id":"c129","n":129,"front":"CSR","back":"138%-250% FPL; reduces cost sharing on Silver plans."},{"id":"c130","n":130,"front":"APTC","back":"Up to 400% FPL (CDI objectives); paid to insurer to lower premium; QHP via Covered California only."},{"id":"c131","n":131,"front":"Dependent to 26","back":"Regardless of marriage, student status, residency; disabled dependents may continue."},{"id":"c132","n":132,"front":"Applicable large employer","back":"50+ full-time employees including equivalents; shared responsibility payment."},{"id":"c133","n":133,"front":"Covered California agent rule","back":"Must complete agreements and certification; holding out without agreement = unfair practice (790.03(j))."}]},{"name":"Day 4 - Senior Health Products","declared":32,"cards":[{"id":"c134","n":134,"front":"Medicare eligibility","back":"65+, SSDI for 24 months, ESRD, ALS; legal residents need 5 years."},{"id":"c135","n":135,"front":"Part A premium","back":"Free with 40 credits; reduced 30-39; full premium 0-29."},{"id":"c136","n":136,"front":"Part A","back":"Inpatient hospital, SNF after 3-day stay, hospice, some home health; no physician charges."},{"id":"c137","n":137,"front":"Benefit period","back":"Ends after 60 consecutive days out of hospital/SNF; deductible per period."},{"id":"c138","n":138,"front":"Hospital days","back":"1-60 after deductible; 61-90 daily coinsurance; 60 lifetime reserve days."},{"id":"c139","n":139,"front":"Psychiatric hospital limit","back":"190 days lifetime."},{"id":"c140","n":140,"front":"Part B","back":"Physicians, outpatient; monthly premium (IRMAA for high income); deductible; 80/20; no OOP max."},{"id":"c141","n":141,"front":"Assignment","back":"Provider accepts Medicare-approved amount as full payment."},{"id":"c142","n":142,"front":"IEP","back":"7 months: 3 before, birth month, 3 after."},{"id":"c143","n":143,"front":"GEP","back":"January 1 - March 31."},{"id":"c144","n":144,"front":"Part B SEP","back":"8 months after employment-based coverage ends."},{"id":"c145","n":145,"front":"Part B penalty","back":"10% per full 12 months without coverage, generally for life."},{"id":"c146","n":146,"front":"Part A penalty","back":"10% for twice the number of years not enrolled."},{"id":"c147","n":147,"front":"Part C (Medicare Advantage)","back":"Private HMO/PPO/PFFS/SNP plans; covers all Original Medicare benefits; not a Medigap."},{"id":"c148","n":148,"front":"D-SNP","back":"Plan for Medicare + Medi-Cal dual eligibles."},{"id":"c149","n":149,"front":"Part D","back":"Optional drug coverage; PDP or MAPD; formulary at least 2 drugs per category; tiers."},{"id":"c150","n":150,"front":"Part D penalty","back":"1% of base premium per month without creditable coverage, for life."},{"id":"c151","n":151,"front":"AEP","back":"Oct 15 - Dec 7 for MA and Part D changes."},{"id":"c152","n":152,"front":"PDP + MA rule","back":"Joining a stand-alone PDP automatically ends MA enrollment."},{"id":"c153","n":153,"front":"Medigap Plan A","back":"Core benefits in every plan; insurers must offer Plan A (and C or F per CDI)."},{"id":"c154","n":154,"front":"Plans C and F","back":"Not sold to people newly eligible on/after Jan 1, 2020 (cover Part B deductible)."},{"id":"c155","n":155,"front":"Plan G / Plan N","back":"F minus Part B deductible / copays up to $20 office, $50 ER."},{"id":"c156","n":156,"front":"Plans K and L","back":"Cost-sharing plans with out-of-pocket limits."},{"id":"c157","n":157,"front":"Medigap open enrollment (10192.11)","back":"6 months from first month age 65+ and in Part B."},{"id":"c158","n":158,"front":"Birthday rule (10192.11(h))","back":"60+ days starting on birthday; switch to equal or lesser benefits."},{"id":"c159","n":159,"front":"MA termination (10192.11(g))","back":"Additional 60-day Medigap open enrollment."},{"id":"c160","n":160,"front":"Medigap free look (10192.17(e))","back":"30 days; refund within 30 days of return."},{"id":"c161","n":161,"front":"Medigap duplication","back":"No benefits from two Medigap plans; application must ask."},{"id":"c162","n":162,"front":"Medicare Summary Notice","back":"Statement of services, payments, and amounts owed; not a bill."},{"id":"c163","n":163,"front":"HICAP","back":"Free counseling; CA Dept of Aging via Area Agencies on Aging; 1-800-434-0222."},{"id":"c164","n":164,"front":"CMS marketing rules","back":"Scope of Appointment, call recording, permission to contact, TPMO disclaimer, secret shoppers."},{"id":"c165","n":165,"front":"Medi-Cal","back":"California Medicaid: needs-based, joint federal-state."}]},{"name":"Day 5 - Disability Income & Tax Treatment","declared":22,"cards":[{"id":"c166","n":166,"front":"Elimination period","back":"Waiting time before DI benefits; longer = cheaper."},{"id":"c167","n":167,"front":"Probationary period","back":"Initial period when sickness is not covered."},{"id":"c168","n":168,"front":"Benefit period","back":"Maximum time benefits are paid."},{"id":"c169","n":169,"front":"Own occupation / any occupation","back":"Can't perform own job / can't perform any job suited by education and experience."},{"id":"c170","n":170,"front":"Social Security disability","back":"Can't do any substantial gainful activity; 12+ months or death; strict."},{"id":"c171","n":171,"front":"Partial disability","back":"Some duties; typically about 50% benefit for limited time."},{"id":"c172","n":172,"front":"Residual disability","back":"Pays proportion of income lost."},{"id":"c173","n":173,"front":"Recurrent disability","back":"Same cause within set period = continuation; no new EP."},{"id":"c174","n":174,"front":"Waiver of premium","back":"Premiums waived during total disability."},{"id":"c175","n":175,"front":"COLA rider","back":"Benefits increase with inflation during claim."},{"id":"c176","n":176,"front":"Future increase option","back":"Buy more coverage without evidence of insurability."},{"id":"c177","n":177,"front":"Social insurance substitute rider","back":"Pays when Social Security/other benefits denied."},{"id":"c178","n":178,"front":"Business overhead expense","back":"Rent, utilities, staff salaries; deductible premiums, taxable benefits."},{"id":"c179","n":179,"front":"Disability buy-out","back":"Funds buy-sell; nondeductible premium, tax-free benefits."},{"id":"c180","n":180,"front":"Key employee DI","back":"Business is owner and beneficiary."},{"id":"c181","n":181,"front":"Individual DI taxation","back":"After-tax premium = tax-free benefits."},{"id":"c182","n":182,"front":"Group DI taxation","back":"Employer-paid premium (deductible, excluded) = taxable benefits."},{"id":"c183","n":183,"front":"Group medical taxation","back":"Employer premiums deductible and excluded from employee income; benefits tax-free."},{"id":"c184","n":184,"front":"CA SDI","back":"State short-term disability program funded by employee payroll deductions."},{"id":"c185","n":185,"front":"HIV/AIDS rule (CIC 799)","back":"No unfair distinctions in underwriting."},{"id":"c186","n":186,"front":"Genetic characteristics (10146/10147)","back":"No unfair discrimination on genetic tests; gene causing disease without symptoms."},{"id":"c187","n":187,"front":"Rate components","back":"Morbidity, expenses, investment return, benefit duration (EP, probationary)."}]},{"name":"Day 5 - Long-Term Care","declared":17,"cards":[{"id":"c188","n":188,"front":"Levels of care","back":"Skilled, intermediate, custodial, home care, community-based."},{"id":"c189","n":189,"front":"Settings","back":"Nursing home, assisted living, RCFE, home, hospice, respite, adult day care."},{"id":"c190","n":190,"front":"ADLs","back":"Bathing, dressing, eating, toileting, transferring, continence."},{"id":"c191","n":191,"front":"TQ benefit trigger","back":"2 of 6 ADLs for 90+ days, or severe cognitive impairment."},{"id":"c192","n":192,"front":"TQ taxation","back":"Benefits generally tax-free within limits; premiums may be medical expense."},{"id":"c193","n":193,"front":"CA Partnership","back":"Dollar-for-dollar Medi-Cal asset protection; extra agent training."},{"id":"c194","n":194,"front":"LTC free look (10232.7)","back":"30 days; void from start; refund within 30 days."},{"id":"c195","n":195,"front":"LTC agent training (10234.93)","back":"8 hrs in each of first four 12-month periods, then 8 hrs before each renewal; counts toward CE."},{"id":"c196","n":196,"front":"HICAP notice","back":"Provide local HICAP info + 1-800-434-0222 at solicitation."},{"id":"c197","n":197,"front":"Shopper's guide","back":"CA Dept of Aging guide before presenting application."},{"id":"c198","n":198,"front":"Notice to buyer","back":"Policy may not cover all LTC costs (page one)."},{"id":"c199","n":199,"front":"Twisting / high pressure / cold lead","back":"Prohibited LTC marketing practices (10234.93(b))."},{"id":"c200","n":200,"front":"Personal Worksheet","back":"Suitability tool (10234.95)."},{"id":"c201","n":201,"front":"Specimen policy","back":"Provided within 15 calendar days on request."},{"id":"c202","n":202,"front":"Replacement","back":"Unnecessary replacement prohibited; producer compensation limited (10234.85, 10234.97)."},{"id":"c203","n":203,"front":"Inflation protection","back":"Keeps benefits from eroding over time."},{"id":"c204","n":204,"front":"Duty of good faith (10234.8)","back":"Insurers and agents owe honesty, good faith, fair dealing."}]}],"keyNumbersTitle":"3.3 One-page high-yield numbers sheet (review on Day 5, Day 6, and exam morning)","keyNumbers":[{"topic":"Exam","numbers":"75 scored Qs; 60% to pass; CDI says 90 min (PSI says 105); weights 18 / 4 / 45 (14 + 8 + 8 + 15) / 4 / 4"},{"topic":"Licensing / CE","numbers":"12-hour ethics & CIC course (1 hour fraud) before license; 24 CE hours per 2-year term (3 ethics, 1 fraud); LTC: 8 hours in each of first 4 years, then 8 before each renewal"},{"topic":"Uniform provisions","numbers":"Grace 7 / 10 / 31 days; time limit on defenses 2 years; reinstatement 45 days (sickness after 10 days); notice of claim 20 days; claim forms 15 days; proof of loss 90 days (max 1 year); legal action 60 days to 3 years"},{"topic":"Fair claims (10 CCR 2695)","numbers":"Acknowledge 15 days; respond to claimant 15 days; respond to CDI 21 days; accept/deny 40 days; pay 30 days (health/DI claims follow separate Code timelines)"},{"topic":"COBRA / Cal-COBRA","numbers":"COBRA 20+ employees; 18 / 29 / 36 months; 102% (150% during disability extension). Cal-COBRA 2-19 employees; up to 36 months total"},{"topic":"ACA","numbers":"Bronze 60 / Silver 70 / Gold 80 / Platinum 90; MLR 80 individual / 85 group; Medi-Cal 138% (adults), 266% (children); CSR 138-250%; APTC up to 400%; dependents to 26; ALE 50+ FTE"},{"topic":"Medicare A","numbers":"40 credits free (30-39 reduced); benefit period ends after 60 days out; coinsurance days 61-90; 60 lifetime reserve days; SNF after 3-day stay, up to 100 days; psychiatric 190 days lifetime"},{"topic":"Medicare B / D","numbers":"80/20; IEP 7 months; GEP Jan 1-Mar 31; SEP 8 months; B penalty 10% per 12 months; D penalty 1% per month; AEP Oct 15-Dec 7; formulary at least 2 drugs per category"},{"topic":"Medigap (California)","numbers":"Open enrollment 6 months (65+ and in Part B); birthday rule 60+ days from birthday; +60 days after MA termination; free look 30 days; C and F closed to people newly eligible after 1/1/2020"},{"topic":"LTC (California)","numbers":"Free look 30 days; specimen policy within 15 days; HICAP 1-800-434-0222; TQ trigger 2 of 6 ADLs (90 days) or severe cognitive impairment"},{"topic":"Taxes","numbers":"Individual DI: after-tax premium, tax-free benefits. Employer group DI: deductible premium, taxable benefits. BOE: deductible premium, taxable benefits. Buy-out: nondeductible premium, tax-free benefits. HSA: triple tax advantage; 20% penalty for nonmedical use before 65"}],"questionsIntro":"Every question below is original, written for this plan from the CDI License Examination Objectives. None is copied from a commercial prep provider. Answer on scratch paper, then grade with the answer keys in Section 4.4.","sets":[{"code":"DX","title":"Diagnostic Quiz (Tonight, Oct 6)","questions":[{"n":1,"stem":"A risk that offers only the chance of loss or no loss (never a gain) is a:","choices":["Pure risk","Speculative risk","Dynamic risk","Fundamental gain"],"answer":0,"area":null,"explanation":"Only pure risks are insurable; speculative risks involve a chance of gain.","id":"DX-1"},{"n":2,"stem":"An applicant's tendency toward dishonesty, such as exaggerating claims, is a:","choices":["Moral hazard","Peril","Morale hazard","Physical hazard"],"answer":0,"area":null,"explanation":"Moral hazard = character/dishonesty; morale hazard = indifference or carelessness.","id":"DX-2"},{"n":3,"stem":"An insurance policy is 'unilateral' because:","choices":["Both parties must perform equally","Only the insurer makes a legally enforceable promise","The insured writes the contract terms","It can be changed by either party at will"],"answer":1,"area":null,"explanation":"The insured can stop paying premiums; only the insurer is bound to perform.","id":"DX-3"},{"n":4,"stem":"A California accident and health or sickness agent is NOT authorized to transact:","choices":["Medicare supplement insurance","Long-term care insurance","Disability income insurance","Life insurance"],"answer":3,"area":null,"explanation":"Per the CDI objectives, A&H agents have no authority over life, annuity, property, or casualty lines.","id":"DX-4"},{"n":5,"stem":"Making a misleading comparison of policies to induce a policyholder to lapse a policy and buy another is:","choices":["Rebating","Twisting","Coercion","Sliding"],"answer":1,"area":null,"explanation":"CIC 781 prohibits misrepresentations or misleading comparisons used to induce a lapse or surrender.","id":"DX-5"},{"n":6,"stem":"Under California's uniform provisions, the minimum grace period for a MONTHLY premium disability policy is:","choices":["7 days","60 days","10 days","31 days"],"answer":2,"area":null,"explanation":"CIC 10350.3: not less than 7 (weekly), 10 (monthly), 31 (all others).","id":"DX-6"},{"n":7,"stem":"Under the Notice of Claim uniform provision, written notice should be given within:","choices":["90 days after the loss","10 days after the loss","1 year after the loss","20 days after the loss occurs, or as soon as reasonably possible"],"answer":3,"area":null,"explanation":"CIC 10350.5 sets 20 days or as soon thereafter as reasonably possible.","id":"DX-7"},{"n":8,"stem":"In an HMO, the primary care physician who coordinates care and makes referrals is called the:","choices":["Network adjuster","Utilization reviewer","Third-party administrator","Gatekeeper"],"answer":3,"area":null,"explanation":"The gatekeeper PCP controls access to specialists.","id":"DX-8"},{"n":9,"stem":"Federal COBRA generally applies to employers with:","choices":["100 or more employees","20 or more employees","50 or more employees","2 or more employees"],"answer":1,"area":null,"explanation":"Smaller CA employers (2-19) are covered by Cal-COBRA instead.","id":"DX-9"},{"n":10,"stem":"Under the ACA, a child may remain on a parent's health plan until:","choices":["Age 21, or 25 if a full-time student","Age 26","Age 19","Age 23"],"answer":1,"area":null,"explanation":"The CDI objectives state coverage may extend through the 26th birthday.","id":"DX-10"},{"n":11,"stem":"A Bronze-tier health plan has an actuarial value of approximately:","choices":["80%","70%","60%","90%"],"answer":2,"area":null,"explanation":"Bronze 60%, Silver 70%, Gold 80%, Platinum 90%.","id":"DX-11"},{"n":12,"stem":"Medicare Part B primarily covers:","choices":["Physician services and outpatient care","Prescription drugs only","Long-term custodial nursing home care","Inpatient hospital room and board"],"answer":0,"area":null,"explanation":"Part A = hospital; Part B = medical/physician; Part D = drugs.","id":"DX-12"},{"n":13,"stem":"In California, a Medicare supplement policyholder may return the policy for a full refund within:","choices":["60 days of receiving it","15 days of receiving it","30 days of receiving it","10 days of receiving it"],"answer":2,"area":null,"explanation":"CIC 10192.17(e) requires a 30-day right to return.","id":"DX-13"},{"n":14,"stem":"A Medicare supplement open enrollment period lasts six months beginning with the first month the person is:","choices":["Enrolled in Medicare Part D","Age 65 or older and enrolled in Medicare Part B","Enrolled in a Medicare Advantage plan","Age 62 and receiving Social Security"],"answer":1,"area":null,"explanation":"CIC 10192.11(a): six months starting the first month both 65+ and enrolled in Part B.","id":"DX-14"},{"n":15,"stem":"In a disability income policy, the elimination period is the:","choices":["Time after disability begins before benefits are payable","Time during which sickness is not covered after issue","Time an insurer has to contest the application","Maximum period benefits will be paid"],"answer":0,"area":null,"explanation":"The elimination period works like a time deductible.","id":"DX-15"},{"n":16,"stem":"An individual pays disability income premiums with after-tax dollars. Benefits received are:","choices":["Taxable only above $10,000","Taxed as capital gains","Fully taxable as ordinary income","Received income-tax free"],"answer":3,"area":null,"explanation":"Personally paid, nondeductible premiums produce tax-free benefits.","id":"DX-16"},{"n":17,"stem":"Long-term care benefits are typically triggered by:","choices":["Any hospital admission","Reaching age 65","Inability to perform activities of daily living or cognitive impairment","Retirement from employment"],"answer":2,"area":null,"explanation":"ADL dependence or cognitive impairment are the standard benefit triggers.","id":"DX-17"},{"n":18,"stem":"An individual long-term care policy in California has a free-look period of:","choices":["20 days","45 days","10 days","30 days"],"answer":3,"area":null,"explanation":"CIC 10232.7 grants a 30-day right to return individual LTC policies.","id":"DX-18"},{"n":19,"stem":"HICAP provides Medicare beneficiaries with:","choices":["Low-cost Medicare supplement policies","Licensing for senior-market agents","Free, unbiased counseling on Medicare, Medicare supplement, and LTC insurance","Claims adjusting for Medi-Cal"],"answer":2,"area":null,"explanation":"HICAP is a free counseling and advocacy program; it does not sell insurance.","id":"DX-19"},{"n":20,"stem":"Under California's Fair Claims Settlement Practices Regulations, after receiving notice of a claim the insurer must acknowledge it within:","choices":["15 calendar days","30 calendar days","5 calendar days","40 calendar days"],"answer":0,"area":null,"explanation":"10 CCR 2695.5(e): acknowledge, provide forms, and begin investigation within 15 calendar days.","id":"DX-20"}],"minutes":24,"meta":"20 questions  |  Time limit: 24 minutes  |  Target: 80% or higher (16+ correct)","notes":[],"tagged":false},{"code":"S1","title":"Practice Set 1: General Insurance Concepts & Contract Law (outline I.A-I.B)","questions":[{"n":1,"stem":"California Insurance Code section 22 defines insurance as a contract whereby one undertakes to:","choices":["Guarantee a profit on an investment","Share business risks among partners","Pay a fixed sum regardless of any loss","Indemnify another against loss, damage, or liability arising from a contingent or unknown event"],"answer":3,"area":null,"explanation":"CIC 22 is the statutory definition of insurance.","id":"S1-1"},{"n":2,"stem":"Which is an example of speculative risk?","choices":["Buying shares of stock","Developing cancer","Being injured in a car accident","Becoming disabled"],"answer":0,"area":null,"explanation":"Speculative risk has a chance of gain and is not insurable.","id":"S1-2"},{"n":3,"stem":"In insurance terms, a peril is:","choices":["The insurer's liability limit","A condition that increases the chance of loss","The cause of a loss","The amount of the loss"],"answer":2,"area":null,"explanation":"Peril = cause (illness, accident); hazard = condition that increases it.","id":"S1-3"},{"n":4,"stem":"A hazard is best defined as:","choices":["The cause of a loss","A guaranteed loss","A condition that increases the chance or severity of a loss","The premium charged for a risk"],"answer":2,"area":null,"explanation":"Hazards are moral, morale, or physical conditions.","id":"S1-4"},{"n":5,"stem":"An insured who stops taking reasonable precautions because 'insurance will pay' illustrates a:","choices":["Morale hazard","Moral hazard","Speculative risk","Physical hazard"],"answer":0,"area":null,"explanation":"Morale hazard = indifference or carelessness due to having insurance.","id":"S1-5"},{"n":6,"stem":"An applicant's high blood pressure is an example of a:","choices":["Pure peril","Morale hazard","Physical hazard","Moral hazard"],"answer":2,"area":null,"explanation":"Physical hazards are physical conditions that increase loss chances.","id":"S1-6"},{"n":7,"stem":"The law of large numbers states that:","choices":["Large insurers charge lower premiums","Large losses are always uninsurable","Every insured will eventually file a claim","The larger the group of similar exposures, the more predictable the losses"],"answer":3,"area":null,"explanation":"Predictability lets insurers price risk.","id":"S1-7"},{"n":8,"stem":"Buying a health insurance policy is which risk management technique?","choices":["Retention","Avoidance","Reduction","Transfer"],"answer":3,"area":null,"explanation":"Insurance transfers the financial risk to the insurer.","id":"S1-8"},{"n":9,"stem":"A person who gives up skydiving to avoid injury is using:","choices":["Transfer","Avoidance","Retention","Sharing"],"answer":1,"area":null,"explanation":"Avoidance eliminates exposure to the risk.","id":"S1-9"},{"n":10,"stem":"Which is a requisite of an ideally insurable risk?","choices":["The loss must be certain to happen to everyone at once","The loss must be definite and measurable","The loss must be intentional","The loss must offer a chance of profit"],"answer":1,"area":null,"explanation":"Insurable losses are accidental, measurable, non-catastrophic, and among many similar exposures.","id":"S1-10"},{"n":11,"stem":"The tendency of people with a greater likelihood of loss to seek insurance more than others is:","choices":["Law of large numbers","Risk retention","Indemnity","Adverse selection"],"answer":3,"area":null,"explanation":"Underwriting exists largely to prevent adverse selection.","id":"S1-11"},{"n":12,"stem":"The principle of indemnity means insurance should:","choices":["Restore the insured to approximately their pre-loss financial position, without profit","Return all premiums at policy end","Pay only if the insurer profits","Pay the insured more than the loss"],"answer":0,"area":null,"explanation":"Indemnity prevents an insured from profiting from a loss.","id":"S1-12"},{"n":13,"stem":"Insurance contracts require both parties to deal honestly and disclose material facts. This is:","choices":["Subrogation","Utmost good faith","Adhesion","Consideration"],"answer":1,"area":null,"explanation":"Utmost good faith underlies concealment and misrepresentation rules.","id":"S1-13"},{"n":14,"stem":"In a health insurance contract, the applicant's consideration consists of:","choices":["The insurer's promise to pay claims","The agent's signature","The application statements and the initial premium","The outline of coverage"],"answer":2,"area":null,"explanation":"The insurer's consideration is its promise to pay covered losses.","id":"S1-14"},{"n":15,"stem":"Because an insurance policy is a contract of adhesion, ambiguities are generally:","choices":["Voided automatically","Resolved by the agent","Interpreted in favor of the insurer","Interpreted in favor of the insured"],"answer":3,"area":null,"explanation":"The insurer drafted the contract, so ambiguities go against it.","id":"S1-15"},{"n":16,"stem":"An insurance contract is aleatory because:","choices":["The values exchanged may be unequal and depend on an uncertain event","Only one party makes a promise","It is personal to the insured","It must be in writing"],"answer":0,"area":null,"explanation":"A small premium may buy a large benefit if a loss occurs.","id":"S1-16"},{"n":17,"stem":"An insurance contract is conditional because:","choices":["It is valid only in California","The insurer pays only if the insured meets certain conditions, such as submitting proof of loss","The premium can change daily","The agent can change the terms"],"answer":1,"area":null,"explanation":"Conditions must be satisfied before the insurer's promise is enforceable.","id":"S1-17"},{"n":18,"stem":"Under California law, concealment that entitles the injured party to rescind a contract may be:","choices":["Only concealment proven in court","Unintentional only","Intentional only","Either intentional or unintentional"],"answer":3,"area":null,"explanation":"CIC 331: intentional or unintentional concealment entitles the injured party to rescind.","id":"S1-18"},{"n":19,"stem":"Under California law, each party to an insurance contract is NOT required to communicate:","choices":["Its own judgment on the matters in question","Its occupation when asked","Material facts within its knowledge","Known prior medical treatment"],"answer":0,"area":null,"explanation":"CIC 339: information based on personal judgment need not be communicated.","id":"S1-19"},{"n":20,"stem":"Violation of a material warranty in an insurance contract:","choices":["Has no effect on the contract","Automatically doubles the premium","Entitles the other party to rescind the contract","Converts the policy to term coverage"],"answer":2,"area":null,"explanation":"CIC 440-445, 447 objectives: violation of a material warranty allows rescission.","id":"S1-20"},{"n":21,"stem":"Under California law, a representation may be altered or withdrawn:","choices":["Only after a claim is filed","Before the insurance is effected, but not afterward","At any time during the policy term","Only with the Commissioner's approval"],"answer":1,"area":null,"explanation":"CIC 355 objective: alteration or withdrawal is allowed before the insurance takes effect.","id":"S1-21"},{"n":22,"stem":"Materiality of a fact is determined by:","choices":["The agent's personal opinion","The probable and reasonable influence of the facts on the party to whom the communication is due","Whether a loss later occurs","The size of the premium"],"answer":1,"area":null,"explanation":"CIC 334: materiality is judged by influence on the insurer's decision, not by the event.","id":"S1-22"},{"n":23,"stem":"Which of the following is NOT required to be specified in an insurance policy under California law?","choices":["The period during which insurance continues","The parties to the contract","The insurer's financial rating","The risks insured against"],"answer":2,"area":null,"explanation":"CIC 381 lists required items; the financial rating is expressly not required.","id":"S1-23"},{"n":24,"stem":"The portion of premium for coverage that has not yet been provided is the:","choices":["Unearned premium","Rate","Earned premium","Deductible"],"answer":0,"area":null,"explanation":"Earned premium covers the expired portion of the term.","id":"S1-24"},{"n":25,"stem":"Insurance contracts are governed mainly by contract law, whereas negligence claims fall under:","choices":["Tort law","Admiralty law","Agency law","Probate law"],"answer":0,"area":null,"explanation":"The objectives ask candidates to compare contract law and tort law.","id":"S1-25"}],"minutes":30,"meta":"25 questions  |  Time limit: 30 minutes  |  Target: 80% or higher (20+ correct)","notes":[],"tagged":false},{"code":"S2","title":"Practice Set 2: California Regulation, Licensing, Unfair Practices, Ethics, Privacy & Fair Claims (I.C)","questions":[{"n":1,"stem":"The California Insurance Commissioner is:","choices":["Chosen by the NAIC","Appointed by the Legislature","Elected by the voters of California","Appointed by the Governor"],"answer":2,"area":null,"explanation":"CIC 12900: the Commissioner is elected at the same time and for the same term as the Governor.","id":"S2-1"},{"n":2,"stem":"In California, the primary regulator of HMO and POS plans is the:","choices":["Department of Aging","Department of Insurance","Covered California","Department of Managed Health Care"],"answer":3,"area":null,"explanation":"The CDI objectives name DMHC as primary regulator of HMOs and POS plans.","id":"S2-2"},{"n":3,"stem":"The California Department of Insurance is the primary regulator of:","choices":["All HMO plans","Most PPO and EPO plans issued by disability insurers","Medi-Cal managed care plans","Original Medicare"],"answer":1,"area":null,"explanation":"CDI regulates disability insurers, including most PPO/EPO issuers.","id":"S2-3"},{"n":4,"stem":"An insurer that holds a certificate of authority to transact insurance in California is:","choices":["Non-admitted","Admitted","Alien","Fraternal"],"answer":1,"area":null,"explanation":"Admitted insurers are authorized by the Commissioner.","id":"S2-4"},{"n":5,"stem":"An insurer incorporated in Arizona and doing business in California is, in California, a(n):","choices":["Alien insurer","Foreign insurer","Domestic insurer","Non-admitted insurer"],"answer":1,"area":null,"explanation":"Foreign = another U.S. state; alien = another country.","id":"S2-5"},{"n":6,"stem":"A mutual insurer is owned by its:","choices":["Agents","Policyholders","Stockholders","State government"],"answer":1,"area":null,"explanation":"Mutuals may return divisible surplus as policy dividends.","id":"S2-6"},{"n":7,"stem":"Authority the public reasonably believes an agent has, based on the insurer's conduct, is:","choices":["Implied authority","Fiduciary authority","Express authority","Apparent authority"],"answer":3,"area":null,"explanation":"Express = written; implied = needed to carry out express; apparent = public perception.","id":"S2-7"},{"n":8,"stem":"Under California law, premiums an agent receives are held:","choices":["In a fiduciary capacity","As the agent's personal income","As a loan from the insurer","In escrow by the Commissioner"],"answer":0,"area":null,"explanation":"CIC 1733-1735 establish producer fiduciary duties.","id":"S2-8"},{"n":9,"stem":"Issuing a statement that misrepresents the benefits or terms of a policy is prohibited by the Unfair Practices Act as:","choices":["Boycott","Rebating","Misrepresentation","Coercion"],"answer":2,"area":null,"explanation":"CIC 790.03(a) prohibits misrepresenting policy terms and benefits.","id":"S2-9"},{"n":10,"stem":"Running an ad containing statements about insurance that are untrue, deceptive, or misleading is:","choices":["False advertising","Twisting","Sliding","Rebating"],"answer":0,"area":null,"explanation":"CIC 790.03(b) prohibits untrue, deceptive, or misleading statements before the public.","id":"S2-10"},{"n":11,"stem":"Agreeing with other agents to refuse to do business with an insurer until it raises commissions is a(n):","choices":["Misrepresentation","Rebate","Defamation","Boycott"],"answer":3,"area":null,"explanation":"CIC 790.03(c) prohibits boycott, coercion, and intimidation.","id":"S2-11"},{"n":12,"stem":"An agent spreads a false rumor that a competing insurer is financially unsound. This is commonly called:","choices":["Boycott","Defamation","Rebating","Twisting"],"answer":1,"area":null,"explanation":"Untrue statements about a person in the business of insurance fall under CIC 790.03(b).","id":"S2-12"},{"n":13,"stem":"Giving a prospect part of the agent's commission as an inducement to buy is commonly called:","choices":["Rebating","Sliding","Churning","Twisting"],"answer":0,"area":null,"explanation":"Rebating = an inducement not specified in the policy (see plan note on California's rebating rules).","id":"S2-13"},{"n":14,"stem":"Under the Unfair Practices article, who may enforce its provisions?","choices":["The Department of Managed Health Care","Any licensed agent","Only the Insurance Commissioner","Any policyholder through a private lawsuit"],"answer":2,"area":null,"explanation":"The CDI objectives state only the Commissioner may enforce the Unfair Practices Act.","id":"S2-14"},{"n":15,"stem":"Under 18 U.S.C. section 1033, a person convicted of a felony involving dishonesty or breach of trust may work in the business of insurance only with:","choices":["Completion of extra CE hours","A letter from an employer","A surety bond","Written consent from the insurance regulator"],"answer":3,"area":null,"explanation":"Section 1033 bars prohibited persons absent written regulatory consent.","id":"S2-15"},{"n":16,"stem":"A California accident and health or sickness agent must complete how many CE hours per two-year license term?","choices":["24 hours, including 3 hours of ethics","12 hours, including 1 hour of ethics","40 hours, including 4 hours of ethics","20 hours, including 2 hours of ethics"],"answer":0,"area":null,"explanation":"CIC 1749.3(b): 24 hours, 3 in ethics (1 hour on insurance fraud).","id":"S2-16"},{"n":17,"stem":"The 12 hours of study on ethics and the California Insurance Code must be completed:","choices":["Before scheduling the exam","Only for nonresident applicants","Within 2 years after licensing","Before the license can be issued"],"answer":3,"area":null,"explanation":"CDI FAQ: not required to sit the exam, but required before license issuance; includes 1 hour on fraud.","id":"S2-17"},{"n":18,"stem":"Before an A&H agent can transact business for an insurer, the insurer must file a:","choices":["Surplus line affidavit","Power of attorney","Certificate of authority","Notice of appointment"],"answer":3,"area":null,"explanation":"CIC 1704-1705 govern notices of appointment.","id":"S2-18"},{"n":19,"stem":"Regarding an 'accident and health or sickness solicitor' license, California:","choices":["Has no such license","Issues it only to employees of HMOs","Issues it after a 20-hour course","Requires it for all telemarketers"],"answer":0,"area":null,"explanation":"CIC 1704(d): there is no A&H solicitor license.","id":"S2-19"},{"n":20,"stem":"The California Life and Health Insurance Guarantee Association (CLHIGA) exists to:","choices":["License agents","Approve insurer rates","Protect policyholders if a member life or health insurer becomes insolvent","Guarantee investment returns on annuities"],"answer":2,"area":null,"explanation":"CIC 1067 et seq. set CLHIGA's purpose and coverage limits.","id":"S2-20"},{"n":21,"stem":"The Gramm-Leach-Bliley Act requires financial institutions, including insurers, to:","choices":["Sell customer data only to affiliates","Provide privacy notices describing their information-sharing practices","Register with the FBI","Eliminate all data collection"],"answer":1,"area":null,"explanation":"GLBA and California privacy laws regulate disclosure of nonpublic personal information.","id":"S2-21"},{"n":22,"stem":"Under the Fair Claims Settlement Practices Regulations, an insurer must respond to a Department of Insurance inquiry about a claim within:","choices":["7 calendar days","15 calendar days","21 calendar days","40 calendar days"],"answer":2,"area":null,"explanation":"10 CCR 2695.5(a): complete written response within 21 calendar days.","id":"S2-22"},{"n":23,"stem":"Under the Fair Claims regulations, a licensee must respond to a claimant's communication that reasonably suggests a response is expected within:","choices":["15 calendar days","5 calendar days","60 calendar days","30 calendar days"],"answer":0,"area":null,"explanation":"10 CCR 2695.5(b).","id":"S2-23"},{"n":24,"stem":"If an insured knowingly signs a claim form containing false information, the insured may be guilty of:","choices":["Defamation","Rebating","Perjury","Twisting"],"answer":2,"area":null,"explanation":"The CDI objectives note signing a false claim form may constitute perjury.","id":"S2-24"},{"n":25,"stem":"Placing the customer's interests first, using plain language, and conducting periodic coverage reviews are examples of:","choices":["Ethical standards for insurance professionals","Optional marketing techniques","Requirements only for HMOs","Underwriting rules"],"answer":0,"area":null,"explanation":"The objectives list these as codes of ethics; the Code alone is NOT a complete ethics guide.","id":"S2-25"}],"minutes":30,"meta":"25 questions  |  Time limit: 30 minutes  |  Target: 80% or higher (20+ correct)","notes":[],"tagged":false},{"code":"S3","title":"Practice Set 3: Policy Provisions, Renewability, Limited Policies, Underwriting, Application, Delivery & Premiums (II, IV.A.2)","questions":[{"n":1,"stem":"The Entire Contract; Changes provision states that:","choices":["The agent may waive any provision in writing","The application is never part of the contract","The policy, endorsements, and attached papers are the entire contract, and no agent may change it","Oral statements by the agent are binding"],"answer":2,"area":null,"explanation":"CIC 10350.1: only an executive officer may approve changes.","id":"S3-1"},{"n":2,"stem":"Under Time Limit on Certain Defenses (Form A), after two years from issue, misstatements in the application may not void the policy unless they are:","choices":["Fraudulent","Unintentional","About occupation","About age"],"answer":0,"area":null,"explanation":"CIC 10350.2: after two years only fraudulent misstatements can be used.","id":"S3-2"},{"n":3,"stem":"The minimum grace period for a disability policy with an
